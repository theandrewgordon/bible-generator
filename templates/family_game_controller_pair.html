<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pair private controller · Faith Sparks</title><link rel="stylesheet" href="{{ url_for('static', filename='bible_bee.css') }}?v={{ static_v|default(1) }}"></head><body class="bee-body"><main class="bee-home"><section class="setup-sign-in"><p class="round-meta">PRIVATE CONTROLLER · DO NOT CAST</p><h1>Pair with room {{ code }}</h1><p>Enter the private pairing code shown only on the creator’s screen. It expires in about ten minutes and works once.</p>{% if error %}<p class="setup-error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Private pairing code<input name="pairing_token" autocomplete="off" required></label><button class="bee-button primary large" type="submit">Pair controller</button></form></section></main></body></html>
