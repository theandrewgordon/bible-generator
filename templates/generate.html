{% extends "base.html" %} {% block title %}Generate Bible Worksheet | Faith
Sparks Printables{% endblock %} {% block content %}
<h1 style="text-align: center">Create Your Worksheet</h1>

<form
  method="POST"
  action="/generate"
  onsubmit="return handleSubmit()"
  style="max-width: 100%"
>
  <label for="verse">Bible Verse(s)</label>
  <input
    type="text"
    id="verseInput"
    placeholder="e.g. John 3:16 or Gen 1:1 (KJV)"
    autocomplete="off"
    style="
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 8px;
    "
  />

  <div
    id="tagsContainer"
    style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px"
  ></div>
  <input type="hidden" name="verse" id="verseHidden" />

  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    "
  >
    <label for="version" style="font-weight: 600">Bible Version</label>
    <button
      type="button"
      onclick="clearVerses()"
      class="button delete"
      style="padding: 6px 12px; font-size: 0.9em"
    >
      Clear
    </button>
  </div>

  <select
    name="version"
    id="version"
    style="
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    "
  >
    <option value="auto" selected>Auto-detect from input</option>
    <option value="esv">English Standard Version (ESV)</option>
    <option value="kjv">King James Version (KJV)</option>
  </select>

  <details style="margin-bottom: 20px">
    <summary style="cursor: pointer; font-weight: 600">
      ⚙️ Advanced Options
    </summary>
    <div
      style="
        padding: 12px;
        background: #f0f0f0;
        border-radius: 6px;
        margin-top: 8px;
      "
    >
      <label class="checkbox-label">
        <input type="checkbox" name="cursive" />
        Use cursive tracing font
      </label>
    </div>
  </details>

  <div
    id="preview"
    style="
      display: none;
      background: var(--box);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
    "
  ></div>

  <button type="submit" class="button" style="width: 100%">
    Generate Worksheet
  </button>

  <div id="spinner" style="display: none; text-align: center; margin-top: 20px">
    <img src="/static/spinner.gif" alt="Loading..." style="width: 48px" />
    <p>Generating your worksheet...</p>
  </div>
</form>

<a
  href="/download_all"
  class="button"
  style="
    display: block;
    text-align: center;
    margin: 20px auto;
    max-width: 280px;
  "
>
  ⬇ Download All Worksheets
</a>
{% endblock %} {% block extra_scripts %}
<script>
  let tags = [];

  document
    .getElementById("verseInput")
    .addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const val = this.value.trim();
        if (val && !tags.includes(val)) {
          tags.push(val);
          this.value = "";
          updateTags();
          fetchPreview();
        }
      }
    });

  function updateTags() {
    const container = document.getElementById("tagsContainer");
    const hidden = document.getElementById("verseHidden");
    container.innerHTML = "";
    tags.forEach((tag, i) => {
      const span = document.createElement("span");
      span.innerHTML = `${tag} <button type="button" onclick="removeTag(${i})" style="margin-left:6px;">✖</button>`;
      span.style =
        "background: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.9em";
      container.appendChild(span);
    });
    hidden.value = tags.join(", ");
  }

  function removeTag(index) {
    tags.splice(index, 1);
    updateTags();
    fetchPreview();
  }

  function clearVerses() {
    tags = [];
    document.getElementById("verseInput").value = "";
    updateTags();
    document.getElementById("preview").style.display = "none";
  }

  function fetchPreview() {
    const version = document.getElementById("version").value;
    const preview = document.getElementById("preview");

    if (tags.length === 0) {
      preview.style.display = "none";
      preview.innerHTML = "";
      return;
    }

    const params = new URLSearchParams({ verse: tags.join(",") });
    if (version && version !== "auto") params.append("version", version);

    fetch(`/preview?${params.toString()}`)
      .then((res) => (res.ok ? res.text() : ""))
      .then((text) => {
        if (text) {
          preview.style.display = "block";
          preview.innerHTML = text;
        } else {
          preview.style.display = "none";
        }
      })
      .catch(() => {
        preview.style.display = "none";
      });
  }

  function handleSubmit() {
    if (tags.length === 0) {
      alert("Please enter at least one Bible verse.");
      return false;
    }
    document.getElementById("spinner").style.display = "block";
    return true;
  }

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
</script>
{% endblock %}
