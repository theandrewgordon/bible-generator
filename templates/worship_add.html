{% extends "base.html" %} {% block content %}
<h1>Add Song</h1>
<p><a href="{{ url_for('worship') }}">← Back to Worship</a></p>

<div style="display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;margin-top:1.5rem">

  <!-- Manual Entry -->
  <div style="flex:1;min-width:320px">
    <h2 style="margin-top:0">Manual Entry</h2>
    <form method="post" action="{{ url_for('worship_add') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">Title *</label>
        <input type="text" name="title" required style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">Artist</label>
        <input type="text" name="artist" style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">Key</label>
        <input type="text" name="key" style="width:80px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px">
      </div>
      <input type="hidden" name="type" value="song">

      <h3 style="margin-bottom:.5rem">Parts</h3>
      <div id="parts-list"></div>
      <button type="button" id="add-part-btn"
        style="padding:6px 14px;border:1px dashed #94a3b8;border-radius:6px;background:transparent;cursor:pointer;margin-bottom:1.5rem">
        + Add Part
      </button>

      <h3 style="margin-bottom:.25rem">Arrangement</h3>
      <p style="font-size:.85em;color:var(--text-secondary);margin-top:0">
        Click parts below to add them to the arrangement in order.
        Click × to remove from sequence.
      </p>
      <div id="arrangement-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
      <div id="arrangement-order"
        style="display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:8px;border:1px dashed #cbd5e1;border-radius:8px;margin-bottom:1.5rem">
        <span id="arrangement-placeholder" style="color:var(--text-secondary);font-size:.85em;align-self:center">
          Arrangement will appear here…
        </span>
      </div>
      <input type="hidden" name="arrangement" id="arrangement-input">

      <button type="submit"
        style="padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600">
        Save Song
      </button>
    </form>
  </div>

  <!-- AI Parse -->
  <div style="flex:1;min-width:320px">
    <h2 style="margin-top:0">AI Parse</h2>
    <form method="post" action="{{ url_for('worship_add_parse') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">
          Title <span style="font-weight:400;color:var(--text-secondary)">(optional — AI will infer)</span>
        </label>
        <input type="text" name="title" style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">Artist</label>
        <input type="text" name="artist" style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">Key</label>
        <input type="text" name="key" style="width:80px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px">
      </div>
      <div style="margin-bottom:1rem">
        <label style="display:block;font-weight:600;margin-bottom:4px">Paste Lyrics *</label>
        <textarea name="raw_lyrics" rows="18" required
          style="width:100%;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-family:monospace;font-size:.85em;box-sizing:border-box"
          placeholder="[Verse 1]&#10;Line one&#10;Line two&#10;&#10;[Chorus]&#10;Holy holy holy…"></textarea>
      </div>

      <button type="submit"
        style="padding:8px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600">
        Parse with AI →
      </button>
    </form>
  </div>

</div>

<script>
(function () {
  const partsList = document.getElementById('parts-list');
  const chipsWrap = document.getElementById('arrangement-chips');
  const orderWrap = document.getElementById('arrangement-order');
  const orderInput = document.getElementById('arrangement-input');
  const placeholder = document.getElementById('arrangement-placeholder');

  function updateHidden() {
    const names = Array.from(orderWrap.querySelectorAll('[data-name]')).map(el => el.dataset.name);
    orderInput.value = names.join(',');
    placeholder.style.display = names.length ? 'none' : 'inline';
  }

  function findChip(name) {
    return Array.from(chipsWrap.children).find(el => el.dataset.name === name) || null;
  }

  function removeFromOrder(name) {
    orderWrap.querySelectorAll('[data-name]').forEach(el => {
      if (el.dataset.name === name) el.remove();
    });
    updateHidden();
  }

  function addToOrder(name) {
    const tag = document.createElement('span');
    tag.dataset.name = name;
    tag.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--primary);color:#fff;font-size:.85em';
    const label = document.createTextNode(name + ' ');
    const x = document.createElement('button');
    x.type = 'button';
    x.textContent = '×';
    x.setAttribute('aria-label', 'Remove ' + name + ' from arrangement');
    x.style.cssText = 'background:none;border:none;color:#fff;cursor:pointer;font-size:1.1em;line-height:1;padding:0';
    x.addEventListener('click', function (e) {
      e.stopPropagation();
      tag.remove();
      updateHidden();
    });
    tag.appendChild(label);
    tag.appendChild(x);
    orderWrap.appendChild(tag);
    updateHidden();
  }

  function upsertChip(name) {
    if (!name) return;
    if (findChip(name)) return; // already exists
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.dataset.name = name;
    chip.textContent = name;
    chip.style.cssText = 'padding:4px 12px;border-radius:999px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;font-size:.85em';
    chip.addEventListener('click', function () { addToOrder(name); });
    chipsWrap.appendChild(chip);
  }

  function removeChip(name) {
    const chip = findChip(name);
    if (chip) chip.remove();
    removeFromOrder(name);
  }

  function rebuildChips() {
    const currentNames = new Set(
      Array.from(partsList.querySelectorAll('.part-name-input')).map(el => el.value.trim()).filter(Boolean)
    );
    // Remove chips whose part was deleted/renamed
    Array.from(chipsWrap.children).forEach(chip => {
      if (!currentNames.has(chip.dataset.name)) chip.remove();
    });
    // Add chips for any new names
    currentNames.forEach(name => upsertChip(name));
  }

  let partCount = 0;

  function addPart(defaultName) {
    partCount++;
    const row = document.createElement('div');
    row.style.cssText = 'border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:10px';

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.name = 'part_name';
    nameInput.className = 'part-name-input';
    nameInput.placeholder = 'e.g. verse1, chorus, bridge';
    nameInput.value = defaultName || '';
    nameInput.style.cssText = 'flex:1;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-weight:600';

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.textContent = '✕';
    removeBtn.setAttribute('aria-label', 'Remove part');
    removeBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:#ef4444;font-size:1.1em';

    const textarea = document.createElement('textarea');
    textarea.name = 'part_lines';
    textarea.rows = 4;
    textarea.placeholder = 'One lyric line per line';
    textarea.style.cssText = 'width:100%;padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-family:monospace;font-size:.85em;box-sizing:border-box';

    let prevName = defaultName || '';

    nameInput.addEventListener('blur', function () {
      const newName = nameInput.value.trim();
      if (newName !== prevName) {
        if (prevName) removeChip(prevName);
        if (newName) upsertChip(newName);
        prevName = newName;
      }
    });

    removeBtn.addEventListener('click', function () {
      const name = nameInput.value.trim();
      if (name) removeChip(name);
      row.remove();
    });

    header.appendChild(nameInput);
    header.appendChild(removeBtn);
    row.appendChild(header);
    row.appendChild(textarea);
    partsList.appendChild(row);

    if (defaultName) upsertChip(defaultName);
  }

  document.getElementById('add-part-btn').addEventListener('click', function () { addPart(''); });

  // Seed with verse1 and chorus
  addPart('verse1');
  addPart('chorus');

  updateHidden();
})();
</script>
{% endblock %}
