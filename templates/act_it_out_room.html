<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Room {{ code }} · {{ game_title|default('Act It Out') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bible_bee.css') }}?v={{ static_v|default(1) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='act_it_out.css') }}?v={{ static_v|default(1) }}">
    <script src="{{ url_for('static', filename='act_it_out.js') }}?v={{ static_v|default(1) }}" defer></script>
  </head>
  <body class="bee-body room-body act-room-body" data-room-code="{{ code }}" data-role="{{ role }}" data-game-slug="{{ game_slug|default('act-it-out') }}" data-game-title="{{ game_title|default('Act It Out') }}" data-game-home="{% if game_title == 'Family Game Night' %}{{ url_for('act_it_out.family_game_night_setup') }}{% elif game_slug|default('act-it-out') == 'draw-it' %}{{ url_for('act_it_out.draw_it_home') }}{% else %}{{ url_for('act_it_out.home') }}{% endif %}">
    <header class="bee-header room-header">
      <a class="bee-brand" href="{% if game_title == 'Family Game Night' %}{{ url_for('act_it_out.family_game_night_setup') }}{% elif game_slug|default('act-it-out') == 'draw-it' %}{{ url_for('act_it_out.draw_it_home') }}{% else %}{{ url_for('act_it_out.home') }}{% endif %}">
        <span class="faithsparks-wordmark">Faith<span>Sparks</span></span>
        <span class="brand-divider"></span>
        <strong>{{ game_title|default('Act It Out') }}</strong>
      </a>
      <div class="room-code-block">
        <span>Room</span>
        <strong>{{ code }}</strong>
      </div>
      <label class="read-mode-control">
        <span>Read aloud</span>
        <select id="act-read-mode">
          <option value="off">Nothing</option>
          <option value="prompt">Prompt only</option>
          <option value="all">Everything</option>
        </select>
      </label>
    </header>
    <main id="act-app" class="game-shell" aria-live="polite">
      <section class="game-stage loading-stage">
        <div class="loading-spark" aria-hidden="true">✦</div>
        <h1>Gathering players…</h1>
      </section>
    </main>
    <div id="act-connection" class="connection-status" role="status" aria-live="polite">Reconnecting…</div>
    <div id="act-toast" class="bee-toast" role="status" aria-live="polite"></div>
  </body>
</html>
