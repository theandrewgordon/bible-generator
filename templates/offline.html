<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>You're offline | Faith Sparks</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #fffdf8; color: #19332d; }
    main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: .5rem 0; }
    p { color: #4b5d57; }
    button { margin-top: 1rem; padding: .7rem 1.4rem; border: 0; border-radius: 10px; background: #19332d; color: #fff; font: inherit; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { background: #111a17; color: #f3efe6; } p { color: #b7c4bf; } button { background: #f3efe6; color: #111a17; } }
  </style>
</head>
<body>
  <main>
    <img src="/static/faith_sparks_logo_192.png" alt="" width="72" height="72">
    <h1>You're offline</h1>
    <p>Faith Sparks needs a connection for this page. Worksheets you already downloaded are still in your Files or Downloads.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
