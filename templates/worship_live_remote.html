<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ live.name }} · Remote</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#07111f;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}
    body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    .wr-shell{width:min(620px,100%);margin:auto;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:12px 0}
    .wr-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .wr-title{margin:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wr-status{display:flex;align-items:center;gap:6px;color:#cbd5e1;font-size:.78rem;white-space:nowrap}.wr-status::before{content:"";width:9px;height:9px;border-radius:50%;background:#22c55e}.wr-status.is-offline::before{background:#f59e0b}
    .wr-preview{flex:1;min-height:260px;border:1px solid #233146;border-radius:18px;background:#0f172a;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden}
    .wr-preview.is-blank{background:#000}.wr-preview.is-blank>*{visibility:hidden}
    .wr-kind{position:absolute;left:14px;top:12px;color:#94a3b8;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .wr-song{font-size:clamp(1.6rem,7vw,2.8rem);line-height:1.05;margin:0 0 .7rem;font-weight:850}
    .wr-lines{font-size:clamp(1.35rem,5.8vw,2.2rem);line-height:1.18;font-weight:750;white-space:pre-line}
    .wr-note{margin:.9rem 0 0;color:#fcd34d;font-size:.94rem;line-height:1.3;font-weight:700}
    .wr-progress{text-align:center;color:#cbd5e1;font-size:.88rem;font-weight:700}
    .wr-next-up{min-height:1.25rem;text-align:center;color:#94a3b8;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wr-nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
    .wr-btn{min-height:82px;border:0;border-radius:16px;font-size:1.15rem;font-weight:850;cursor:pointer;touch-action:manipulation}.wr-prev{background:#334155;color:#fff}.wr-next{background:#0ea5a8;color:#fff;font-size:1.35rem}.wr-btn:active{transform:scale(.985)}
    .wr-smart{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wr-smart-btn{min-height:48px;border:1px solid #334155;border-radius:13px;background:#172235;color:#e2e8f0;font-size:.92rem;font-weight:800}.wr-smart-btn:disabled{opacity:.4}
    .wr-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wr-tool{min-height:54px;border:1px solid #475569;border-radius:13px;background:#111c2e;color:#fff;font-size:.95rem;font-weight:750}.wr-tool.is-blank{background:#b91c1c;border-color:#ef4444}.wr-tool:disabled,.wr-btn:disabled{opacity:.58}
    .wr-jump{width:100%;border:1px solid #475569;border-radius:12px;background:#111c2e;color:#fff;padding:12px;font-size:1rem}
    .wr-end{border:0;background:transparent;color:#fca5a5;min-height:42px;font-weight:700}.wr-help{text-align:center;color:#94a3b8;font-size:.75rem;margin:0 0 4px}
  </style>
</head>
<body>
  <main class="wr-shell">
    <header class="wr-head"><h1 class="wr-title">{{ live.name }}</h1><span class="wr-status" id="wr-status">Connected</span></header>
    <section class="wr-preview{% if live.blank %} is-blank{% endif %}" id="wr-preview" aria-live="polite">
      <div><div class="wr-kind" id="wr-kind"></div><h2 class="wr-song" id="wr-song"></h2><div class="wr-lines" id="wr-lines"></div><p class="wr-note" id="wr-note"></p></div>
    </section>
    <div class="wr-progress" id="wr-progress">1 / {{ slides|length }}</div>
    <div class="wr-next-up" id="wr-next-up"></div>
    <div class="wr-nav"><button class="wr-btn wr-prev" data-action="previous">← Previous</button><button class="wr-btn wr-next" data-action="next">Next →</button></div>
    <div class="wr-smart"><button class="wr-smart-btn" id="wr-chorus" data-smart="chorus">↩ Chorus</button><button class="wr-smart-btn" id="wr-next-song" data-smart="next-song">Next song ⏭</button></div>
    <div class="wr-tools"><button class="wr-tool" id="wr-blank" data-action="toggle_blank">Blank screen</button><button class="wr-tool" id="wr-awake">Keep screen awake</button></div>
    <select class="wr-jump" id="wr-jump" aria-label="Jump to slide">
      {% for slide in slides %}<option value="{{ loop.index0 }}">{{ loop.index }} · {{ slide.title }}{% if slide.part_label %} — {{ slide.part_label }}{% endif %}</option>{% endfor %}
    </select>
    <button class="wr-end" id="wr-end">End this session</button>
    <p class="wr-help">This remote controls only the current Live Worship session and expires automatically.</p>
  </main>
  <script>
  (function(){
    var sessionId={{ session_id|tojson }};
    var slides={{ slides|tojson }};
    var current={{ live.current_index|int }};
    var blank={{ live.blank|tojson }};
    var revision={{ live.revision|int }};
    var preview=document.getElementById('wr-preview'),statusEl=document.getElementById('wr-status'),progress=document.getElementById('wr-progress'),nextUp=document.getElementById('wr-next-up'),jump=document.getElementById('wr-jump'),blankBtn=document.getElementById('wr-blank'),awakeBtn=document.getElementById('wr-awake'),chorusBtn=document.getElementById('wr-chorus'),nextSongBtn=document.getElementById('wr-next-song');
    var wakeLock=null,pollTimer=null,sending=false,ended=false;
    function smartTarget(kind){
      if(kind==='next-song'){for(var i=current+1;i<slides.length;i++){if(slides[i].kind==='divider')return i;}return -1;}
      var songId=(slides[current]||{}).id;for(var j=0;j<slides.length;j++){var part=String(slides[j].part||slides[j].part_label||'').toLowerCase();if(slides[j].id===songId&&slides[j].kind==='lyric'&&part.indexOf('chorus')!==-1)return j;}return -1;
    }
    function updateSmartButtons(){chorusBtn.disabled=sending||ended||smartTarget('chorus')<0;nextSongBtn.disabled=sending||ended||smartTarget('next-song')<0;}
    function draw(index,isBlank){
      current=Math.max(0,Math.min(slides.length-1,Number(index)||0));blank=!!isBlank;var slide=slides[current]||{};
      preview.classList.toggle('is-blank',blank);blankBtn.classList.toggle('is-blank',blank);blankBtn.textContent=blank?'Show screen':'Blank screen';
      document.getElementById('wr-kind').textContent=slide.kind==='lyric'?(slide.part_label||'Lyrics'):(slide.type||slide.kind||'Slide');
      document.getElementById('wr-song').textContent=slide.kind==='lyric'?'':(slide.title||'');
      document.getElementById('wr-lines').textContent=(slide.lines||[]).join('\n');
      var note=slide.note||'';document.getElementById('wr-note').textContent=note;document.getElementById('wr-note').style.display=note?'block':'none';
      progress.textContent=(current+1)+' / '+slides.length+' · '+(slide.title||'');jump.value=String(current);
      var upcoming=slides[current+1];nextUp.textContent=upcoming?'Up next: '+(upcoming.part_label||upcoming.title||'Slide'):'End of set';
      updateSmartButtons();
    }
    function connected(ok){statusEl.classList.toggle('is-offline',!ok);statusEl.textContent=ok?'Connected':'Reconnecting…';}
    function requestWakeLock(showFailure){
      if(wakeLock)return;if(!('wakeLock'in navigator)){if(showFailure)awakeBtn.textContent='Not supported';return;}
      navigator.wakeLock.request('screen').then(function(lock){wakeLock=lock;awakeBtn.textContent='Screen stays awake';lock.addEventListener('release',function(){wakeLock=null;awakeBtn.textContent='Keep screen awake';});}).catch(function(){wakeLock=null;if(showFailure)awakeBtn.textContent='Could not enable';});
    }
    function send(action,index){
      if(sending||ended)return Promise.resolve();requestWakeLock(false);sending=true;document.querySelectorAll('[data-action],[data-smart]').forEach(function(btn){btn.disabled=true;});
      if(action==='next')draw(current+1,blank);else if(action==='previous')draw(current-1,blank);else if(action==='toggle_blank')draw(current,!blank);else if(action==='index')draw(index,blank);
      return fetch('/worship/live/control/'+encodeURIComponent(sessionId),{method:'POST',headers:{'Content-Type':'application/json','X-Worship-Live':'1'},body:JSON.stringify({action:action,index:index}),credentials:'same-origin'})
        .then(function(r){return r.json();}).then(function(data){if(!data.ok)throw new Error(data.error||'Remote failed');revision=data.revision;draw(data.current_index,data.blank);connected(true);if(navigator.vibrate)navigator.vibrate(18);}).catch(function(){connected(false);}).finally(function(){sending=false;document.querySelectorAll('[data-action]').forEach(function(btn){btn.disabled=false;});updateSmartButtons();});
    }
    document.querySelectorAll('[data-action]').forEach(function(btn){btn.addEventListener('click',function(){send(btn.dataset.action);});});
    document.querySelectorAll('[data-smart]').forEach(function(btn){btn.addEventListener('click',function(){var target=smartTarget(btn.dataset.smart);if(target>=0)send('index',target);});});
    jump.addEventListener('change',function(){send('index',Number(jump.value));});
    awakeBtn.addEventListener('click',function(){requestWakeLock(true);});
    function schedulePoll(delay){clearTimeout(pollTimer);if(!ended&&document.visibilityState!=='hidden')pollTimer=setTimeout(poll,delay);}
    function endLocally(){ended=true;clearTimeout(pollTimer);if(wakeLock){var lock=wakeLock;wakeLock=null;lock.release().catch(function(){});}draw(current,true);statusEl.classList.add('is-offline');statusEl.textContent='Session ended';document.querySelectorAll('button,select').forEach(function(el){el.disabled=true;});}
    function poll(){fetch('/worship/live/state/'+encodeURIComponent(sessionId),{cache:'no-store',credentials:'same-origin'}).then(function(r){if(r.status===410)throw new Error('ended');return r.json();}).then(function(data){if(data.ok){if(data.revision!==revision){revision=data.revision;draw(data.current_index,data.blank);}connected(true);}else connected(false);schedulePoll(8000);}).catch(function(error){connected(false);if(error.message==='ended'){endLocally();return;}schedulePoll(8000);});}
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){requestWakeLock(false);poll();}else clearTimeout(pollTimer);});
    document.getElementById('wr-end').addEventListener('click',function(){if(ended||!window.confirm('End this Live Worship session for everyone?'))return;fetch('/worship/live/control/'+encodeURIComponent(sessionId),{method:'POST',headers:{'Content-Type':'application/json','X-Worship-Live':'1'},credentials:'same-origin',body:JSON.stringify({action:'end'})}).then(function(r){return r.json();}).then(function(data){if(!data.ok)throw new Error();endLocally();}).catch(function(){connected(false);});});
    draw(current,blank);poll();
  })();
  </script>
</body>
</html>
