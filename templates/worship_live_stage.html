<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ live.name }} · Stage View</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050b14;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}
    body{height:100dvh;padding:max(clamp(14px,2vw,28px),env(safe-area-inset-top)) max(clamp(14px,2vw,28px),env(safe-area-inset-right)) max(clamp(14px,2vw,28px),env(safe-area-inset-bottom)) max(clamp(14px,2vw,28px),env(safe-area-inset-left))}
    .st-shell{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) max-content;gap:clamp(10px,1.5vw,20px)}
    .st-head{grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:18px}.st-head-copy{min-width:0}
    .st-title{font-size:clamp(.9rem,1.7vw,1.35rem);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .st-context{margin-top:3px;color:#94a3b8;font-size:clamp(.68rem,1.05vw,.86rem);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .st-clock{font-size:clamp(1.3rem,2.8vw,2.4rem);font-variant-numeric:tabular-nums;font-weight:850}
    .st-message{grid-row:2;display:none;padding:12px 18px;border:2px solid #f59e0b;border-radius:14px;background:#451a03;color:#fef3c7;text-align:center;font-size:clamp(1rem,2.3vw,1.8rem);font-weight:850}
    .st-message.is-visible{display:block}
    .st-content{grid-row:3;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.75fr);gap:clamp(12px,1.6vw,22px);min-height:0}
    .st-card{border:1px solid #334155;border-radius:20px;background:#0f172a;padding:clamp(18px,3vw,42px);display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
    .st-label{color:#5eead4;font-size:clamp(.72rem,1.2vw,1rem);font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .st-cue{display:none;margin-top:1rem;padding:.65rem .8rem;border-left:4px solid #f59e0b;border-radius:6px;background:#451a03;color:#fef3c7;font-size:clamp(.78rem,1.35vw,1.05rem);line-height:1.25;font-weight:800}
    .st-cue.is-visible{display:block}
    .st-current-lines{white-space:pre-line;font-size:clamp(2rem,5.2vw,5.6rem);line-height:1.08;font-weight:850;text-wrap:balance}
    .st-current-title{font-size:clamp(2rem,5vw,5rem);line-height:1.04;margin:0;font-weight:850}
    .st-next{background:#0b1322;color:#cbd5e1}
    .st-next-lines{white-space:pre-line;font-size:clamp(1.25rem,2.5vw,2.45rem);line-height:1.15;font-weight:750}
    .st-next-title{font-size:clamp(1.4rem,3vw,2.8rem);line-height:1.08;margin:0}
    .st-footer{grid-row:4;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;color:#94a3b8;font-size:clamp(.78rem,1.25vw,1rem)}
    .st-status{text-align:center;color:#fcd34d;font-weight:800;min-height:1.2em}
    .st-timer{text-align:right;color:#fff;font-size:clamp(1.2rem,2.8vw,2.4rem);font-variant-numeric:tabular-nums;font-weight:900}
    .st-focus{justify-self:start;border:1px solid #475569;border-radius:999px;background:#111c2e;color:#e2e8f0;padding:8px 12px;font-weight:750;cursor:pointer}
    @media(max-width:700px){
      body{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
      .st-shell{gap:9px}.st-content{grid-template-columns:1fr;grid-template-rows:minmax(0,1.12fr) minmax(0,.88fr);gap:9px}
      .st-card{padding:14px 18px;border-radius:16px}.st-next{justify-content:flex-start}.st-label{font-size:.68rem;margin-bottom:.45rem}.st-cue{margin-top:.6rem;padding:.45rem .6rem;font-size:.72rem}
      .st-current-lines{font-size:clamp(1.55rem,7.1vw,3rem);line-height:1.05}.st-current-title{font-size:clamp(1.55rem,7vw,3rem)}
      .st-next-lines{font-size:clamp(1rem,4.2vw,1.55rem);line-height:1.1}.st-next-title{font-size:clamp(1.1rem,4.8vw,1.8rem)}
      .st-footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-self:end}.st-status{order:3;flex:0 0 100%;text-align:left}.st-timer{order:2;margin-left:auto}.st-focus{order:1}
    }
    @media(orientation:landscape) and (max-height:600px){body{padding:10px 14px}.st-shell{gap:9px}.st-card{padding:16px 22px}.st-label{margin-bottom:.55rem}.st-footer{font-size:.72rem}.st-focus{padding:6px 10px}}
  </style>
</head>
<body>
  <main class="st-shell">
    <header class="st-head"><div class="st-head-copy"><div class="st-title">{{ live.name }} · Stage View</div><div class="st-context" id="st-context"></div></div><time class="st-clock" id="st-clock"></time></header>
    <div class="st-message" id="st-message"></div>
    <section class="st-content">
      <article class="st-card" id="st-current-card"><div class="st-label" id="st-current-label">Current</div><h1 class="st-current-title" id="st-current-title"></h1><div class="st-current-lines" id="st-current-lines"></div><div class="st-cue" id="st-current-cue"></div></article>
      <article class="st-card st-next" id="st-next-card"><div class="st-label" id="st-next-label">Up next</div><h2 class="st-next-title" id="st-next-title"></h2><div class="st-next-lines" id="st-next-lines"></div></article>
    </section>
    <footer class="st-footer"><button class="st-focus" id="st-focus">Full screen + stay awake</button><div class="st-status" id="st-status"></div><div class="st-timer" id="st-timer"></div></footer>
  </main>
  <script>
  (function(){
    var sessionId={{ session_id|tojson }},slides={{ slides|tojson }},current={{ live.current_index|int }},revision={{ live.revision|int }};
    var clearWords={{ live.clear_words|default(false)|tojson }},blank={{ live.blank|tojson }},stageMessage={{ live.stage_message|default('')|tojson }};
    var timerMode={{ live.stage_timer_mode|default('')|tojson }},timerStarted=Number({{ live.stage_timer_started_epoch|default(0)|tojson }})||0,timerDuration=Number({{ live.stage_timer_duration|default(0)|tojson }})||0,serverOffset=0;
    var pollTimer=null,wakeLock=null,ended=false,pollFailures=0,fitFrame=null;
    var currentCard=document.getElementById('st-current-card'),nextCard=document.getElementById('st-next-card'),currentLabel=document.getElementById('st-current-label'),currentTitle=document.getElementById('st-current-title'),currentLines=document.getElementById('st-current-lines'),currentCue=document.getElementById('st-current-cue'),nextLabel=document.getElementById('st-next-label'),nextTitle=document.getElementById('st-next-title'),nextLines=document.getElementById('st-next-lines'),contextEl=document.getElementById('st-context'),messageEl=document.getElementById('st-message'),statusEl=document.getElementById('st-status'),timerEl=document.getElementById('st-timer'),focusBtn=document.getElementById('st-focus');
    function slideText(slide){return (slide&&slide.lines||[]).join('\n');}
    function slideLabel(slide,fallback){return slide?(slide.part_label||slide.type||slide.kind||fallback):fallback;}
    function stageLabel(prefix,slide){var bits=[prefix];if(slide&&slide.kind==='lyric'&&slide.title)bits.push(slide.title);bits.push(slideLabel(slide,'Slide'));return bits.join(' · ');}
    function itemContext(index){var boundaries=[];for(var i=0;i<slides.length;i++){if(i===0||(slides[i]||{}).id!==(slides[i-1]||{}).id)boundaries.push(i);}var position=0;for(var j=0;j<boundaries.length;j++){if(boundaries[j]<=index)position=j;}var slide=slides[index]||{},next=boundaries[position+1]===undefined?null:slides[boundaries[position+1]],bits=['Item '+(position+1)+' of '+boundaries.length];if(slide.key)bits.push('Key '+slide.key);if(next)bits.push('Next: '+(next.title||'item'));return bits.join(' · ');}
    function shrinkToFit(card,elements,minSize){elements.forEach(function(el){el.style.removeProperty('font-size');});var sizes=elements.map(function(el){return parseFloat(getComputedStyle(el).fontSize)||minSize;});for(var tries=0;card.scrollHeight>card.clientHeight+1&&tries<30;tries++){var changed=false;elements.forEach(function(el,index){if(el.textContent&&sizes[index]>minSize){sizes[index]=Math.max(minSize,sizes[index]-2);el.style.fontSize=sizes[index]+'px';changed=true;}});if(!changed)break;}}
    function fitCards(){fitFrame=null;shrinkToFit(currentCard,[currentTitle,currentLines],18);shrinkToFit(nextCard,[nextTitle,nextLines],14);}
    function queueFit(){if(fitFrame)cancelAnimationFrame(fitFrame);fitFrame=requestAnimationFrame(fitCards);}
    function draw(){
      var slide=slides[current]||{},upcoming=slides[current+1]||null;
      currentLabel.textContent=stageLabel('Current',slide);currentTitle.textContent=slide.kind==='lyric'?'':(slide.title||'');currentLines.textContent=slideText(slide);
      contextEl.textContent=itemContext(current);
      currentCue.textContent=slide.note?'Saved cue · '+slide.note:'';currentCue.classList.toggle('is-visible',!!slide.note);
      nextLabel.textContent=upcoming?stageLabel('Up next',upcoming):'Up next';nextTitle.textContent=upcoming&&upcoming.kind!=='lyric'?(upcoming.title||''):'';nextLines.textContent=upcoming?slideText(upcoming):'End of set';
      messageEl.textContent=stageMessage;messageEl.classList.toggle('is-visible',!!stageMessage);
      statusEl.textContent=ended?'Session ended':pollFailures>=2?'Reconnecting…':blank?'Audience screen is black':clearWords?'Audience words are cleared':'';queueFit();
    }
    function formatSeconds(total){total=Math.max(0,Math.floor(Math.abs(total)));var minutes=Math.floor(total/60),seconds=total%60;return String(minutes)+':'+String(seconds).padStart(2,'0');}
    function updateTime(){
      document.getElementById('st-clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      if(!timerMode){timerEl.textContent='';return;}
      var now=Date.now()/1000+serverOffset,elapsed=Math.max(0,now-timerStarted);
      var remaining=timerDuration-elapsed;
      timerEl.textContent=timerMode==='countdown'?(remaining<0?'Over '+formatSeconds(remaining):'Remaining '+formatSeconds(remaining)):'Elapsed '+formatSeconds(elapsed);
      timerEl.style.color=timerMode==='countdown'&&remaining<=30?'#fca5a5':'#fff';
    }
    function applyState(data){pollFailures=0;current=Math.max(0,Math.min(slides.length-1,Number(data.current_index)||0));revision=Number(data.revision)||0;blank=!!data.blank;clearWords=!!data.clear_words;stageMessage=data.stage_message||'';timerMode=data.stage_timer_mode||'';timerStarted=Number(data.stage_timer_started_epoch)||0;timerDuration=Number(data.stage_timer_duration)||0;if(data.server_epoch)serverOffset=Number(data.server_epoch)-Date.now()/1000;draw();updateTime();}
    function schedulePoll(delay){clearTimeout(pollTimer);if(!ended&&document.visibilityState!=='hidden')pollTimer=setTimeout(poll,delay);}
    function poll(){fetch('/worship/live/state/'+encodeURIComponent(sessionId),{cache:'no-store',credentials:'same-origin'}).then(function(r){if(r.status===410)throw new Error('ended');return r.json();}).then(function(data){if(data.ok){applyState(data);schedulePoll(1500);}else{pollFailures++;draw();schedulePoll(2500);}}).catch(function(error){if(error.message==='ended'){ended=true;draw();return;}pollFailures++;draw();schedulePoll(2500);});}
    function updateFocusButton(){focusBtn.textContent=document.fullscreenElement?'Exit full screen':wakeLock?'Full screen · awake':'Full screen + stay awake';}
    function requestWakeLock(showFailure){if(wakeLock)return;if(!('wakeLock'in navigator)){if(showFailure&&!document.fullscreenElement)focusBtn.textContent='Full screen';return;}navigator.wakeLock.request('screen').then(function(lock){wakeLock=lock;updateFocusButton();lock.addEventListener('release',function(){wakeLock=null;updateFocusButton();});}).catch(function(){if(showFailure&&!document.fullscreenElement)focusBtn.textContent='Full screen unavailable';});}
    focusBtn.addEventListener('click',function(){
      if(document.fullscreenElement){if(document.exitFullscreen)document.exitFullscreen();return;}
      if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){focusBtn.textContent=wakeLock?'Screen stays awake':'Full screen unavailable';});
      requestWakeLock(true);
    });
    window.addEventListener('resize',queueFit);document.addEventListener('fullscreenchange',function(){updateFocusButton();queueFit();});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){requestWakeLock(false);poll();}else clearTimeout(pollTimer);});
    draw();updateTime();setInterval(updateTime,250);poll();
  })();
  </script>
</body>
</html>
