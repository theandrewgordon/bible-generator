<header class="main-header">
  <div class="logo-nav">
    <a href="/" class="logo">
      <img
        src="/static/faith_sparks_logo.png"
        alt="Faith Sparks Logo"
      />
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="/">🏠 Home</a>
      <a href="/generate">📝 Generate</a>
      <a href="/browse">🔎 Browse</a>
      <a href="/history">📚 History</a>
      {% if is_admin %}<a href="/admin/collections">🛠️ Admin</a>{% endif %}
      <a href="/about">ℹ️ About</a>
      {% if is_admin %}<a href="/admin/analytics">📈 Analytics</a>{% endif %}
    </nav>
  </div>

  <div class="auth-theme">
    {% if session.user_info %}
    <span class="user-name"
      >👤 {{ session.user_info.email.split('@')[0] }}</span
    >
    <a href="/logout" class="auth-link logout">🚪 Logout</a>
    {% else %}
    <a href="{{ url_for('google.login') }}" class="auth-link">🔐 Login</a>
    {% endif %}
    <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
  </div>

</header>
