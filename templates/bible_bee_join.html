<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#fff9ed">
    <title>Join Room {{ code }} · Family Bible Bee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bible_bee.css') }}?v={{ static_v|default(1) }}">
  </head>
  <body class="bee-body join-body">
    <main class="join-screen">
      <a class="bee-brand centered" href="{{ url_for('bible_bee.home') }}">
        <span class="faithsparks-wordmark">Faith<span>Sparks</span></span>
        <strong>Family Bible Bee</strong>
      </a>
      <section class="join-card">
        <p class="room-label">Room {{ code }}</p>
        <h1>Who’s playing?</h1>
        <p>Use a first name or a family nickname everyone recognizes.</p>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form id="bee-join-form" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input id="avatar-data" type="hidden" name="avatar_data">
          <label for="player-name">Player name</label>
          <input id="player-name" name="player_name" maxlength="18" autocomplete="nickname" placeholder="Ada" required autofocus>
          <div class="selfie-picker">
            <div id="selfie-preview" class="selfie-preview" aria-hidden="true">☺</div>
            <div>
              <label class="bee-button secondary selfie-button" for="player-selfie">Add a selfie</label>
              <input id="player-selfie" type="file" accept="image/*" capture="user">
              <p>Optional. It stays with this temporary game room.</p>
            </div>
          </div>
          <button class="bee-button primary large" type="submit">Join the game</button>
        </form>
      </section>
    </main>
    <script>
      const selfieInput = document.querySelector("#player-selfie");
      const avatarData = document.querySelector("#avatar-data");
      const selfiePreview = document.querySelector("#selfie-preview");
      const joinButton = document.querySelector("#bee-join-form button[type='submit']");

      selfieInput.addEventListener("change", () => {
        const file = selfieInput.files && selfieInput.files[0];
        if (!file) return;
        joinButton.disabled = true;
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext("2d");
            const size = Math.min(image.naturalWidth, image.naturalHeight);
            const sourceX = (image.naturalWidth - size) / 2;
            const sourceY = (image.naturalHeight - size) / 2;
            context.drawImage(image, sourceX, sourceY, size, size, 0, 0, 128, 128);
            avatarData.value = canvas.toDataURL("image/jpeg", 0.72);
            selfiePreview.textContent = "";
            selfiePreview.style.backgroundImage = `url("${avatarData.value}")`;
            joinButton.disabled = false;
          };
          image.onerror = () => {
            joinButton.disabled = false;
            selfieInput.value = "";
          };
          image.src = reader.result;
        };
        reader.onerror = () => {
          joinButton.disabled = false;
          selfieInput.value = "";
        };
        reader.readAsDataURL(file);
      });
    </script>
  </body>
</html>
