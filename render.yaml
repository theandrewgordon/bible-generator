services:
  - type: web
    name: bible-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # One process (8 threads): Live Worship state is served from memory, so
      # screens poll every 0.25s with no Firestore read. Keep this service on a
      # single instance; with more processes, set WORSHIP_LIVE_HOT=0.
      - key: WEB_CONCURRENCY
        value: 1
      - key: GUNICORN_THREADS
        value: 16
      - key: GUNICORN_TIMEOUT
        value: 240
      - key: SLOW_REQUEST_LOG_MS
        value: 1500
      - key: OPENAI_API_KEY
        sync: false
      - key: ESV_API_KEY
        sync: false
      - key: API_BIBLE_KEY
        sync: false
      - key: API_BIBLE_IDS
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: FIREBASE_CREDS_JSON
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FAMILY_GAME_NIGHT
        sync: false
      # Optional: error alerts (sentry.io). Unset = off.
      - key: SENTRY_DSN
        sync: false
      # Optional: new product passwords, e.g. esv_print=newpass,mega_bundle=newpass2
      - key: PACK_PASSWORDS
        sync: false
      # Terms of Use governing-law state, e.g. Virginia
      - key: LEGAL_STATE
        sync: false
