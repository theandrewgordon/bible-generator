services:
  - type: web
    name: bible-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ESV_API_KEY
        sync: false
      - key: API_BIBLE_KEY
        sync: false
      - key: API_BIBLE_IDS
        sync: false
