// AI can use this class to make sound effects
class SoundGenerator extends Sound
{
    constructor(params = {})
    {
        const {
            volume = 1,        // Volume scale (percent)
            randomness = .05,  // How much to randomize frequency (percent Hz)
            frequency = 220,   // Frequency of sound (Hz)
            attack = 0,        // Attack time, how fast sound starts (seconds)
            release = .1,      // Release time, how fast sound fades out (seconds)
            shapeCurve = 1,    // Squarenes of wave (0=square, 1=normal, 2=pointy)
            slide = 0,         // How much to slide frequency (kHz/s)
            pitchJump = 0,     // Frequency of pitch jump (Hz)
            pitchJumpTime = 0, // Time of pitch jump (seconds)
            repeatTime = 0,    // Resets some parameters periodically (seconds)
            noise = 0,         // How much random noise to add (percent)
            bitCrush = 0,      // Resamples at a lower frequency in (samples*100)
            delay = 0,         // Overlap sound with itself for reverb and flanger effects (seconds)
        } = params;

        super([volume, randomness, frequency, attack, 0, release, 0, shapeCurve, slide, 0, pitchJump, pitchJumpTime, repeatTime, noise, 0, bitCrush, delay, 1, 0, 0, 0]);
    }
}

///////////////////////////////////////////////////////////////////////////////
// SPRITE ATLAS (do not remove) - bakes 16 white shape icons into one texture so
// the AI can draw recolorable sprites with zero external assets. Call
// initDefaultAtlas() once in gameInit to get a name->TileInfo map, then draw any
// icon with drawTile(pos, size, icons.NAME, color). Each icon is pure white, so
// the color argument tints it to any hue. Icon names (tiles 0-15):
//   circle glow ring roundSquare triangle diamond pentagon hexagon
//   spark star burst plus heart droplet bolt arrow

const ATLAS_SIZE = 2048; // texture size in pixels
const DRAW_SIZE = 500;   // fixed logical space every icon is painted in
let TILE_COLS, TILE_PADDING, TILE_STRIDE, TILE_SIZE, TILE_COUNT;
let atlasCanvas, atlasCtx, atlasDirty, flushScheduled;

function initDrawToTexture(cols = 4)
{
    ASSERT(cols === 4 || cols === 8, 'cols must be 4 or 8');

    TILE_COLS    = cols;
    TILE_STRIDE  = ATLAS_SIZE / TILE_COLS;          // 512 or 256
    TILE_PADDING = TILE_COLS === 4 ? 12 : 6;        // transparent moat to stop mip bleed
    TILE_SIZE    = TILE_STRIDE - TILE_PADDING * 2;  // 488 or 244
    TILE_COUNT   = TILE_COLS * TILE_COLS;

    atlasCanvas = document.createElement('canvas');
    atlasCanvas.width = atlasCanvas.height = ATLAS_SIZE;
    atlasCtx = atlasCanvas.getContext('2d');

    textureInfos[0] && textureInfos[0].destroyWebGLTexture();
    textureInfos[0] = new TextureInfo(atlasCanvas);

    setTileDefaultSize(vec2(TILE_SIZE));
    setTileDefaultPadding(TILE_PADDING);
    atlasDirty = flushScheduled = false;
}

function drawToTexture(tileIndex, drawFn)
{
    ASSERT(tileIndex >= 0 && tileIndex < TILE_COUNT, 'tileIndex out of range');

    const cellX = (tileIndex % TILE_COLS) * TILE_STRIDE;
    const cellY = (tileIndex / TILE_COLS | 0) * TILE_STRIDE;
    const drawX = cellX + TILE_PADDING;
    const drawY = cellY + TILE_PADDING;

    atlasCtx.clearRect(cellX, cellY, TILE_STRIDE, TILE_STRIDE);
    atlasCtx.save();
    atlasCtx.translate(drawX, drawY);
    atlasCtx.beginPath();
    atlasCtx.rect(0, 0, TILE_SIZE, TILE_SIZE);
    atlasCtx.clip();
    // paint in a fixed DRAW_SIZE space scaled to fill the tile
    atlasCtx.scale(TILE_SIZE / DRAW_SIZE, TILE_SIZE / DRAW_SIZE);
    drawFn(atlasCtx, tileIndex);
    atlasCtx.restore();

    atlasDirty = true;
    if (!flushScheduled)
    {
        flushScheduled = true;
        queueMicrotask(flushAtlas);
    }
    return new TileInfo(vec2(drawX, drawY), vec2(TILE_SIZE), textureInfos[0], TILE_PADDING);
}

function flushAtlas()
{
    flushScheduled = false;
    if (!atlasDirty) return;
    atlasDirty = false;
    textureInfos[0].createWebGLTexture();
}

// Force every texel RGB to white (keeping alpha) so bilinear/mipmap filtering
// can't darken the white icon edges into a halo. Call after painting white tiles.
function whitenAtlasAlpha()
{
    flushAtlas();
    if (!glContext || !textureInfos[0].glTexture) return; // canvas2D: no GL halo

    const image = atlasCtx.getImageData(0, 0, ATLAS_SIZE, ATLAS_SIZE);
    const d = image.data;
    for (let i = 0; i < d.length; i += 4)
        d[i] = d[i+1] = d[i+2] = 255; // white RGB, leave alpha alone

    glContext.bindTexture(glContext.TEXTURE_2D, textureInfos[0].glTexture);
    glContext.texImage2D(glContext.TEXTURE_2D, 0, glContext.RGBA,
        glContext.RGBA, glContext.UNSIGNED_BYTE, image);
    if (!tilesPixelated && isPowerOfTwo(ATLAS_SIZE))
        glContext.generateMipmap(glContext.TEXTURE_2D);
    glContext.bindTexture(glContext.TEXTURE_2D, glActiveTexture); // restore engine binding
}

// 16 built-in white-on-transparent icons, drawn centred at (x,y) with radius r.
const DEFAULT_ICON_NAMES = [
    'circle', 'glow', 'ring', 'roundSquare',
    'triangle', 'diamond', 'pentagon', 'hexagon',
    'spark', 'star', 'burst', 'plus',
    'heart', 'droplet', 'bolt', 'arrow',
];

const _defaultIconDrawers = (() =>
{
    function poly(ctx, x, y, r, sides, rot = 0)
    {
        ctx.beginPath();
        for (let k = sides; k--;)
        {
            const a = rot + k * (2*PI / sides);
            ctx.lineTo(x + Math.sin(a) * r, y - Math.cos(a) * r);
        }
        ctx.closePath();
    }
    function starPath(ctx, x, y, ro, ri, points, rot = -PI/2)
    {
        ctx.beginPath();
        for (let k = points * 2; k--;)
        {
            const rr = k & 1 ? ri : ro;
            const a = rot + k * (PI / points);
            ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.closePath();
    }
    function roundRectPath(ctx, x, y, w, h, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    function circle(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function droplet(ctx, x, y, r)
    {
        const by = y + .3 * r, br = .6 * r;
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.bezierCurveTo(x + .3 * r, y - .5 * r, x + br, y - .1 * r, x + br, by);
        ctx.arc(x, by, br, 0, PI);
        ctx.bezierCurveTo(x - br, y - .1 * r, x - .3 * r, y - .5 * r, x, y - r);
        ctx.closePath();
        ctx.fill();
    }
    function roundSquare(ctx, x, y, r)
    {
        roundRectPath(ctx, x - r, y - r, r*2, r*2, r*.4);
        ctx.fill();
    }
    function triangle(ctx, x, y, r) { poly(ctx, x, y, r, 3);        ctx.fill(); }
    function diamond(ctx, x, y, r)  { poly(ctx, x, y, r, 4);        ctx.fill(); }
    function pentagon(ctx, x, y, r) { poly(ctx, x, y, r, 5);        ctx.fill(); }
    function hexagon(ctx, x, y, r)  { poly(ctx, x, y, r, 6, PI/2);  ctx.fill(); }
    function ring(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.arc(x, y, r*.7, 9, 0, true);
        ctx.fill();
    }
    function glow(ctx, x, y, r)
    {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function burst(ctx, x, y, r) { starPath(ctx, x, y, r, r*.7, 10); ctx.fill(); }
    function spark(ctx, x, y, r) { starPath(ctx, x, y, r, r/4, 4);   ctx.fill(); }
    function star(ctx, x, y, r)  { starPath(ctx, x, y, r, r*.4, 5);  ctx.fill(); }
    function heart(ctx, x, y, r)
    {
        const width = 1, topCtrl = .92, dip = .40, shoulder = .46, tip = .9;
        const p = (nx, ny) => [x + nx * r, y + ny * r];
        ctx.beginPath();
        ctx.moveTo(...p(0, -dip));
        ctx.bezierCurveTo(...p(0, -topCtrl), ...p(-width, -topCtrl), ...p(-width, -shoulder));
        ctx.bezierCurveTo(...p(-width, 0), ...p(0, tip * .9), ...p(0, tip));
        ctx.bezierCurveTo(...p(0, tip * .9), ...p(width, 0), ...p(width, -shoulder));
        ctx.bezierCurveTo(...p(width, -topCtrl), ...p(0, -topCtrl), ...p(0, -dip));
        ctx.closePath();
        ctx.fill();
    }
    function plus(ctx, x, y, r)
    {
        const a = r * .3, b = r;
        ctx.beginPath();
        ctx.moveTo(x - a, y - b); ctx.lineTo(x + a, y - b); ctx.lineTo(x + a, y - a);
        ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y + a); ctx.lineTo(x + a, y + a);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y + a);
        ctx.lineTo(x - b, y + a); ctx.lineTo(x - b, y - a); ctx.lineTo(x - a, y - a);
        ctx.closePath();
        ctx.fill();
    }
    function arrow(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + .8 * r, y - .1 * r); ctx.lineTo(x + .3 * r, y - .1 * r);
        ctx.lineTo(x + .3 * r, y + r);      ctx.lineTo(x - .3 * r, y + r);
        ctx.lineTo(x - .3 * r, y - .1 * r); ctx.lineTo(x - .8 * r, y - .1 * r);
        ctx.closePath();
        ctx.fill();
    }
    function bolt(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + .25 * r, y - r);   ctx.lineTo(x - .5 * r, y + .15 * r);
        ctx.lineTo(x - .1 * r, y + .15 * r); ctx.lineTo(x - .25 * r, y + r);
        ctx.lineTo(x + .5 * r, y - .2 * r);  ctx.lineTo(x + .1 * r, y - .2 * r);
        ctx.closePath();
        ctx.fill();
    }
    return {
        circle, glow, ring, roundSquare, triangle, diamond, pentagon, hexagon,
        spark, star, burst, plus, heart, droplet, bolt, arrow,
    };
})();

// Paint one named white icon into a tile and return its TileInfo. scale tweaks
// icon size within the tile (1 = default).
function drawDefaultIcon(name, tileIndex, scale = 1)
{
    const fn = _defaultIconDrawers[name];
    ASSERT(fn, 'unknown default icon: ' + name);
    return drawToTexture(tileIndex, ctx =>
    {
        const c = DRAW_SIZE / 2, r = c * scale;
        ctx.fillStyle = ctx.strokeStyle = '#fff';
        ctx.lineJoin = ctx.lineCap = 'round';
        fn(ctx, c, c, r);
    });
}

// Build the 16 default icons into tiles 0-15 and return a name->TileInfo map.
function initDefaultAtlas(scale = 1)
{
    if (!atlasCtx) initDrawToTexture(4);
    const icons = {};
    for (let i = 0; i < DEFAULT_ICON_NAMES.length; ++i)
        icons[DEFAULT_ICON_NAMES[i]] = drawDefaultIcon(DEFAULT_ICON_NAMES[i], i, scale);
    whitenAtlasAlpha(); // white RGB everywhere -> no dark halo
    return icons;
}

let wwActiveLoopOsc = null;

function ensureWindowWashAudio()
{
    if (!soundEffectsEnabled)
        return null;

    if (wwAudioContext)
    {
        if (wwAudioContext.state == 'suspended')
            wwAudioContext.resume().catch(()=>{});
        return wwAudioContext;
    }

    try
    {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx)
            return null;

        wwAudioContext = new AudioCtx();

        // Reusable white-noise buffer for spray and squeegee texture.
        const length = Math.floor(wwAudioContext.sampleRate * .24);
        wwNoiseBuffer = wwAudioContext.createBuffer(1, length, wwAudioContext.sampleRate);
        const data = wwNoiseBuffer.getChannelData(0);

        for (let i=0; i<length; ++i)
            data[i] = Math.random()*2 - 1;

        return wwAudioContext;
    }
    catch(e)
    {
        return null;
    }
}


function stopWindowWashToolSound()
{
    if (!wwAudioContext)
        return;

    const t = wwAudioContext.currentTime;

    try
    {
        if (wwActiveLoopGain)
        {
            wwActiveLoopGain.gain.cancelScheduledValues(t);
            wwActiveLoopGain.gain.setValueAtTime(max(.0001, wwActiveLoopGain.gain.value), t);
            wwActiveLoopGain.gain.exponentialRampToValueAtTime(.0001, t+.03);
        }
    }
    catch(e) {}

    const source = wwActiveLoopSource;
    const osc = wwActiveLoopOsc;

    setTimeout(() =>
    {
        try { source && source.stop(); } catch(e) {}
        try { osc && osc.stop(); } catch(e) {}
    }, 40);

    wwActiveLoopSource = null;
    wwActiveLoopGain = null;
    wwActiveLoopOsc = null;
}

function startWindowWashToolSound(tool)
{
    stopWindowWashToolSound();

    const ctx = ensureWindowWashAudio();
    if (!ctx || !wwNoiseBuffer || !tool)
        return;

    const isSqueegee = !tool.cleaner;
    const cleanerId = tool.cleaner ? tool.cleaner.id : '';

    const profiles = {
        water:     {freq:2350, q:1.05, volume:.042, click:620},
        soap:      {freq:1650, q:.80, volume:.048, click:480},
        degreaser: {freq:1950, q:1.15, volume:.046, click:545}, // visible name: Disinfecter
        vinegar:   {freq:2750, q:1.30, volume:.039, click:710},
        rowan:   {freq:1450, q:.95, volume:.050, click:420}
    };

    const t = ctx.currentTime;

    const source = ctx.createBufferSource();
    source.buffer = wwNoiseBuffer;
    source.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';

    if (isSqueegee)
    {
        filter.frequency.value = 1050;
        filter.Q.value = 1.4;
    }
    else
    {
        const profile = profiles[cleanerId] || profiles.water;
        filter.frequency.value = profile.freq;
        filter.Q.value = profile.q;
    }

    const gain = ctx.createGain();
    const profile = profiles[cleanerId] || profiles.water;
    const volume = isSqueegee ? .040 : profile.volume;
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t+.02);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start(t);

    wwActiveLoopSource = source;
    wwActiveLoopGain = gain;

    if (isSqueegee)
    {
        // Soft rubber squeak while the squeegee is moving.
        const osc = ctx.createOscillator();
        const og = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 580;
        og.gain.value = .005;
        osc.connect(og);
        og.connect(ctx.destination);
        osc.start(t);
        wwActiveLoopOsc = osc;
    }
    else
    {
        // Each cleaner has its own trigger/nozzle pitch so the tools
        // sound distinct: water, soap, disinfecter, vinegar, and Rowan's.
        const osc = ctx.createOscillator();
        const og = ctx.createGain();
        osc.type = cleanerId == 'rowan' ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(profile.click, t);
        osc.frequency.exponentialRampToValueAtTime(max(180, profile.click*.42), t+.045);
        og.gain.setValueAtTime(cleanerId == 'rowan' ? .028 : .022, t);
        og.gain.exponentialRampToValueAtTime(.0001, t+.05);
        osc.connect(og);
        og.connect(ctx.destination);
        osc.start(t);
        osc.stop(t+.055);
    }
}

function playSpraySound(kind='water')
{

    if (nowMs - wwLastSpraySound < 180)
        return;
    wwLastSpraySound = nowMs;

    if (!ctx || !wwNoiseBuffer)
        return;

    filter.type = 'bandpass';

    filter.Q.value = kind == 'soap' ? .8 : 1.1;

    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t+.008);
    gain.gain.exponentialRampToValueAtTime(.0001, t+.085);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(t);
    noise.stop(t+.09);

    osc.frequency.exponentialRampToValueAtTime(220, t+.035);
    og.gain.setValueAtTime(.035, t);

class CleanerTool extends EngineObject
{
    constructor(pos, cleaner, slot)
    {
        super(pos, vec2(1.8,3.0), undefined, 0, WHITE);
        this.cleaner = cleaner;
        this.slot = slot;
        this.home = pos.copy();
        this.renderOrder = 100;
    }

    update()
    {
        // Input is handled by the shared direct pointer system.
    }

    render()
    {
        let glassTop='#e9f6fb',glassBottom='#b5d9e8',liquid='#4fb6e9',trigger='#e8e8e4';
        if (this.cleaner.id=='soap'){ liquid='#75c86d'; trigger='#4b9f50'; }
        else if (this.cleaner.id=='degreaser'){ liquid='#7f5ac8'; trigger='#5c3c9f'; }
        else if (this.cleaner.id=='vinegar'){ liquid='#e4c36e'; trigger='#b99b54'; }
        else if (this.cleaner.id=='rowan'){ liquid='#d94d77'; trigger='#a52c50'; }

        const drawBottle=(pos,screen=false)=>
        {
            const p=screen?pos:_wwScreen(pos);
            const S=cameraScale;
            const ctx=mainContext;
            ctx.save();
            ctx.translate(p.x,p.y);

            // shadow
            ctx.fillStyle='rgba(0,0,0,.16)';
            ctx.beginPath(); ctx.ellipse(.10*S,.80*S,.78*S,.16*S,0,0,Math.PI*2); ctx.fill();

            // bottle body path
            ctx.beginPath();
            ctx.moveTo(-.54*S,.88*S);
            ctx.quadraticCurveTo(-.68*S,.35*S,-.60*S,-.70*S);
            ctx.quadraticCurveTo(-.52*S,-1.08*S,-.28*S,-1.15*S);
            ctx.lineTo(.28*S,-1.15*S);
            ctx.quadraticCurveTo(.52*S,-1.08*S,.60*S,-.70*S);
            ctx.quadraticCurveTo(.68*S,.35*S,.54*S,.88*S);
            ctx.quadraticCurveTo(.28*S,1.03*S,0,1.02*S);
            ctx.quadraticCurveTo(-.28*S,1.03*S,-.54*S,.88*S);
            ctx.closePath();

            const g=ctx.createLinearGradient(0,-1.1*S,0,1.0*S);
            g.addColorStop(0,glassTop); g.addColorStop(1,glassBottom);
            ctx.fillStyle=g; ctx.fill();
            ctx.strokeStyle='rgba(60,90,105,.55)';
            ctx.lineWidth=max(1,.035*cameraScale); ctx.stroke();

            // liquid inside
            ctx.save();
            ctx.globalAlpha=.84;
            ctx.beginPath();
            ctx.moveTo(-.48*S,.45*S);
            ctx.quadraticCurveTo(0,.28*S,.48*S,.45*S);
            ctx.lineTo(.42*S,.88*S);
            ctx.quadraticCurveTo(0,.98*S,-.42*S,.88*S);
            ctx.closePath();
            ctx.fillStyle=liquid; ctx.fill();
            ctx.restore();

            // neck
            ctx.fillStyle='#e9e7df';
            ctx.fillRect(-.17*S,-1.42*S,.34*S,.33*S);

            // trigger sprayer
            ctx.fillStyle=trigger;
            ctx.beginPath();
            ctx.roundRect(-.24*S,-1.64*S,.78*S,.24*S,.08*S);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(.42*S,-1.58*S,.34*S,.16*S,.05*S);
            ctx.fill();

            // trigger lever
            ctx.save();
            ctx.translate(.10*S,-1.32*S);
            ctx.rotate(-.28);
            ctx.fillRect(-.07*S,0,.14*S,.52*S);
            ctx.restore();

            // shine
            ctx.strokeStyle='rgba(255,255,255,.55)';
            ctx.lineWidth=max(1,.05*S);
            ctx.beginPath();
            ctx.moveTo(-.36*S,-.72*S);
            ctx.quadraticCurveTo(-.48*S,.12*S,-.30*S,.62*S);
            ctx.stroke();

            // label
            ctx.fillStyle='rgba(250,246,235,.94)';
            ctx.beginPath(); ctx.roundRect(-.42*S,-.20*S,.84*S,.56*S,.09*S); ctx.fill();

            ctx.fillStyle='#25333b';
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.font=`700 ${max(8,.17*S)}px Trebuchet MS`;
            ctx.fillText(this.cleaner.name,0,.08*S);

            ctx.restore();
        };

        if (activeTool==this && trialPointerDown)
            return;

        drawBottle(this.pos,false);
    }
}

function buildDirt()
{
    dirt = [];
    wetness = [];

    // Bound the simulation grid so later/larger windows stay responsive on iPad.
    // Visual window size can keep growing without multiplying cleaning work forever.
    // Keep the game intentionally simple on tablets. From Level 3 onward,
    // use a coarse logical grid instead of hundreds/thousands of tiny cells.
    // Cleaner matching still works exactly the same, but there is far less
    // simulation and rendering work every frame.
    if (!trialMode && level >= 3)
    {
        gridX = clamp(Math.round(windowSize.x * 1.15), 14, 24);
        gridY = clamp(Math.round(windowSize.y * 1.15), 10, 16);
    }
    else
    {
        gridX = clamp(Math.round(windowSize.x * 1.55), 12, 30);
        gridY = clamp(Math.round(windowSize.y * 1.55), 10, 20);
    }

    if (trialMode)
    {
        // Recording/demo trial: grease only.
        const grease = MESS_TYPES.find(m => m.id == 'grease');

        for (let y=0; y<gridY; ++y)
        for (let x=0; x<gridX; ++x)
        {
            const fx = (x + .5) / gridX;
            const fy = (y + .5) / gridY;
            const pos = vec2(
                WINDOW_POS.x - windowSize.x/2 + fx*windowSize.x,
                WINDOW_POS.y - windowSize.y/2 + fy*windowSize.y
            );

            // Grease patches with enough clean gaps to read clearly on video.
            const wave = sin(x*.72 + y*.31) + cos(y*.58 - x*.24);
            const hasMess = wave > -.15 || rand() < .22;

            dirt.push({
                pos,
                clean:!hasMess,
                treated:false,
                mess:grease,
                shade:rand(.42,.26)
            });

            wetness.push({pos, layers:{}});
        }

        dirtLeft = dirt.filter(d => !d.clean).length;
        return;
    }

    const unlockedMess = clamp(1 + Math.floor((level-1)/2), 1, MESS_TYPES.length);
    // More mess appears over time, but cap it before the window becomes a dense
    // wall of cells (which was both visually muddy and expensive on touch devices).
    const density = level >= 3
        ? clamp(.42 + level*.012, .42, .58)
        : clamp(.46 + level*.018, .46, .56);

    for (let y=0; y<gridY; ++y)
    for (let x=0; x<gridX; ++x)
    {
        const fx = (x + .5) / gridX;
        const fy = (y + .5) / gridY;

        const pos = vec2(
            WINDOW_POS.x - windowSize.x/2 + fx*windowSize.x,
            WINDOW_POS.y - windowSize.y/2 + fy*windowSize.y
        );

        const hasMess = rand() < density;
        const messIndex = randInt(unlockedMess);
        const mess = MESS_TYPES[messIndex];

        dirt.push({
            pos,
            clean:!hasMess,
            treated:false,
            mess:mess,
            shade:rand(.40,.22)
        });

        wetness.push({
            pos,
            layers:{}
        });
    }

    dirtLeft = dirt.filter(d => !d.clean).length;
}

function setupCleanerTools()
{
    for (const tool of cleanerTools)
        tool.destroy();
    cleanerTools = [];

    const view = getCameraSize();
    const shelfY = min(windowSize.y/2 + 2.85, view.y/2 - 2.15);
    const shelfWidth = min(view.x - 4.0, 15.5);
    const left = -shelfWidth/2 + 1.5;
    const spacing = 2.45;

    if (trialMode)
    {
        const chosen = CLEANERS.find(c => c.id == (recordingCleanerId || 'soap'));
        cleanerTools.push(new CleanerTool(vec2(left,shelfY), chosen, 0));
        tutorialActive = false;
        tutorialCleaner = null;
        return;
    }

    const unlocked = clamp(1 + Math.floor((level-1)/2), 1, CLEANERS.length);

    for (let i=0; i<unlocked; ++i)
    {
        const x = left + i*spacing;
        cleanerTools.push(new CleanerTool(vec2(x,shelfY), CLEANERS[i], i));
    }

    if (unlocked > highestCleanerShown)
    {
        highestCleanerShown = unlocked;
        tutorialCleaner = CLEANERS[unlocked-1];
        cleanerHintTimer.set(5);
        tutorialDemoTimer.set(5);

        // Keep gameplay responsive when a new cleaner unlocks.
        // The lightweight HUD tutorial is shown without blocking pointer input.
    }
}

function forEachNearbyGlassCell(pos, halfWidth, halfHeight, callback)
{
    // Grid is row-major and evenly distributed over windowSize.
    // Convert the cleaning footprint to a small range of grid indices.
    const left = WINDOW_POS.x - windowSize.x/2;
    const bottom = WINDOW_POS.y - windowSize.y/2;

    const minGX = clamp(Math.floor((pos.x-halfWidth-left) / windowSize.x * gridX)-1, 0, gridX-1);
    const maxGX = clamp(Math.ceil ((pos.x+halfWidth-left) / windowSize.x * gridX)+1, 0, gridX-1);
    const minGY = clamp(Math.floor((pos.y-halfHeight-bottom) / windowSize.y * gridY)-1, 0, gridY-1);
    const maxGY = clamp(Math.ceil ((pos.y+halfHeight-bottom) / windowSize.y * gridY)+1, 0, gridY-1);

    for (let gy=minGY; gy<=maxGY; ++gy)
    for (let gx=minGX; gx<=maxGX; ++gx)
    {
        const i = gy*gridX + gx;
        callback(i);
    }
}

function sprayAt(pos, cleanerId)
{
    if (won) return;

    levelSprays++;

    let hitCorrectMess = false;
    let hitWrongMess = false;

    forEachNearbyGlassCell(pos, 1.35, 1.15, i =>
    {
        const w = wetness[i];
        if (!w) return;

        if (abs(w.pos.x-pos.x) < 1.35 && abs(w.pos.y-pos.y) < 1.15)
        {
            if (!w.layers)
                w.layers = {};

            // Each cleaner has its own independent layer.
            // Spraying one cleaner no longer removes/replaces another.
            w.layers[cleanerId] = 1;
            w.lastCleanerId = cleanerId;

            const d = dirt[i];
            if (!d.clean && d.mess.cleaner == cleanerId)
            {
                d.treated = true;
                hitCorrectMess = true;
            }
            else if (!d.clean && d.mess.cleaner != cleanerId)
            {
                hitWrongMess = true;
                window._rowanLastNeededCleaner = d.mess.cleaner;
            }
        }
    });

    if (hitCorrectMess)
        levelCorrectSprays++;

    if (hitWrongMess)
        levelWrongSprays++;
}

function cleanAt(pos)
{
    if (won) return;

    levelWipes++;

    forEachNearbyGlassCell(pos, 1.9, .62, i =>
    {
        const d = dirt[i];
        const w = wetness[i];
        if (!d || !w) return;

        if (abs(d.pos.x - pos.x) < 1.9 && abs(d.pos.y - pos.y) < .62)
        {
            // Wipe every cleaner layer from this spot together.
            if (w.layers)
            {
                for (const cleanerId in w.layers)
                {
                    w.layers[cleanerId] = max(0, w.layers[cleanerId] - .6);

                    if (w.layers[cleanerId] <= .05)
                        delete w.layers[cleanerId];
                }
            }

            // Mess only comes off once the correct cleaner has treated it.
            if (!d.clean && d.treated)
            {
                d.clean = true;
                dirtLeft--;
            }
        }
    });

    if (dirtLeft <= 0 && !won)
    {
        dirtLeft = 0;
        won = true;
        stopWindowWashToolSound();
        playWindowWashSuccessSound();

        awardLevelStars();

        levelAdvanceTimer.set(1.5);
        levelAdvanceAt = performance.now() + 1500;
    }
}




function awardLevelStars()
{
    if (trialMode)
        return;

    const elapsedSeconds = max(.1, (performance.now() - levelStartTime) / 1000);

    // Base star for completing the window.
    let earned = 1;
    const bonuses = [];

    // Speed targets scale with window area and level difficulty.
    const area = max(1, windowSize.x * windowSize.y);
    const fastTarget = 12 + area * .12 + min(20, level*.6);
    const goodTarget = fastTarget * 1.65;

    if (elapsedSeconds <= fastTarget)
    {
        earned += 2;
        bonuses.push('FAST +2');
    }
    else if (elapsedSeconds <= goodTarget)
    {
        earned += 1;
        bonuses.push('SPEED +1');
    }

    // Accuracy rewards using matching cleaners instead of spraying randomly.
    const accuracy = levelSprays > 0
        ? max(0, levelSprays - levelWrongSprays) / levelSprays
        : 1;

    if (accuracy >= .80)
    {
        earned += 1;
        bonuses.push('ACCURATE +1');
    }

    // Efficiency rewards finishing without excessive spraying/wiping.
    const dirtyCells = max(1, levelInitialDirt);
    const effort = levelSprays + levelWipes;
    const efficientLimit = dirtyCells * 1.8 + 24;

    if (effort <= efficientLimit)
    {
        earned += 1;
        bonuses.push('EFFICIENT +1');
    }

    lastLevelStars = earned;
    totalStars += earned;
    bestRoundStars = max(bestRoundStars, earned);

    try
    {
        const gamesResult = getGamesApi()?.recordResult?.(GAME_ID, {
            completed:true,
            score:max(0, earned),
            level:max(1, level),
            stars:max(0, earned),
            resultId:`rowan-${playerId}-${level}-${levelStartTime}`,
            meta:{
                totalStars:max(0,totalStars),
                cleanerCount:clamp(1 + Math.floor((highestLevel-1)/2), 1, CLEANERS.length),
                sprays:levelSprays,
                wipes:levelWipes,
                perfect:levelSprays>0 && levelWrongSprays===0
            }
        }, playerName);
        window._rowanLastXp = gamesResult?.lastResult?.xpEarned || 0;
    }
    catch(e) { window._rowanLastXp = 0; }

    completions++;
    lastLevelBonusText = bonuses.length ? bonuses.join('  •  ') : 'COMPLETE';

    clearResumeState();
    saveProgress(true);
    // Results are recorded above; gameplay auto-advances after the completion beat.
}

function getGamesApi()
{
    return window.Games || null;
}

function getGamesPlayers()
{
    const api = getGamesApi();
    if (!api)
        return null;

    try
    {
        if (typeof api.getPlayers == 'function')
        {
            const result = api.getPlayers();
            if (Array.isArray(result))
                return result;
        }

        if (Array.isArray(api.players))
            return api.players;
    }
    catch(e) {}

    return null;
}

function saveProgressToGames(data)
{
    const api = getGamesApi();
    if (!api)
        return;

    try
    {
        if (typeof api.saveGameProgress == 'function')
            api.saveGameProgress(GAME_ID, playerId, data);
        else if (typeof api.setGameProgress == 'function')
            api.setGameProgress(GAME_ID, playerId, data);
    }
    catch(e) {}
}

function loadProgressFromGames(id)
{
    const api = getGamesApi();
    if (!api)
        return null;

    try
    {
        if (typeof api.getGameProgress == 'function')
        {
            const result = api.getGameProgress(GAME_ID, id);
            if (result && typeof result == 'object' && typeof result.then != 'function')
                return result;
        }
    }
    catch(e) {}

    return null;
}

function makeStablePlayerId()
{
    if (window.crypto && crypto.randomUUID)
        return crypto.randomUUID();

    return `player-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
}

function getSharedPlayers()
{
    const gamesPlayers = getGamesPlayers();
    if (Array.isArray(gamesPlayers) && gamesPlayers.length)
    {
        const api = getGamesApi();
        return gamesPlayers
            .map(p => ({
                id: String(p.id || p.playerId || ''),
                name: String(p.name || p.displayName || '').trim(),
                createdAt: p.createdAt || 0
            }))
            .filter(p => p.id && p.name)
            .filter(p => !(api && api.getGameStats && api.getGameStats(p.name, GAME_ID)?.hidden))
            .slice(0,8);
    }

    let players = [];
    try
    {
        const raw = localStorage.getItem(TESSA_PLAYERS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        if (Array.isArray(parsed))
            players = parsed.filter(p => p && typeof p.id == 'string' && typeof p.name == 'string');
    }
    catch(e) {}

    return players.slice(0,8);
}

function saveSharedPlayers(players)
{
    try
    {
        localStorage.setItem(TESSA_PLAYERS_KEY, JSON.stringify(players.slice(0,8)));
    }
    catch(e) {}

    const api = getGamesApi();
    try
    {
        if (api && typeof api.setPlayers == 'function')
            api.setPlayers(players.slice(0,8));
        else if (api && typeof api.savePlayers == 'function')
            api.savePlayers(players.slice(0,8));
    }
    catch(e) {}
}

function findOrAdoptPlayer(name)
{
    const api = getGamesApi();
    const clean = api && api.cleanPlayerName
        ? api.cleanPlayerName(name)
        : String(name || '').replace(/\s+/g,' ').trim().slice(0,20);

    if (!clean)
        return null;

    if (api && typeof api.ensurePlayer == 'function')
    {
        const shared = api.ensurePlayer(clean);
        if (shared)
            return {id:String(shared.id), name:String(shared.name), createdAt:shared.createdAt || Date.now()};
        return null;
    }

    let players = getSharedPlayers();
    let player = players.find(p => p.name.toLowerCase() == clean.toLowerCase());

    if (!player)
    {
        if (players.length >= 8)
            return null;

        player = {id:makeStablePlayerId(),name:clean,createdAt:Date.now()};
        players.push(player);
        saveSharedPlayers(players);
    }

    return player;
}

function migrateLegacyProfiles()
{
    let names = [];

    try
    {
        const raw = localStorage.getItem(PROFILE_LIST_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        if (Array.isArray(parsed))
            names.push(...parsed.filter(n => typeof n == 'string'));
    }
    catch(e) {}

    try
    {
        for (let i=0; i<localStorage.length; ++i)
        {
            const key = localStorage.key(i);
            if (!key || !key.startsWith(SAVE_PREFIX))
                continue;

            try
            {
                const data = JSON.parse(localStorage.getItem(key));
                if (data && data.playerName)
                    names.push(data.playerName);
            }
            catch(e) {}
        }

        const last = localStorage.getItem('windowWashLastPlayer');
        if (last)
            names.push(last);
    }
    catch(e) {}

    for (const name of names)
    {
        if (getSharedPlayers().length >= 8)
            break;
        findOrAdoptPlayer(name);
    }
}

function getProfileSummary(profile)
{
    const name = typeof profile == 'string' ? profile : profile.name;
    const id = typeof profile == 'string'
        ? (findOrAdoptPlayer(profile) || {}).id
        : profile.id;

    let data = id ? loadProgressFromGames(id) : null;

    try
    {
        if (!data && id)
        {
            const raw = localStorage.getItem(getProgressKey(id));
            if (raw)
                data = JSON.parse(raw);
        }

        if (!data)
        {
            const legacy = localStorage.getItem(getSaveKey(name));
            if (legacy)
                data = JSON.parse(legacy);
        }
    }
    catch(e) {}

    return {
        id: id || '',
        name,
        level: data ? max(1, data.highestLevel || data.level || 1) : 1,
        totalStars: data ? max(0, data.stars || data.totalStars || 0) : 0,
        bestRoundStars: data ? max(0, data.bestScore || data.bestRoundStars || 0) : 0,
        gamesPlayed: data ? max(0, data.gamesPlayed || 0) : 0,
        completions: data ? max(0, data.completions || 0) : 0,
        lastPlayedAt: data ? (data.lastPlayed || data.lastPlayedAt || 0) : 0
    };

function saveProgress(showToast=false)
{
    if (!profileReady || !playerName || !playerId)
        return;

    lastPlayedAt = Date.now();
    highestLevel = max(highestLevel || 1, level);

    const data = {
        gameId: GAME_ID,
        playerId,
        playerName,

        // Common Games progress/scoring contract
        score: max(0, lastLevelStars || 0),
        bestScore: max(0, bestRoundStars || 0),
        level: max(1, level),
        highestLevel: max(1, highestLevel),
        stars: max(0, totalStars),
        gamesPlayed: max(0, gamesPlayed),
        completions: max(0, completions),
        lastPlayed: lastPlayedAt,

        // Backward-compatible fields
        highestCleanerShown,
        totalStars,
        bestRoundStars,
        lastPlayedAt,

        meta: {
            highestCleanerShown,
            cleanersUnlocked: clamp(1 + Math.floor((highestLevel-1)/2), 1, CLEANERS.length),
            perfect: levelSprays > 0 && levelWrongSprays === 0
        }
    };

    try
    {
        localStorage.setItem(getProgressKey(playerId), JSON.stringify(data));
        localStorage.setItem(getSaveKey(playerName), JSON.stringify(data));
        localStorage.setItem('windowWashLastPlayer', playerName);
        rememberProfile(playerName);
    }
    catch(e) {}

    saveProgressToGames(data);

    if (showToast)
        showSavedToast();
}

function saveResumeState()
{
    if (!profileReady || !playerId || won || !dirt.length)
        return;

    const resume = {
        gameId: GAME_ID,
        level,
        gridX,
        gridY,
        dirt: dirt.map(d => ({
            clean: !!d.clean,
            treated: !!d.treated,
            messId: d.mess ? d.mess.id : 'dust',
            shade: d.shade
        })),
        wetness: wetness.map(w => ({
            layers: w.layers ? {...w.layers} : {},
            lastCleanerId: w.lastCleanerId || ''
        })),
        levelInitialDirt,
        levelSprays,
        levelCorrectSprays,
        levelWrongSprays,
        levelWipes,
        elapsedMs: max(0, performance.now() - levelStartTime),
        savedAt: Date.now()
    };

    try
    {
        localStorage.setItem(getResumeKey(playerId), JSON.stringify(resume));
    }
    catch(e) {}
}

function clearResumeState()
{
    if (!playerId)
        return;

    try { localStorage.removeItem(getResumeKey(playerId)); }
    catch(e) {}
}

function restoreResumeState()
{
    if (!playerId)
        return false;

    let resume = null;
    try
    {
        const raw = localStorage.getItem(getResumeKey(playerId));
        if (raw)
            resume = JSON.parse(raw);
    }
    catch(e) {}

    if (!resume || resume.level != level || resume.gridX != gridX || resume.gridY != gridY)
        return false;

    if (!Array.isArray(resume.dirt) || resume.dirt.length != dirt.length)
        return false;

    for (let i=0; i<dirt.length; ++i)
    {
        const saved = resume.dirt[i];
        const mess = MESS_TYPES.find(m => m.id == saved.messId) || dirt[i].mess;

        dirt[i].clean = !!saved.clean;
        dirt[i].treated = !!saved.treated;
        dirt[i].mess = mess;
        dirt[i].shade = saved.shade == null ? dirt[i].shade : saved.shade;

        if (wetness[i])
        {
            const savedWet = resume.wetness && resume.wetness[i];
            wetness[i].layers = savedWet && savedWet.layers ? {...savedWet.layers} : {};
            wetness[i].lastCleanerId = savedWet && savedWet.lastCleanerId
                ? savedWet.lastCleanerId
                : '';
        }
    }

    dirtLeft = dirt.filter(d => !d.clean).length;
    levelInitialDirt = max(dirtLeft, resume.levelInitialDirt || dirtLeft || 1);
    levelSprays = max(0, resume.levelSprays || 0);
    levelCorrectSprays = max(0, resume.levelCorrectSprays || 0);
    levelWrongSprays = max(0, resume.levelWrongSprays || 0);
    levelWipes = max(0, resume.levelWipes || 0);
    levelStartTime = performance.now() - max(0, resume.elapsedMs || 0);
    return true;
}

function loadProgress(profileOrName)
{
    const requestedName = typeof profileOrName == 'string' ? profileOrName : profileOrName.name;
    const adopted = typeof profileOrName == 'object' && profileOrName.id
        ? profileOrName
        : findOrAdoptPlayer(requestedName);

    if (!adopted)
        return false;

    playerId = adopted.id;
    playerName = adopted.name.trim().slice(0,20);
    try { getGamesApi()?.selectPlayer?.(playerName, GAME_ID); } catch(e) {}

    let data = loadProgressFromGames(playerId);

    try
    {
        if (!data)
        {
            const raw = localStorage.getItem(getProgressKey(playerId));
            if (raw)
                data = JSON.parse(raw);
        }

        // Adopt old name-keyed saves instead of replacing them.
        if (!data)
        {
            const legacy = localStorage.getItem(getSaveKey(playerName));
            if (legacy)
                data = JSON.parse(legacy);
        }
    }
    catch(e) {}

    if (data)
    {
        level = max(1, data.level || 1);
        highestLevel = max(level, data.highestLevel || data.level || 1);
        highestCleanerShown = max(0, data.highestCleanerShown || (data.meta && data.meta.highestCleanerShown) || 0);
        totalStars = max(0, data.totalStars || data.stars || 0);
        bestRoundStars = max(0, data.bestRoundStars || data.bestScore || 0);
        gamesPlayed = max(0, data.gamesPlayed || 0);
        completions = max(0, data.completions || 0);
        lastPlayedAt = data.lastPlayedAt || data.lastPlayed || 0;
    }
    else
    {
        level = 1;
        highestLevel = 1;
        highestCleanerShown = 0;
        totalStars = 0;
        bestRoundStars = 0;
        gamesPlayed = 0;
        completions = 0;
        lastPlayedAt = 0;
    }

    profileReady = true;
    setupLevel();

    currentRoundIsResume = restoreResumeState();

    // Count one Games play session per browser tab/player, not once per
    // level transition or every time the same save is written.
    const sessionKey = 'rowan-session-' + playerId;
    let firstSession = true;
    try
    {
        firstSession = !sessionStorage.getItem(sessionKey);
        if (firstSession) sessionStorage.setItem(sessionKey, '1');
    }
    catch(e) {}

    if (firstSession)
        gamesPlayed++;

    try { getGamesApi()?.startSession?.(GAME_ID, playerName); }
    catch(e) {}

    saveProgress();
    titleIntroTimer.set(4);
    showGameIntro(currentRoundIsResume);
    return true;
}

function protectNativeTextEntry(element)
{
    const api = getGamesApi();
    if (api && typeof api.protectNativeControl == 'function')
    {
        api.protectNativeControl(element);
        return;
    }

    // Stop events from bubbling to document-level LittleJS handlers.
    // Never preventDefault: the browser must retain normal caret/keyboard behavior.
    const events = [
        'keydown','keyup',
        'pointerdown','pointerup',
        'mousedown','mouseup',
        'touchstart','touchend',
        'click'
    ];

    for (const type of events)
        element.addEventListener(type, e => e.stopPropagation());
}

function stopGameInputBehindOverlay(overlay)
{
    const pointerEvents = ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'];
    for (const type of pointerEvents)
        overlay.addEventListener(type, e => e.stopPropagation());
}

function setupRecordingTrial(cleanerId)
{
    trialMode = true;
    recordingCleanerId = cleanerId;
    profileReady = true;
    playerName = 'DEMO';
    level = 1;
    windowSize = vec2(16,10);

    // Build only the matching mess.
    dirt = [];
    wetness = [];
    gridX = 32;
    gridY = 20;
    const mess = MESS_TYPES.find(m => m.cleaner == cleanerId);

    for (let y=0; y<gridY; ++y)
    for (let x=0; x<gridX; ++x)
    {
        const fx = (x+.5)/gridX;
        const fy = (y+.5)/gridY;
        const pos = vec2(
            WINDOW_POS.x-windowSize.x/2+fx*windowSize.x,
            WINDOW_POS.y-windowSize.y/2+fy*windowSize.y
        );

        const wave = sin(x*.58+y*.27)+cos(y*.43-x*.21);
        const hasMess = wave > -.15 || rand()<.18;

        dirt.push({
            pos,
            clean:!hasMess,
            treated:false,
            mess,
            shade:rand(.42,.26)
        });
        wetness.push({pos, layers:{}});
    }
    dirtLeft = dirt.filter(d=>!d.clean).length;

    for (const tool of cleanerTools)
        tool.destroy();
    cleanerTools = [];

    if (squeegee)
        squeegee.destroy();

    const view = getCameraSize();
    const shelfY = min(windowSize.y/2+2.35, view.y/2-2.5);
    const shelfWidth = min(view.x-4.0, 15.5);
    const left = -shelfWidth/2+1.5;

    const cleaner = CLEANERS.find(c=>c.id==cleanerId);
    cleanerTools.push(new CleanerTool(vec2(left,shelfY), cleaner, 0));

    const hookX = -shelfWidth/2-.9;
    squeegee = new Squeegee(vec2(hookX,shelfY-2.4));

    tutorialActive = false;
    activeTool = null;
    parkedTool = null;
    won = false;
    levelAdvanceTimer.unset();
}

function setupLevel()
{
    if (trialMode)
        windowSize = vec2(16,10);
    else
    {
        // Unlimited levels: recycle window shapes forever while difficulty scales.
        const index = (level - 1) % LEVELS.length;
        windowSize = LEVELS[index].copy();

        const cycle = Math.floor((level - 1) / LEVELS.length);
        if (cycle > 0)
            windowSize = windowSize.scale(1 + min(.35, cycle * .06));
    }

    windowSize = windowSize.scale(.94);
    buildDirt();
    levelInitialDirt = max(1, dirtLeft);
    won = false;
    dragging = false;
    levelAdvanceTimer.unset();
    levelAdvanceAt = 0;

    levelStartTime = performance.now();
    levelSprays = 0;
    levelCorrectSprays = 0;
    levelWrongSprays = 0;
    levelWipes = 0;
    lastLevelStars = 0;
    lastLevelBonusText = '';

    if (squeegee)
        squeegee.destroy();

    // Start the squeegee beside the lower-left of the glass.
    const view = getCameraSize();
    const shelfY = min(windowSize.y/2 + 2.85, view.y/2 - 2.15);
    const shelfWidth = min(view.x - 4.0, 15.5);

    // Squeegee hangs from the rack's left-side extension.
    const startX = -shelfWidth/2 - .9;
    const startY = shelfY - 2.4;
    squeegee = new Squeegee(vec2(startX, startY));

    // Spawn the cleaner rack and the cleaners for this level.
    setupCleanerTools();
}

function trialClientToWorld(clientX, clientY)
{
    const rect = mainCanvas.getBoundingClientRect();

    const nx = clamp((clientX - rect.left) / rect.width, 0, 1);
    const ny = clamp((clientY - rect.top) / rect.height, 0, 1);

    // Exact render position in LittleJS screen pixels.
    trialPointerScreen = vec2(nx * mainCanvasSize.x, ny * mainCanvasSize.y);

    // Matching world position for spraying/wiping logic.
    return screenToWorld(trialPointerScreen);
}


function ensureDragOverlay()
{
    if (dragOverlayCanvas || !mainCanvas)
        return;

    dragOverlayCanvas = document.createElement('canvas');
    dragOverlayContext = dragOverlayCanvas.getContext('2d');

    dragOverlayCanvas.style.position = 'fixed';
    dragOverlayCanvas.style.pointerEvents = 'none';
    dragOverlayCanvas.style.zIndex = '9999';
    dragOverlayCanvas.style.left = '0';
    dragOverlayCanvas.style.top = '0';

    document.body.appendChild(dragOverlayCanvas);
    syncDragOverlay();
}

function syncDragOverlay()
{
    if (!dragOverlayCanvas || !mainCanvas)
        return;

    const r = mainCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    const w = max(1, Math.round(r.width * dpr));
    const h = max(1, Math.round(r.height * dpr));

    if (dragOverlayCanvas.width != w || dragOverlayCanvas.height != h)
    {
        dragOverlayCanvas.width = w;
        dragOverlayCanvas.height = h;
    }

    dragOverlayCanvas.style.left = `${r.left}px`;
    dragOverlayCanvas.style.top = `${r.top}px`;
    dragOverlayCanvas.style.width = `${r.width}px`;
    dragOverlayCanvas.style.height = `${r.height}px`;

    dragOverlayContext.setTransform(dpr,0,0,dpr,0,0);
}

function clearDragOverlay()
{
    if (!dragOverlayContext || !dragOverlayCanvas)
        return;

    const dpr = window.devicePixelRatio || 1;
    dragOverlayContext.save();
    dragOverlayContext.setTransform(1,0,0,1,0,0);
    dragOverlayContext.clearRect(0,0,dragOverlayCanvas.width,dragOverlayCanvas.height);
    dragOverlayContext.restore();
    dragOverlayContext.setTransform(dpr,0,0,dpr,0,0);
}

function drawFastHeldSqueegee(clientX, clientY)
{
    ensureDragOverlay();
    syncDragOverlay();
    clearDragOverlay();

    const r = mainCanvas.getBoundingClientRect();
    const x = clientX - r.left;
    const y = clientY - r.top + 42;
    const c = dragOverlayContext;

    c.save();
    c.translate(x,y);

    // soft shadow
    c.fillStyle='rgba(0,0,0,.18)';
    c.beginPath();
    c.roundRect(-82,1,164,12,6);
    c.fill();

    // metal channel
    let g=c.createLinearGradient(0,-8,0,9);
    g.addColorStop(0,'#e9eef1');

function drawFastHeldTool(clientX, clientY)
{
    if (!trialPointerDown || !activeTool)
    {
        clearDragOverlay();
        return;
    }

    if (activeTool.cleaner && activeTool.cleaner.id)
        drawFastHeldBottle(clientX, clientY, activeTool.cleaner.id, activeTool.cleaner.name || '');
    else
        drawFastHeldSqueegee(clientX, clientY);
}

function directPickTool(pos)
{
    // Soap bottle first, because it is smaller and sits on the shelf.
    for (const tool of cleanerTools)
    {
        if (isOverlapping(pos, vec2(.35), tool.pos, vec2(3.4,4.4)))
            return tool;
    }

    if (squeegee)
    {
        const grabCenter = squeegee.pos.add(vec2(0,1.25));
        if (isOverlapping(pos, vec2(.35), grabCenter, vec2(5.2,5.2)))
            return squeegee;
    }

    return null;
}


function applyToolAlongPath(fromPos, toPos)
{
    if (!activeTool)
        return;

    if (!fromPos)
    {
        if (activeTool.cleaner)
            sprayAt(toPos, activeTool.cleaner.id);
        else
            cleanAt(toPos.add(vec2(0,-1.0)));
        return;
    }

    const dx = toPos.x - fromPos.x;
    const dy = toPos.y - fromPos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // Use a small world-space spacing so quick pointer/finger movement
    // paints a continuous path instead of isolated event samples.
    const step = activeTool.cleaner ? .52 : .46;
    // Browser pointer events can arrive in large bursts, especially on iPad.
    // Keep continuity without allowing one event to monopolize the main thread.
    const count = 1; // one cleaning sample per animation frame; visual pointer still tracks every event

    for (let n=1; n<=count; ++n)
    {
        // Finishing a pane/round can clear or destroy the held tool from
        // inside sprayAt()/cleanAt(). Stop the interpolated drag immediately
        // instead of dereferencing a tool that no longer exists.
        if (!activeTool)
            break;

        const t = n / count;
        const p = vec2(
            fromPos.x + dx*t,
            fromPos.y + dy*t
        );

        if (activeTool.cleaner)
            sprayAt(p, activeTool.cleaner.id);
        else
            cleanAt(p.add(vec2(0,-1.0)));
    }
}

function directMoveActiveTool(pos)
{
    if (!activeTool)
        return;

    // Apply cleaning/spraying over every point between pointer events.
    applyToolAlongPath(lastDragWorldPos, pos);

    // Completing a clean can end the drag and clear activeTool during the
    // path application above.
    if (!activeTool)
    {
        dragging = false;
        lastDragWorldPos = null;
        return;
    }

    if (activeTool.cleaner)
    {
        activeTool.pos = pos.copy();
    }
    else
    {
        dragging = true;
        activeTool.pos = pos.add(vec2(0,-1.0));
    }

    lastDragWorldPos = pos.copy();
}

function flushPendingDragWork()
{
    dragWorkFrame = 0;

    if (!trialPointerDown || !activeTool || !pendingDragWorldPos)
        return;

    const p = pendingDragWorldPos;
    pendingDragWorldPos = null;
    directMoveActiveTool(p);
}

function scheduleDragWork(pos)
{
    pendingDragWorldPos = pos.copy();

    if (!dragWorkFrame)
        dragWorkFrame = requestAnimationFrame(flushPendingDragWork);
}

function installDirectPointerControls()
{
    if (trialPointerInstalled || !mainCanvas)
        return;

    trialPointerInstalled = true;

    // Prevent browser scrolling/selection from stealing a drag on touch devices.
    mainCanvas.style.touchAction = 'none';

    mainCanvas.addEventListener('pointerdown', e =>
    {
        ensureWindowWashAudio();
        const p = trialClientToWorld(e.clientX, e.clientY);
        trialPointerWorld = p;
        const picked = directPickTool(p);

        if (picked)
        {
            e.preventDefault();

            // Only one tool stays out at a time. Choosing a different tool
            // sends the previously used tool back to its shelf/home spot.
            if (parkedTool && parkedTool != picked && parkedTool.home)
                parkedTool.pos = parkedTool.home.copy();

            if (parkedTool && parkedTool != picked)
                parkedTool = null;

            trialPointerDown = true;
            activeTool = picked;
            lastDragWorldPos = null;
            pendingDragWorldPos = null;
            if (dragWorkFrame)
            {
                cancelAnimationFrame(dragWorkFrame);
                dragWorkFrame = 0;
            }
            try { mainCanvas.setPointerCapture(e.pointerId); } catch(err) {}

            // Start one lightweight continuous sound for this drag.
            startWindowWashToolSound(activeTool);

            // Snap the selected tool to the pointer immediately.
            directMoveActiveTool(p);

            // Draw held tool on a dedicated lightweight overlay so it follows
            // the pointer without waiting for the full game scene redraw.
            drawFastHeldTool(e.clientX, e.clientY);
        }
    });

    mainCanvas.addEventListener('pointermove', e =>
    {
        if (!trialPointerDown || !activeTool)
            return;

        e.preventDefault();

        // Update pointer/render position immediately. The lightweight overlay
        // follows every pointer event, while cleaning work is coalesced to at
        // most one batch per animation frame so later levels stay responsive.
        const p = trialClientToWorld(e.clientX, e.clientY);
        trialPointerWorld = p;
        pendingDragClientX = e.clientX;
        pendingDragClientY = e.clientY;

        drawFastHeldTool(e.clientX, e.clientY);
        scheduleDragWork(p);
    });

    const release = e =>
    {
        if (!trialPointerDown)
            return;

        e.preventDefault();

        const releasedTool = activeTool;
        const releaseWorld = trialPointerWorld ? trialPointerWorld.copy() : null;

        // Finish the latest coalesced cleaning position before ending the drag.
        if (dragWorkFrame)
        {
            cancelAnimationFrame(dragWorkFrame);
            dragWorkFrame = 0;
        }
        if (pendingDragWorldPos && activeTool)
        {
            const pending = pendingDragWorldPos;
            pendingDragWorldPos = null;
            directMoveActiveTool(pending);
        }

        trialPointerDown = false;
        dragging = false;
        stopWindowWashToolSound();
        clearDragOverlay();
        lastDragWorldPos = null;
        activeTool = null;

        if (releasedTool)
        {
            // Dropping a tool back over its shelf/home area snaps it home.
            // Otherwise it stays exactly where the player left it.
            let droppedOnShelf = false;

            if (releasedTool.home && releaseWorld)
            {
                const grabHome = releasedTool.cleaner
                    ? releasedTool.home
                    : releasedTool.home.add(vec2(0,1.0));

                droppedOnShelf = isOverlapping(
                    releaseWorld,
                    vec2(.35),
                    grabHome,
                    vec2(4.2,4.0)
                );
            }

            if (droppedOnShelf && releasedTool.home)
            {
                releasedTool.pos = releasedTool.home.copy();

                if (parkedTool == releasedTool)
                    parkedTool = null;
            }
            else
            {
                parkedTool = releasedTool;
            }
        }

        saveResumeState();
        saveProgress();

        try { mainCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
    };

    mainCanvas.addEventListener('pointerup', release);
    mainCanvas.addEventListener('pointercancel', release);
}

function gameUpdate()
{
    if (!profileReady)
        return;

    if (tutorialActive && !trialMode)
    {
        if (mouseWasPressed(0) || keyWasPressed('Space') || keyWasPressed('Enter'))
            tutorialActive = false;
        // Do not return; gameplay stays live while the hint is visible.
    }

    if (keyWasPressed('KeyR'))
    {
        highestCleanerShown = 0;
        restartGame();
    }

    // Safety net: if cleaner objects were ever lost, recreate them immediately.
    if (!won && cleanerTools.length == 0)
        setupCleanerTools();

    const advanceReady =
        won &&
        !resultsOverlay &&
        (
            levelAdvanceTimer.elapsed() ||
            (levelAdvanceAt > 0 && performance.now() >= levelAdvanceAt)
        );

    if (advanceReady)
    {
        levelAdvanceTimer.unset();
        levelAdvanceAt = 0;

        if (trialMode)
            setupLevel();
        else
            nextLevel();
    }
}

function _wwScreen(pos)
{
    return worldToScreen(pos);
}

function _wwRoundRect(pos, size, radius, topColor, bottomColor=topColor, strokeColor=null, strokeWidth=.04)
{
    const c = mainContext;
    const p = _wwScreen(pos);
    const w = size.x * cameraScale;
    const h = size.y * cameraScale;
    const r = max(1, radius * cameraScale);
    const x = p.x - w/2, y = p.y - h/2;

    c.save();
    c.beginPath();
    c.roundRect(x, y, w, h, r);

    if (topColor != bottomColor)
    {
        const g = c.createLinearGradient(x, y, x, y+h);
        g.addColorStop(0, topColor);
        g.addColorStop(1, bottomColor);
        c.fillStyle = g;
    }
    else c.fillStyle = topColor;

    c.fill();

    if (strokeColor)
    {
        c.strokeStyle = strokeColor;
        c.lineWidth = max(1, strokeWidth*cameraScale);
        c.stroke();
    }
    c.restore();
}

function _wwEllipse(pos, size, topColor, bottomColor=topColor, strokeColor=null, strokeWidth=.04, angle=0)
{
    const c = mainContext;
    const p = _wwScreen(pos);
    const rx = size.x*cameraScale/2;
    const ry = size.y*cameraScale/2;

    c.save();
    c.translate(p.x,p.y);
    c.rotate(-angle);

    c.beginPath();
    c.ellipse(0,0,rx,ry,0,0,Math.PI*2);

    if (topColor != bottomColor)
    {
        const g = c.createLinearGradient(0,-ry,0,ry);
        g.addColorStop(0,topColor);
        g.addColorStop(1,bottomColor);
        c.fillStyle=g;
    }
    else c.fillStyle=topColor;

    c.fill();

    if (strokeColor)
    {
        c.strokeStyle=strokeColor;
        c.lineWidth=max(1,strokeWidth*cameraScale);
        c.stroke();
    }

    c.restore();
}

function _wwPath(origin, commands, fillColor, strokeColor=null, strokeWidth=.04)
{
    const c=mainContext;
    const o=_wwScreen(origin);
    const S=cameraScale;

    c.save();
    c.beginPath();

    for (const q of commands)
    {
        if (q[0]=='M') c.moveTo(o.x+q[1]*S,o.y-q[2]*S);
        else if (q[0]=='L') c.lineTo(o.x+q[1]*S,o.y-q[2]*S);
        else if (q[0]=='C') c.bezierCurveTo(
            o.x+q[1]*S,o.y-q[2]*S,
            o.x+q[3]*S,o.y-q[4]*S,
            o.x+q[5]*S,o.y-q[6]*S);
        else if (q[0]=='Q') c.quadraticCurveTo(
            o.x+q[1]*S,o.y-q[2]*S,
            o.x+q[3]*S,o.y-q[4]*S);
        else if (q[0]=='Z') c.closePath();
    }

    c.fillStyle=fillColor;
    c.fill();

    if (strokeColor)
    {
        c.strokeStyle=strokeColor;
        c.lineWidth=max(1,strokeWidth*S);
        c.lineJoin='round';
        c.lineCap='round';
        c.stroke();
    }

    c.restore();
}

function _wwLine(a,b,width,color)
{
    const c=mainContext;
    const A=_wwScreen(a), B=_wwScreen(b);
    c.save();
    c.beginPath();
    c.moveTo(A.x,A.y);
    c.lineTo(B.x,B.y);
    c.lineWidth=max(1,width*cameraScale);
    c.lineCap='round';
    c.strokeStyle=color;
    c.stroke();
    c.restore();
}

function _wwText(text,pos,size,color='white',font='Trebuchet MS',weight='700',align='center')
{
    const c=mainContext;
    const p=_wwScreen(pos);
    c.save();
    c.textAlign=align;
    c.textBaseline='middle';
    c.font=`${weight} ${max(8,size*cameraScale)}px ${font}`;
    c.fillStyle=color;
    c.fillText(text,p.x,p.y);
    c.restore();
}
function drawRowan()
{
    if (!rowanReferenceSprite.complete || !rowanReferenceSprite.naturalWidth)
        return;

    const view = getCameraSize();

    // Keep Rowan just outside the right edge of the playable glass,
    // leaning naturally against the window frame.
    const centerX = min(windowSize.x/2 + 2.55, view.x/2 - 1.85);
    const groundY = -windowSize.y/2 - .40;

    const aspect = rowanReferenceSprite.naturalWidth / rowanReferenceSprite.naturalHeight;
    const hWorld = min(7.8, view.y * .66);
    const wWorld = hWorld * aspect;

    // His feet stay near the sill/ground; tilt him slightly into the frame.
    const centerY = groundY + hWorld*.48;
    const p = worldToScreen(vec2(centerX, centerY));
    const w = wWorld * cameraScale;
    const h = hWorld * cameraScale;

    const c = mainContext;
    c.save();

    // Pivot near his boots so the upper body leans against the frame.
    c.translate(p.x, p.y + h*.46);
    c.rotate(-0.045);
    c.translate(0, -h*.46);

    c.shadowColor = 'rgba(0,0,0,.18)';
    c.shadowBlur = 10;
    c.shadowOffsetX = 4;
    c.shadowOffsetY = 6;

    c.drawImage(rowanReferenceSprite, -w/2, -h/2, w, h);
    c.restore();
}

        drawRect(vec2(x-.28,-8.20), vec2(.60,.38), hsl(.31,.36,.40,.85));

        windowSize.add(vec2(1.7)), hsl(0,0,0,.18));

    drawRect(WINDOW_POS, windowSize.add(vec2(1.28)), hsl(.08,.05,.97));

    // Counter panels
    for (let x=counterX-windowSize.x*.15; x<=counterX+windowSize.x*.15; x+=1.35)
        drawRect(vec2(x,counterY-.12), vec2(.92,.78), hsl(.53,.18,.74,.30));

    // Red stools
    for (let i=0; i<4; ++i)
    {
        const sx = counterX-windowSize.x*.15 + i*1.20;
        drawRect(vec2(sx,counterY-1.05), vec2(.58,.18), hsl(.99,.58,.44));
        drawRect(vec2(sx,counterY-1.48), vec2(.10,.80), hsl(.58,.08,.36));
        drawRect(vec2(sx,counterY-1.86), vec2(.46,.07), hsl(.58,.08,.24));
    }

    // Register
    drawRect(vec2(counterX-.95,1.30), vec2(.95,.66), hsl(.10,.18,.74));
    drawRect(vec2(counterX-.95,1.64), vec2(.70,.16), hsl(.10,.12,.88));

    // Soda machine
    drawRect(vec2(counterX+1.15,1.43), vec2(.80,1.28), hsl(.55,.10,.72));
    drawRect(vec2(counterX+1.15,2.02), vec2(.55,.15), hsl(.55,.08,.88));

    // Menu board
    drawRect(vec2(-windowSize.x*.06,2.40), vec2(1.65,1.10), hsl(.08,.34,.28));
    drawRect(vec2(-windowSize.x*.06,2.40), vec2(1.42,.88), hsl(.12,.20,.88));
    drawText('MENU', vec2(-windowSize.x*.06,2.58), .24, hsl(.58,.14,.22), .02, WHITE);

    // Pendant lights
    for (let lx=-windowSize.x*.28; lx<=windowSize.x*.30; lx+=windowSize.x*.29)
    {
        drawLine(vec2(lx,windowSize.y/2), vec2(lx,2.65), .035, hsl(.58,.06,.25));
        drawRect(vec2(lx,2.48), vec2(.50,.22), hsl(.13,.72,.72));
    }

    // ================================================================
    // WINDOW BARS - DRAWN BEFORE CELLS
    // This fixes the issue where the window lines covered the cleaning cells.
    // ================================================================
    drawRect(vec2(0,0), vec2(.24,windowSize.y), hsl(.08,.04,.98));
    drawRect(vec2(0,0), vec2(windowSize.x,.24), hsl(.08,.04,.98));

    // ================================================================
    // GLASS / CELLS / MESS
    // These are drawn ABOVE the window bars so the bars do not cover them.
    // ================================================================
    drawRect(WINDOW_POS, windowSize, hsl(.55,.12,.84,.035));

    const cell = vec2(windowSize.x/gridX+.03, windowSize.y/gridY+.03);

    for (let i=0; i<dirt.length; ++i)
    {
        const d = dirt[i];
        if (d.clean) continue;

        // Level 3+ SIMPLE MODE: one cheap rectangle per dirty cell.
        // No glow/ring/burst textures, no stacked decorative grime marks.
        // Mess types remain visually distinct by color and still require
        // their matching cleaner.
        if (!trialMode && level >= 3)
        {
            let grimeColor = hsl(.08,.38,.28,.64);      // dust
            if (d.mess.id == 'grease')
                grimeColor = hsl(.12,.48,.32,.58);
            else if (d.mess.id == 'bug')
                grimeColor = hsl(.02,.62,.24,.72);
            else if (d.mess.id == 'mineral')
                grimeColor = hsl(.55,.08,.88,.72);
            else if (d.mess.id != 'dust')
                grimeColor = hsl(.94,.46,.68,.68);

            drawRect(d.pos, cell.scale(.88), grimeColor);
            continue;
        }

        if (d.mess.id == 'dust')
        {
            // Dry dirt/dust: warm brown, matte, uneven.
            drawRect(d.pos, cell.scale(.95), hsl(.08,.40,.30,.68), .08);
            drawRect(d.pos.add(vec2(.10,-.04)), cell.scale(.45),
                hsl(.08,.28,.22,.42), -.16);
        }
        else if (d.mess.id == 'grease')
        {
            // Grease/oil: translucent yellow-brown glossy smear.
            drawTile(d.pos, cell.scale(1.55), icons.glow, hsl(.12,.50,.34,.50));
            drawRect(d.pos.add(vec2(-.08,.05)), vec2(cell.x*.70,cell.y*.18),
                hsl(.12,.42,.24,.28), .14);
            drawRect(d.pos.add(vec2(.10,.10)), vec2(cell.x*.32,cell.y*.05),
                hsl(.13,.24,.88,.24), -.10);
        }
        else if (d.mess.id == 'bug')
        {
            // Bug splat: dark reddish-brown center with radial burst.
            drawTile(d.pos, cell.scale(1.22), icons.burst, hsl(.02,.72,.24,.88));
            drawRect(d.pos, vec2(cell.x*.22,cell.y*.17),
                hsl(.01,.66,.14,.88), .32);
        }
        else if (d.mess.id == 'mineral')
        {
            // Mineral/hard-water spots: pale chalky rings.
            drawTile(d.pos, cell.scale(1.18), icons.ring, hsl(.55,.10,.92,.82));
            drawTile(d.pos.add(vec2(.05,.03)), cell.scale(.62), icons.ring,
                hsl(.55,.04,.98,.46));
        }
        else
        {
            // Ice cream: pink/cream sticky smear with drip.
            drawTile(d.pos, cell.scale(1.42), icons.glow, hsl(.93,.58,.78,.86));
            drawRect(d.pos.add(vec2(-.08,.05)), vec2(cell.x*.65,cell.y*.22),
                hsl(.11,.54,.92,.70), -.12);
            drawRect(d.pos.add(vec2(.10,-.18)), vec2(cell.x*.12,cell.y*.45),
                hsl(.93,.48,.72,.62), -.02);
        }
    }

    // Wet cleaner layers — render localized cleaner residue per cell again.
    // Profiling showed drawRect is cheap, so use detailed rectangles for water
    // and soap while keeping expensive textured grime aggressively sampled.
    for (const w of wetness)
    {
        if (!w.layers)
            continue;

        let cleanerId =
            w.lastCleanerId && (w.layers[w.lastCleanerId] || 0) > .05
                ? w.lastCleanerId
                : '';
        let amount = cleanerId ? w.layers[cleanerId] : 0;

        if (!cleanerId)
        {
            for (const id in w.layers)
            {
                const layerAmount = w.layers[id];
                if (layerAmount > amount)
                {
                    amount = layerAmount;
                    cleanerId = id;
                }
            }
        }

        if (!cleanerId || amount <= .05)
            continue;

        let hue = .56;
        let sat = .70;
        let light = .74;

        if (cleanerId == 'soap')
        {
            hue = .42;
            sat = .72;
            light = .76;
        }
        else if (cleanerId == 'degreaser')
        {
            hue = .12;
            sat = .70;
            light = .72;
        }
        else if (cleanerId == 'vinegar')
        {
            hue = .90;
            sat = .55;
            light = .80;
        }
        else if (cleanerId == 'rowan')
        {
            hue = .78;
            sat = .60;
            light = .74;
        }

        const alpha = cleanerId == 'water'
            ? (.045 + .12*amount)
            : (.09 + .20*amount);

        // SIMPLE MODE: exactly one cheap shape per wet cell.
        // Soap is brighter/denser than water, but both avoid extra draw calls.
        const mainScale = cleanerId == 'water' ? .76 : .90;
        const cleanerAlpha = cleanerId == 'soap'
            ? (.16 + .22*amount)
            : alpha;
        drawRect(w.pos, cell.scale(mainScale), hsl(hue,sat,light,cleanerAlpha));
    }

    // ================================================================
    // SILL
    // ================================================================
    drawRect(vec2(0,-windowSize.y/2-.72),
        vec2(windowSize.x+2.15,.52), hsl(.08,.05,.97));
    drawRect(vec2(0,-windowSize.y/2-.94),
        vec2(windowSize.x+2.55,.28), hsl(.56,.16,.66));

    // Keep Rowan exactly as he is now
    drawRowan();

    if (activeTool == squeegee)
        drawRect(mousePos.add(vec2(0,-1.1)),
            vec2(3.9,.72), hsl(.53,.50,.94,.08));
}

    // Lightweight non-blocking cleaner tutorial.
    if (tutorialCleaner && tutorialDemoTimer.active())

        const mess = MESS_TYPES.find(m => m.cleaner == tutorialCleaner.id);
        const w = min(650, mainCanvasSize.x-40);

        drawRect(vec2(cx,y), vec2(w,78), hsl(.58,.10,.10,.88), 0, true);
        drawTextScreen(`NEW CLEANER: ${tutorialCleaner.name}`,
            vec2(cx,y-18), 20, hsl(tutorialCleaner.hue,.88,.66), 3, BLACK);
        drawTextScreen(`CLEANS: ${mess ? mess.name : 'MESS'}   •   SPRAY, THEN SQUEEGEE`,
            vec2(cx,y+18), 15, WHITE, 2, BLACK);
    }

}
