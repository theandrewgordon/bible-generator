// AI can use this class to make sound effects
class SoundGenerator extends Sound
{
    constructor(params = {})
    {
        const {
            volume = 1,        // Volume scale (percent)
            randomness = .05,  // How much to randomize frequency (percent Hz)
            frequency = 220,   // Frequency of sound (Hz)
            attack = 0,        // Attack time, how fast sound starts (seconds)
            release = .1,      // Release time, how fast sound fades out (seconds)
            shapeCurve = 1,    // Squarenes of wave (0=square, 1=normal, 2=pointy)
            slide = 0,         // How much to slide frequency (kHz/s)
            pitchJump = 0,     // Frequency of pitch jump (Hz)
            pitchJumpTime = 0, // Time of pitch jump (seconds)
            repeatTime = 0,    // Resets some parameters periodically (seconds)
            noise = 0,         // How much random noise to add (percent)
            bitCrush = 0,      // Resamples at a lower frequency in (samples*100)
            delay = 0,         // Overlap sound with itself for reverb and flanger effects (seconds)
        } = params;

        super([volume, randomness, frequency, attack, 0, release, 0, shapeCurve, slide, 0, pitchJump, pitchJumpTime, repeatTime, noise, 0, bitCrush, delay, 1, 0, 0, 0]);
    }
}

///////////////////////////////////////////////////////////////////////////////
// SPRITE ATLAS (do not remove) - bakes 16 white shape icons into one texture so
// the AI can draw recolorable sprites with zero external assets. Call
// initDefaultAtlas() once in gameInit to get a name->TileInfo map, then draw any
// icon with drawTile(pos, size, icons.NAME, color). Each icon is pure white, so
// the color argument tints it to any hue. Icon names (tiles 0-15):
//   circle glow ring roundSquare triangle diamond pentagon hexagon
//   spark star burst plus heart droplet bolt arrow

const ATLAS_SIZE = 2048; // texture size in pixels
const DRAW_SIZE = 500;   // fixed logical space every icon is painted in
let TILE_COLS, TILE_PADDING, TILE_STRIDE, TILE_SIZE, TILE_COUNT;
let atlasCanvas, atlasCtx, atlasDirty, flushScheduled;

function initDrawToTexture(cols = 4)
{
    ASSERT(cols === 4 || cols === 8, 'cols must be 4 or 8');

    TILE_COLS    = cols;
    TILE_STRIDE  = ATLAS_SIZE / TILE_COLS;          // 512 or 256
    TILE_PADDING = TILE_COLS === 4 ? 12 : 6;        // transparent moat to stop mip bleed
    TILE_SIZE    = TILE_STRIDE - TILE_PADDING * 2;  // 488 or 244
    TILE_COUNT   = TILE_COLS * TILE_COLS;

    atlasCanvas = document.createElement('canvas');
    atlasCanvas.width = atlasCanvas.height = ATLAS_SIZE;
    atlasCtx = atlasCanvas.getContext('2d');

    textureInfos[0] && textureInfos[0].destroyWebGLTexture();
    textureInfos[0] = new TextureInfo(atlasCanvas);

    setTileDefaultSize(vec2(TILE_SIZE));
    setTileDefaultPadding(TILE_PADDING);
    atlasDirty = flushScheduled = false;
}

function drawToTexture(tileIndex, drawFn)
{
    ASSERT(tileIndex >= 0 && tileIndex < TILE_COUNT, 'tileIndex out of range');

    const cellX = (tileIndex % TILE_COLS) * TILE_STRIDE;
    const cellY = (tileIndex / TILE_COLS | 0) * TILE_STRIDE;
    const drawX = cellX + TILE_PADDING;
    const drawY = cellY + TILE_PADDING;

    atlasCtx.clearRect(cellX, cellY, TILE_STRIDE, TILE_STRIDE);
    atlasCtx.save();
    atlasCtx.translate(drawX, drawY);
    atlasCtx.beginPath();
    atlasCtx.rect(0, 0, TILE_SIZE, TILE_SIZE);
    atlasCtx.clip();
    // paint in a fixed DRAW_SIZE space scaled to fill the tile
    atlasCtx.scale(TILE_SIZE / DRAW_SIZE, TILE_SIZE / DRAW_SIZE);
    drawFn(atlasCtx, tileIndex);
    atlasCtx.restore();

    atlasDirty = true;
    if (!flushScheduled)
    {
        flushScheduled = true;
        queueMicrotask(flushAtlas);
    }
    return new TileInfo(vec2(drawX, drawY), vec2(TILE_SIZE), textureInfos[0], TILE_PADDING);
}

function flushAtlas()
{
    flushScheduled = false;
    if (!atlasDirty) return;
    atlasDirty = false;
    textureInfos[0].createWebGLTexture();
}

// Force every texel RGB to white (keeping alpha) so bilinear/mipmap filtering
// can't darken the white icon edges into a halo. Call after painting white tiles.
function whitenAtlasAlpha()
{
    flushAtlas();
    if (!glContext || !textureInfos[0].glTexture) return; // canvas2D: no GL halo

    const image = atlasCtx.getImageData(0, 0, ATLAS_SIZE, ATLAS_SIZE);
    const d = image.data;
    for (let i = 0; i < d.length; i += 4)
        d[i] = d[i+1] = d[i+2] = 255; // white RGB, leave alpha alone

    glContext.bindTexture(glContext.TEXTURE_2D, textureInfos[0].glTexture);
    glContext.texImage2D(glContext.TEXTURE_2D, 0, glContext.RGBA,
        glContext.RGBA, glContext.UNSIGNED_BYTE, image);
    if (!tilesPixelated && isPowerOfTwo(ATLAS_SIZE))
        glContext.generateMipmap(glContext.TEXTURE_2D);
    glContext.bindTexture(glContext.TEXTURE_2D, glActiveTexture); // restore engine binding
}

// 16 built-in white-on-transparent icons, drawn centred at (x,y) with radius r.
const DEFAULT_ICON_NAMES = [
    'circle', 'glow', 'ring', 'roundSquare',
    'triangle', 'diamond', 'pentagon', 'hexagon',
    'spark', 'star', 'burst', 'plus',
    'heart', 'droplet', 'bolt', 'arrow',
];

const _defaultIconDrawers = (() =>
{
    function poly(ctx, x, y, r, sides, rot = 0)
    {
        ctx.beginPath();
        for (let k = sides; k--;)
        {
            const a = rot + k * (2*PI / sides);
            ctx.lineTo(x + Math.sin(a) * r, y - Math.cos(a) * r);
        }
        ctx.closePath();
    }
    function starPath(ctx, x, y, ro, ri, points, rot = -PI/2)
    {
        ctx.beginPath();
        for (let k = points * 2; k--;)
        {
            const rr = k & 1 ? ri : ro;
            const a = rot + k * (PI / points);
            ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.closePath();
    }
    function roundRectPath(ctx, x, y, w, h, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    function circle(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function droplet(ctx, x, y, r)
    {
        const by = y + .3 * r, br = .6 * r;
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.bezierCurveTo(x + .3 * r, y - .5 * r, x + br, y - .1 * r, x + br, by);
        ctx.arc(x, by, br, 0, PI);
        ctx.bezierCurveTo(x - br, y - .1 * r, x - .3 * r, y - .5 * r, x, y - r);
        ctx.closePath();
        ctx.fill();
    }
    function roundSquare(ctx, x, y, r)
    {
        roundRectPath(ctx, x - r, y - r, r*2, r*2, r*.4);
        ctx.fill();
    }
    function triangle(ctx, x, y, r) { poly(ctx, x, y, r, 3);        ctx.fill(); }
    function diamond(ctx, x, y, r)  { poly(ctx, x, y, r, 4);        ctx.fill(); }
    function pentagon(ctx, x, y, r) { poly(ctx, x, y, r, 5);        ctx.fill(); }
    function hexagon(ctx, x, y, r)  { poly(ctx, x, y, r, 6, PI/2);  ctx.fill(); }
    function ring(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.arc(x, y, r*.7, 9, 0, true);
        ctx.fill();
    }
    function glow(ctx, x, y, r)
    {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function burst(ctx, x, y, r) { starPath(ctx, x, y, r, r*.7, 10); ctx.fill(); }
    function spark(ctx, x, y, r) { starPath(ctx, x, y, r, r/4, 4);   ctx.fill(); }
    function star(ctx, x, y, r)  { starPath(ctx, x, y, r, r*.4, 5);  ctx.fill(); }
    function heart(ctx, x, y, r)
    {
        const width = 1, topCtrl = .92, dip = .40, shoulder = .46, tip = .9;
        const p = (nx, ny) => [x + nx * r, y + ny * r];
        ctx.beginPath();
        ctx.moveTo(...p(0, -dip));
        ctx.bezierCurveTo(...p(0, -topCtrl), ...p(-width, -topCtrl), ...p(-width, -shoulder));
        ctx.bezierCurveTo(...p(-width, 0), ...p(0, tip * .9), ...p(0, tip));
        ctx.bezierCurveTo(...p(0, tip * .9), ...p(width, 0), ...p(width, -shoulder));
        ctx.bezierCurveTo(...p(width, -topCtrl), ...p(0, -topCtrl), ...p(0, -dip));
        ctx.closePath();
        ctx.fill();
    }
    function plus(ctx, x, y, r)
    {
        const a = r * .3, b = r;
        ctx.beginPath();
        ctx.moveTo(x - a, y - b); ctx.lineTo(x + a, y - b); ctx.lineTo(x + a, y - a);
        ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y + a); ctx.lineTo(x + a, y + a);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y + a);
        ctx.lineTo(x - b, y + a); ctx.lineTo(x - b, y - a); ctx.lineTo(x - a, y - a);
        ctx.closePath();
        ctx.fill();
    }
    function arrow(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + .8 * r, y - .1 * r); ctx.lineTo(x + .3 * r, y - .1 * r);
        ctx.lineTo(x + .3 * r, y + r);      ctx.lineTo(x - .3 * r, y + r);
        ctx.lineTo(x - .3 * r, y - .1 * r); ctx.lineTo(x - .8 * r, y - .1 * r);
        ctx.closePath();
        ctx.fill();
    }
    function bolt(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + .25 * r, y - r);   ctx.lineTo(x - .5 * r, y + .15 * r);
        ctx.lineTo(x - .1 * r, y + .15 * r); ctx.lineTo(x - .25 * r, y + r);
        ctx.lineTo(x + .5 * r, y - .2 * r);  ctx.lineTo(x + .1 * r, y - .2 * r);
        ctx.closePath();
        ctx.fill();
    }
    return {
        circle, glow, ring, roundSquare, triangle, diamond, pentagon, hexagon,
        spark, star, burst, plus, heart, droplet, bolt, arrow,
    };
})();

// Paint one named white icon into a tile and return its TileInfo. scale tweaks
// icon size within the tile (1 = default).
function drawDefaultIcon(name, tileIndex, scale = 1)
{
    const fn = _defaultIconDrawers[name];
    ASSERT(fn, 'unknown default icon: ' + name);
    return drawToTexture(tileIndex, ctx =>
    {
        const c = DRAW_SIZE / 2, r = c * scale;
        ctx.fillStyle = ctx.strokeStyle = '#fff';
        ctx.lineJoin = ctx.lineCap = 'round';
        fn(ctx, c, c, r);
    });
}

// Build the 16 default icons into tiles 0-15 and return a name->TileInfo map.
function initDefaultAtlas(scale = 1)
{
    if (!atlasCtx) initDrawToTexture(4);
    const icons = {};
    for (let i = 0; i < DEFAULT_ICON_NAMES.length; ++i)
        icons[DEFAULT_ICON_NAMES[i]] = drawDefaultIcon(DEFAULT_ICON_NAMES[i], i, scale);
    whitenAtlasAlpha(); // white RGB everywhere -> no dark halo
    return icons;
}

 const shirts=[hsl(.6,.55,.52),hsl(.02,.65,.55),hsl(.32,.5,.48),hsl(.82,.48,.58),hsl(.12,.65,.52)];
 const hairs=[hsl(.07,.45,.25),hsl(.1,.55,.35),hsl(.03,.6,.25),hsl(.58,.18,.2),hsl(.09,.35,.18)];

 }else drawLine(q.add(vec2(-.16,.28)),q.add(vec2(.16,.28)),.045,hsl(.98,.55,.35));
}
function missingIngredient(){
 if(!order)return '';
 return order.need.find(name=>!tray.includes(name) && name!=scoopFlavor && name!=holdingMilk) || '';
}
function shortName(name){
 return name.replace(' Ice Cream','').replace('Chocolate Syrup','Choc. Syrup').replace('Strawberry Syrup','Berry Syrup');
}
function kidStep(){
 if(needsReset)return 'TAP START OVER';
 if(waitingForNext){
  if(guestPhase=='thanks')return 'THE CUSTOMER SAYS THANK YOU!';
  if(guestPhase=='leaving')return 'BYE! NEXT CUSTOMER...';
  if(guestPhase=='arriving')return 'A NEW CUSTOMER IS COMING!';
  return 'GREAT JOB!';
 }
 if(blenderRunning)return 'WAIT... IT IS BLENDING!';
 if(cupFilled)return 'TAKE THE CUP TO THE CUSTOMER';
 if(prepared && !holdingCup)return 'PICK UP A CUP';
 if(prepared && holdingCup)return order.kind=='BLEND'?'TAP THE BLENDER TO FILL THE CUP':'TAP MIX TO FILL THE CUP';

 const station=order && order.kind=='MIX'?'MIX':'BLENDER';
 if(scoopLoaded)return `TAP ${station} TO ADD THE SCOOP`;
 if(holdingMilk)return `TAP ${station} TO POUR ${shortName(holdingMilk).toUpperCase()}`;

 const miss=missingIngredient();
 if(miss){
  const item=PANTRY.find(x=>x.name==miss);
  if(item && isScoopFlavor(item)){
   if(!holdingScoop)return 'PICK UP THE SCOOPER';
   return `TAP ${shortName(miss).toUpperCase()}`;
  }
  if(holdingScoop)return 'SET THE SCOOPER DOWN';
  return `PICK UP ${shortName(miss).toUpperCase()}`;
 }
 return order && order.kind=='MIX'?'TAP MIX TO MAKE THE DRINK':'PRESS THE BLENDER BUTTON';
}
function kidTarget(){
 if(needsReset)return vec2(0,-5.18);
 if(waitingForNext)return 0;
 if(cupFilled)return vec2(7.5,2.15);
 if(prepared&&!holdingCup)return vec2(6.5,-4.82);
 if(prepared&&holdingCup)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
 if(scoopLoaded||holdingMilk)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);

 const miss=missingIngredient();
 if(miss){
  const item=PANTRY.find(x=>x.name==miss);
  if(item&&isScoopFlavor(item)&&!holdingScoop)return vec2(-6.5,-4.82);
  if(item&&isScoopFlavor(item))return item.pos;
  if(holdingScoop)return vec2(-6.5,-4.82);
  if(item)return item.pos;
 }
 return order&&order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
}

}
function sayOrder(){
 if(!order)return;
 whitSpeak(`Order up! One ${order.name}, please. Need: ${order.need.join(', ')}.`);
}
function newOrder(arriving=false){
 order=RECIPES[randInt(min(RECIPES.length,5+level*2))];
 order.customer=CUSTOMERS[randInt(CUSTOMERS.length)];
 guestName=order.customer;
 guestStyle=max(0,CUSTOMERS.indexOf(guestName));
 tray=[];prepared=false;scoopLoaded=false;scoopFlavor='';holdingCup=false;cupFilled=false;holdingScoop=false;holdingMilk=false;
 blenderRunning=false;needsReset=false;
 if(arriving){
  waitingForNext=true;guestPhase='arriving';guestSlide=3.1;guestSlideTarget=0;
  message=`${guestName} is coming to the counter!`;messageTimer.set(1.5);
 }else{
  waitingForNext=false;guestPhase='active';guestSlide=0;
  message=`New order: ${order.name}`;messageTimer.set(2);
 }
}
function hit(pos,size=vec2(2.5,1.7)){return isOverlapping(mousePos,vec2(.1),pos,size);}
function isScoopFlavor(item){
 return item.name.includes('Ice Cream') || item.name=='Raspberry Ripple';
}
function addIngredient(item){
 if(waitingForNext||needsReset)return;

 // Wrong choices are stopped immediately so young players never poison the recipe.
 if(!recipeHas(item.name)){
  message=`${shortName(item.name)} is not in this order.`;
  messageTimer.set(1.7);sndBad.play();return;
 }
 if(alreadyAdded(item.name)){
  message=`${shortName(item.name)} is already added.`;
  messageTimer.set(1.4);sndBad.play();return;
 }

 if(isScoopFlavor(item)){
  if(holdingMilk){
   message=`Put ${shortName(holdingMilk)} in the machine first.`;
   messageTimer.set(1.7);sndBad.play();return;
  }
  if(!holdingScoop){
   message='Pick up the scooper first.';
   messageTimer.set(1.6);sndBad.play();return;
  }
  if(scoopLoaded){
   message='Put the scoop in the machine first.';
   messageTimer.set(1.6);sndBad.play();return;
  }
  scoopFlavor=item.name;scoopLoaded=true;
  message=`Scoop of ${shortName(item.name)} ready!`;
  messageTimer.set(1.5);sndPick.play();return;
 }

 // Pourables are picked up by hand, never with the scooper.
 if(holdingScoop){
  message='Set the scooper down first.';
  messageTimer.set(1.5);sndBad.play();return;
 }
 if(holdingMilk){
  message=`Put ${shortName(holdingMilk)} in the machine first.`;
  messageTimer.set(1.5);sndBad.play();return;
 }
 holdingMilk=item.name;pickupBounce.set(.35);heldVisualReady=false;
 message=`Picked up ${shortName(item.name)}.`;
 messageTimer.set(1.3);sndPick.play();
}
function serve(){
 if(waitingForNext)return;
 if(!holdingCup||!cupFilled){message='Pick up a cup and fill it from the blender first.';messageTimer.set(2);sndBad.play();return;}
 if(!prepared){message=`Use the ${order.kind==='BLEND'?'blender':'mix station'} first.`;messageTimer.set(2);sndBad.play();return;}
 const a=[...tray].sort().join('|'),b=[...order.need].sort().join('|');
 if(a===b){
  score+=100;served++;stars++;level=1+Math.floor(stars/3);
  holdingCup=false;cupFilled=false;waitingForNext=true;
  happyTimer.set(1.5);guestPhase='thanks';guestTimer.set(1.5);
  message=`${guestName}: Thank you!`;messageTimer.set(1.5);sndGood.play();
  new ParticleEmitter(vec2(7.5,2.6),0,0,.1,70,PI,icons.spark,YELLOW,WHITE,rgb(1,1,0,0),rgb(1,1,1,0),.6,.15,.7,.12,0,1,1,0,PI,.1,.2,false,true);
 }else{needsReset=true;message='Oops! Tap START OVER and try again.';messageTimer.set(2);sndBad.play();}
}

 icons=initDefaultAtlas();initIllustratedAtlas();canvasClearColor=hsl(.08,.18,.12);cameraPos=vec2(0,0);cameraScale=47;newOrder();
}
function gameUpdate(){
 // Finish timed blending.
 if(blenderRunning&&blenderTimer.elapsed()){
  blenderRunning=false;prepared=true;
  message='Ready! Pick up a cup.';
  messageTimer.set(2);sndGood.play();
 }
 if(waitingForNext){
  if(guestPhase=='thanks'&&guestTimer.elapsed()){
   guestPhase='leaving';guestTimer.set(.9);message=`Bye, ${guestName}!`;messageTimer.set(.9);
  }
  else if(guestPhase=='leaving'){
   guestSlideTarget=3.2;
   guestSlide=lerp(guestSlide,guestSlideTarget,.12);
   if(guestTimer.elapsed())newOrder(true);
  }
  else if(guestPhase=='arriving'){
   guestSlideTarget=0;
   guestSlide=lerp(guestSlide,guestSlideTarget,.1);
   if(guestSlide<.05){
    guestSlide=0;guestPhase='active';waitingForNext=false;
    message=`${guestName}: I'd like a ${order.name}, please!`;messageTimer.set(2);
   }
  }
 }
 if(waitingForNext)return;
 if(!mouseWasPressed(0))return;

 // Scooper dock.
 if(hit(vec2(-6.5,-4.82),vec2(3.1,1.5))){
  if(holdingScoop){
   holdingScoop=false;scoopLoaded=false;scoopFlavor='';
   message='Scooper set down.';
  }else{
   if(holdingMilk){message=`Put ${holdingMilk} in the machine first.`;messageTimer.set(2);sndBad.play();return;}
   holdingScoop=true;pickupBounce.set(.35);heldVisualReady=false;message='Scooper picked up!';
  }
  messageTimer.set(1.5);sndPick.play();return;
 }

 // Cup dock.
 if(hit(vec2(6.5,-4.82),vec2(3.1,1.5))){
  if(prepared){
   holdingCup=!holdingCup;
   if(!holdingCup)cupFilled=false;
   if(holdingCup){pickupBounce.set(.35);heldVisualReady=false;} message=holdingCup?'Cup picked up!':'Cup set down.';
   messageTimer.set(1.5);sndPick.play();
  }else{
   message='Make the drink first.';messageTimer.set(1.5);sndBad.play();
  }
  return;
 }

 // Clear button.
 if(hit(vec2(0,-5.18),vec2(1.9,.65))){
  tray=[];scoopLoaded=false;scoopFlavor='';holdingScoop=false;holdingMilk=false;
  holdingCup=false;cupFilled=false;blenderRunning=false;prepared=false;needsReset=false;
  message='Fresh start!';messageTimer.set(1.2);return;
 }

 // Ingredients.
 for(const item of PANTRY){
  if(hit(item.pos,vec2(2.0,1.7))){addIngredient(item);return;}
 }

 // Blender station.
 if(hit(vec2(-3.8,1.15),vec2(2.8,2.7))){
  if(order.kind!='BLEND'){message='This drink uses MIX.';messageTimer.set(1.5);sndBad.play();return;}
  if(holdingMilk){
   const poured=holdingMilk;holdingMilk=false;tray.push(poured);prepared=false;
   message=`Added ${shortName(poured)}!`;messageTimer.set(1.2);markAdded(poured,vec2(-3.8,1.5));sndPick.play();return;
  }
  if(scoopLoaded){
   const added=scoopFlavor;tray.push(added);scoopLoaded=false;prepared=false;
   message='Scoop added!';messageTimer.set(1.2);markAdded(added,vec2(-3.8,1.5));sndPick.play();return;
  }
  if(prepared&&holdingCup){
   cupFilled=true;message='Cup filled! Take it to the customer.';messageTimer.set(2);sndPick.play();return;
  }
  if(missingIngredient()){
   message=`Still need ${missingIngredient()}.`;messageTimer.set(1.8);sndBad.play();return;
  }
  if(!prepared&&!blenderRunning){
   blenderRunning=true;blenderTimer.set(1.4);message='Blending!';messageTimer.set(1.4);sndPrep.play();return;
  }
  return;
 }

 // Mix station.
 if(hit(vec2(0,1.15),vec2(2.8,2.7))){
  if(order.kind!='MIX'){message='This drink uses the BLENDER.';messageTimer.set(1.5);sndBad.play();return;}
  if(holdingMilk){
   const poured=holdingMilk;holdingMilk=false;tray.push(poured);prepared=false;
   message=`Added ${shortName(poured)}!`;messageTimer.set(1.2);markAdded(poured,vec2(0,1.5));sndPick.play();return;
  }
  if(scoopLoaded){
   const added=scoopFlavor;tray.push(added);scoopLoaded=false;prepared=false;
   message='Scoop added!';messageTimer.set(1.2);markAdded(added,vec2(0,1.5));sndPick.play();return;
  }
  if(prepared&&holdingCup){
   cupFilled=true;message='Cup filled! Take it to the customer.';messageTimer.set(2);sndPick.play();return;
  }
  if(missingIngredient()){
   message=`Still need ${missingIngredient()}.`;messageTimer.set(1.8);sndBad.play();return;
  }
  if(!prepared){
   prepared=true;message='Mixed! Pick up a cup.';messageTimer.set(1.7);sndPrep.play();return;
  }
  return;
 }

 // Customer is the only place that serves.
 if(hit(vec2(7.5,2.45),vec2(2.3,2.8))){
  if(holdingCup&&cupFilled)serve();
  else{message='Bring the finished cup here.';messageTimer.set(1.8);sndBad.play();}
  return;
 }
}

function ingredientArt(name){
 if(name=='Vanilla Ice Cream')return art.vanilla;
 if(name=='Chocolate Ice Cream')return art.chocolate;
 if(name=='Strawberry Ice Cream')return art.strawberry;
 if(name=='Raspberry Ripple')return art.raspberry;
 if(name=='Milk')return art.milk;
 if(name=='Chocolate Syrup')return art.chocSyrup;
 if(name=='Strawberry Syrup')return art.berrySyrup;
 if(name=='Soda Water')return art.soda;
 return 0;
}
function ingredientDone(name){

function isCurrentIngredient(name){
 const miss=missingIngredient();
 return !!miss && miss==name;
}

 for(let y=-.25;y<=.55;y+=.2)drawLine(pos.add(vec2(-.46,y)),pos.add(vec2(-.34,y)),.025,hsl(.55,.14,.62));
 // blades
 drawLine(pos.add(vec2(-.28,-.42)),pos.add(vec2(.28,-.18)),.06,hsl(.55,.08,.55));
 drawLine(pos.add(vec2(.28,-.42)),pos.add(vec2(-.28,-.18)),.06,hsl(.55,.08,.55));
 // power button
 drawTile(pos.add(vec2(.48,-.64)),vec2(.24),icons.circle,blenderRunning?YELLOW:RED);
 drawBlenderContents(pos.add(vec2(0,.05)));
}
function drawChromeFountain(pos){
 drawSoftShadow(pos.add(vec2(0,-.72)),vec2(2.0,.45));
 drawRect(pos.add(vec2(0,-.15)),vec2(1.8,1.45),hsl(.55,.08,.78));
 drawRect(pos.add(vec2(0,.48)),vec2(1.48,.35),hsl(.55,.12,.92));
 // three pumps
 for(let i=0;i<3;i++){
  const x=-.48+i*.48;
  drawLine(pos.add(vec2(x,.4)),pos.add(vec2(x,.92)),.09,hsl(.55,.08,.34));
  drawTile(pos.add(vec2(x,.98)),vec2(.22),icons.circle,[hsl(.98,.62,.56),hsl(.12,.62,.56),hsl(.55,.62,.56)][i]);
 }
 // chrome shine
 drawLine(pos.add(vec2(-.72,.2)),pos.add(vec2(-.72,-.4)),.04,WHITE);
 // drip tray
 drawRect(pos.add(vec2(0,-.82)),vec2(1.95,.2),hsl(.55,.08,.5));
 for(let x=-.7;x<=.7;x+=.23)drawLine(pos.add(vec2(x,-.9)),pos.add(vec2(x,-.75)),.02,hsl(.55,.08,.75));
 // straw holder + cherries
 drawRect(pos.add(vec2(1.0,-.45)),vec2(.42,.7),hsl(.55,.12,.9));
 for(let i=0;i<3;i++)drawLine(pos.add(vec2(.88+i*.12,-.12)),pos.add(vec2(.98+i*.1,.55)),.035,hsl(.98,.7,.55));
 drawRect(pos.add(vec2(-1.03,-.5)),vec2(.42,.42),hsl(.12,.15,.9));
 drawTile(pos.add(vec2(-1.1,-.4)),vec2(.13),icons.circle,RED);
 drawTile(pos.add(vec2(-.97,-.35)),vec2(.13),icons.circle,RED);
 drawMixerFizz(pos.add(vec2(0,.05)));
}
function drawOrderTicket(){
 // rail and clip
 drawRect(vec2(0,4.45),vec2(9.4,.14),hsl(.55,.08,.4));
 drawTile(vec2(0,4.4),vec2(.28),icons.ring,hsl(.55,.08,.52));
 drawSoftShadow(vec2(0,3.55),vec2(9.1,1.95));
 drawRect(vec2(0,3.56),vec2(8.95,1.86),hsl(.12,.08,.97));
 drawLine(vec2(-4.25,4.32),vec2(4.25,4.32),.03,hsl(.08,.25,.78));
}
function drawBulletinBoard(pos){
 drawRect(pos,vec2(2.2,1.45),hsl(.08,.38,.28));
 drawRect(pos,vec2(1.95,1.2),hsl(.08,.52,.62));
 drawRect(pos.add(vec2(-.45,.22)),vec2(.58,.5),hsl(.13,.35,.92));
 drawRect(pos.add(vec2(.36,.12)),vec2(.62,.42),hsl(.55,.35,.92));
 drawRect(pos.add(vec2(-.1,-.35)),vec2(.72,.32),hsl(.97,.45,.82));
 drawTile(pos.add(vec2(-.65,.48)),vec2(.08),icons.circle,RED);
 drawTile(pos.add(vec2(.58,.35)),vec2(.08),icons.circle,RED);
}
function drawCondimentTray(pos){
 drawRect(pos,vec2(1.45,.28),hsl(.08,.35,.3));
 for(let i=0;i<3;i++){
  drawRect(pos.add(vec2(-.42+i*.42,.28)),vec2(.28,.42),[hsl(.02,.62,.5),hsl(.12,.62,.58),hsl(.55,.25,.78)][i]);
 }
}
function gameRender(){
 // Calm illustrated shop scene
 drawRectGradient(cameraPos,getCameraSize(),hsl(.54,.18,.94),hsl(.11,.18,.91));
 drawShopInterior();
 // Entrance door and jingle bell
 drawRect(vec2(8.75,2.05),vec2(1.15,2.75),hsl(.08,.34,.3));
 drawRect(vec2(8.75,2.15),vec2(.82,2.28),hsl(.08,.22,.48));
 drawTile(vec2(8.55,3.55),vec2(.28),icons.burst,hsl(.12,.7,.72),guestPhase=='arriving'?sin(time*18)*.2:0);
 if(guestPhase=='arriving')drawText('JINGLE!',vec2(8.0,4.1),.2,hsl(.07,.55,.2));

 // One clear instruction
 drawRect(vec2(0,6.95),vec2(17.6,1.2),hsl(.12,.45,.97));
 drawText(kidStep(),vec2(0,7.08),.58,hsl(.07,.58,.18),.05,WHITE);
 drawText('ONE STEP AT A TIME',vec2(0,6.66),.24,hsl(.07,.25,.24));

 // Cleaner marquee
 drawRect(vec2(0,5.9),vec2(18.5,1.0),hsl(.08,.42,.34));
 drawText("WHIT'S END",vec2(0,6.03),1.04,hsl(.12,.52,.9),.07,hsl(.08,.62,.22));
 drawText('ICE CREAM  •  SHAKES  •  SODAS',vec2(0,5.58),.34,WHITE,.03,BLACK);

 // Small status chips only
 drawText(`LEVEL ${level}`,vec2(-7.8,5.05),.24,hsl(.06,.45,.2));
 drawText(`⭐ ${stars}`,vec2(7.8,5.05),.26,hsl(.08,.55,.28));

 // Small café tables add depth without competing with gameplay
 for(const x of [-6.2,6.2]){
  drawSoftShadow(vec2(x,1.55),vec2(2.0,.5));
  drawTile(vec2(x,1.72),vec2(1.6,.48),icons.circle,hsl(.08,.18,.86));
  drawRect(vec2(x,1.15),vec2(.12,.8),hsl(.55,.08,.35));
 }
 // Characters
 drawWhitIllustrated(vec2(-7.7,2.55));
 const guestPos=vec2(7.7+guestSlide,2.55);
 drawSoftShadow(guestPos.add(vec2(0,-1.0)),vec2(1.55,.42));
 drawGuest(guestPos,guestStyle,guestPhase=='thanks'?'thanks':guestPhase=='leaving'?'leaving':'idle');
 if(guestPhase=='thanks'||guestPhase=='leaving')
  drawClassicShake(guestPos.add(vec2(.72,-.05+.03*sin(time*5))),true,.55);
 if(guestPhase=='thanks'){
  drawRect(guestPos.add(vec2(-1.35,1.05)),vec2(2.5,.72),WHITE);
  drawText('THANK YOU!',guestPos.add(vec2(-1.35,1.05)),.25,hsl(.07,.55,.22));
 }
 // Illustrated wall art and counter details
 drawSundaePoster(vec2(-4.95,4.15));
 drawConePoster(vec2(4.95,4.15));
 // framed town pictures
 drawRect(vec2(-2.95,4.14),vec2(1.2,.9),hsl(.08,.35,.3));
 drawRect(vec2(-2.95,4.14),vec2(1.0,.7),hsl(.55,.3,.82));
 drawTile(vec2(-2.95,4.14),vec2(.38),icons.star,hsl(.12,.7,.58));
 drawRect(vec2(2.95,4.14),vec2(1.2,.9),hsl(.08,.35,.3));
 drawRect(vec2(2.95,4.14),vec2(1.0,.7),hsl(.12,.3,.88));
 drawTile(vec2(2.95,4.14),vec2(.38),icons.heart,hsl(.98,.7,.62));
 drawToppingRail(vec2(5.15,.95));
 drawNapkinHolder(vec2(-5.35,.9));

 if(happyTimer.active()){
  const bob=.12*sin(time*8);
  drawTile(guestPos.add(vec2(-.55,1.03+bob)),vec2(.42),icons.heart,hsl(.98,.75,.6));
  drawTile(guestPos.add(vec2(.05,1.23-bob)),vec2(.5),icons.star,YELLOW);
  drawTile(guestPos.add(vec2(.55,.95+bob)),vec2(.36),icons.heart,hsl(.96,.7,.62));
  drawText('YUM!',guestPos.add(vec2(0,1.47)),.3,hsl(.07,.6,.22),.04,WHITE);
 }

 // Physical clipped order ticket
 drawOrderTicket();
 if(guestPhase!='active'){
  const title=guestPhase=='thanks'?'THANK YOU!':guestPhase=='leaving'?'SEE YOU NEXT TIME!':`WELCOME, ${guestName.toUpperCase()}!`;
  drawText(title,vec2(0,3.7),.42,hsl(.07,.55,.22));
  if(guestPhase=='arriving')drawText('Walking up to the counter...',vec2(0,3.25),.2,hsl(.05,.35,.25));
 }else{
  drawText(`${guestName.toUpperCase()}'S ORDER`,vec2(0,4.18),.22,hsl(.06,.5,.3));
  drawText(order?order.name:'Waiting...',vec2(0,3.84),.4,BLACK);
  if(order){
   const n=order.need.length,gap=1.62,startX=-(n-1)*gap/2;
   for(let i=0;i<n;i++){
    const name=order.need[i],x=startX+i*gap,pic=ingredientArt(name);
    if(pic)drawTile(vec2(x,3.26),vec2(.84),pic,WHITE);
    else drawTile(vec2(x,3.28),vec2(.55),icons.circle,WHITE);
    drawText(shortName(name),vec2(x,2.73),.16,BLACK);
    if(ingredientDone(name)){
     drawRect(vec2(x,3.28),vec2(1.0,.88),hsl(.34,.22,.94,.42));
     drawTile(vec2(x+.4,3.6),vec2(.42),icons.circle,hsl(.34,.72,.5));
     drawTile(vec2(x+.4,3.6),vec2(.23),icons.plus,WHITE,PI/4);
     drawText('DONE',vec2(x,2.76),.14,hsl(.34,.65,.25));
    }
   }
  }
 }
 // Work area: actual machines, fewer boxes
 drawRect(vec2(0,.55),vec2(13.6,.72),hsl(.08,.38,.34));
 drawLine(vec2(-6.7,.93),vec2(6.7,.93),.09,hsl(.11,.5,.76));

 // Blender
 drawSoftShadow(vec2(-3.8,1.15),vec2(2.3,.75));
 if(order&&order.kind!='BLEND')drawRect(vec2(-3.8,1.5),vec2(2.5,2.1),hsl(0,0,.75,.28));
 if(order&&order.kind=='BLEND')drawProBlender(vec2(-3.8,1.65));
 else{
  drawProBlender(vec2(-3.8,1.65));
  drawRect(vec2(-3.8,1.55),vec2(2.2,2.0),hsl(0,0,.72,.38));
 }
 if(blenderRunning)drawTile(vec2(-3.25,.9),vec2(.45),icons.glow,YELLOW);
 drawText('BLENDER',vec2(-3.8,.55),.3,hsl(.07,.45,.2));

 // Soda fountain / mixer
 drawSoftShadow(vec2(0,1.15),vec2(2.25,.7));
 drawChromeFountain(vec2(0,1.5));
 if(order&&order.kind!='MIX')drawRect(vec2(0,1.48),vec2(2.25,1.8),hsl(0,0,.7,.45));
 drawPrettyBottle(vec2(-.65,.78),hsl(.05,.62,.24),'');
 drawPrettyBottle(vec2(.65,.78),hsl(.97,.72,.6),'');

 drawText('MIX',vec2(0,.55),.3,hsl(.07,.45,.2));

 // Serving ledge with coaster
 drawSoftShadow(vec2(3.8,1.05),vec2(2.5,.72));
 drawRect(vec2(3.8,1.2),vec2(2.35,.68),hsl(.08,.36,.36));
 drawTile(vec2(3.8,1.53),vec2(.8,.22),icons.circle,hsl(.12,.12,.92));
 if(prepared||cupFilled)drawClassicShake(vec2(3.8,1.72),true,.76);
 else drawClassicShake(vec2(3.8,1.72),false,.68);
 drawText('SERVE',vec2(3.8,.55),.3,hsl(.07,.45,.2));

 if(cupFilled&&guestPhase=='active'){
  drawTile(guestPos.add(vec2(0,1.45)),vec2(.7),icons.arrow,YELLOW,PI);
  drawText('BRING CUP HERE',guestPos.add(vec2(0,1.78)),.2,hsl(.07,.52,.2));
 }

 // Ingredient shelf
 drawRect(vec2(0,-1.34),vec2(18.4,.18),hsl(.08,.38,.28));
 drawText('ICE CREAM',vec2(-4.4,-1.02),.28,hsl(.07,.5,.2));
 drawText('MILK • SYRUPS • SODA',vec2(4.5,-1.02),.28,hsl(.07,.5,.2));

 drawFurnitureIngredientCase();
 drawFurniturePrepRack();

 for(const item of PANTRY){
  const ice=isScoopFlavor(item);
  const current=isCurrentIngredient(item.name);
  const done=ingredientDone(item.name);
  const needed=order&&order.need.includes(item.name);

  if(ice){
   drawOpenIceTub(item.pos.add(vec2(0,.08)),item.color,item.name=='Raspberry Ripple');
   if(!needed)drawRect(item.pos.add(vec2(0,.05)),vec2(1.62,1.2),hsl(0,0,1,.3));
   drawText(shortName(item.name),item.pos.add(vec2(0,-.62)),.17,BLACK);
  }else{
   const pic=ingredientArt(item.name);
   drawPrepBottleStand(item.pos,pic,item.name,needed,current);
   if(!needed)drawRect(item.pos.add(vec2(0,.06)),vec2(1.48,1.18),hsl(0,0,1,.28));
  }

  if(current){
   drawTile(item.pos,vec2(1.72),icons.glow,hsl(.13,.85,.72,.34));
  }
  if(done){
   drawTile(item.pos.add(vec2(.62,.48)),vec2(.38),icons.circle,hsl(.34,.7,.52));
   drawTile(item.pos.add(vec2(.62,.48)),vec2(.2),icons.plus,WHITE,PI/4);
  }
 }

 // Tool shelf
 drawToolShelf();

 // Strong single-target focus for young players
 const focusTarget=kidTarget();
 if(focusTarget){
  const bob=.1*sin(time*5),pulse=1.85+.12*sin(time*6);
  drawTile(focusTarget,vec2(pulse),icons.glow,hsl(.13,.85,.72,.32));
  const hideArrow=(holdingScoop&&focusTarget.x<-6)||(holdingCup&&focusTarget.x>6);
  if(!hideArrow)drawTile(focusTarget.add(vec2(0,1.0+bob)),vec2(.72),icons.arrow,YELLOW,PI);
 }

 // Smooth held-object motion
 const desiredHold=mousePos.add(vec2(.3,.32));
 if(!heldVisualReady){heldVisualPos=desiredHold.copy();heldVisualReady=true;}
 heldVisualPos=vec2(lerp(heldVisualPos.x,desiredHold.x,.28),lerp(heldVisualPos.y,desiredHold.y,.28));
 const pickupLift=pickupBounce.active()?.12*sin(percent(pickupBounce.get(),0,.35)*PI):0;

 // Held items
 if(holdingMilk){
  const held=PANTRY.find(x=>x.name==holdingMilk);
  if(held){
   let hp=held.name=='Milk'?art.milk:held.name=='Chocolate Syrup'?art.chocSyrup:
          held.name=='Strawberry Syrup'?art.berrySyrup:art.soda;
   drawTile(heldVisualPos.add(vec2(-.15,pickupLift)),vec2(1.2),hp,WHITE);
  }
 }
 if(holdingScoop){
  const it=PANTRY.find(x=>x.name==scoopFlavor);
  drawScooper(heldVisualPos.add(vec2(-.22,pickupLift)),scoopLoaded,it?it.color:WHITE);
 }
 if(holdingMilk){
  const target=order&&order.kind=='MIX'?vec2(0,1.45):vec2(-3.8,1.45);
  if(isOverlapping(mousePos,vec2(.2),target,vec2(2.8,2.7)))drawPouringEffect(target);
 }
 if(holdingCup){
  if(cupFilled)drawClassicShake(heldVisualPos.add(vec2(.35,pickupLift)),true,.9);
  else drawFancyCup(heldVisualPos.add(vec2(.35,pickupLift)),false);
 }

 if(message&&!messageTimer.elapsed()){
  drawRect(vec2(0,-6.12),vec2(8.6,.72),hsl(.12,.45,.96));
  drawText(message,vec2(0,-6.12),.28,hsl(.07,.5,.2),.035,WHITE);
 }
 if(progressTimer.active()){
  const pp=order&&order.kind=='MIX'?vec2(0,2.75):vec2(-3.8,2.75);
  drawTile(pp,vec2(.85),icons.burst,hsl(.12,.72,.62));
  drawText('POP!',pp.add(vec2(0,.55)),.22,hsl(.07,.55,.2),.035,WHITE);
  drawRect(vec2(0,-5.65),vec2(4.5,.5),hsl(.34,.45,.92));
  drawText(progressText,vec2(0,-5.65),.22,hsl(.34,.65,.25));
 }
}

function gameRenderPost(){
 drawTextScreen(`Score ${score}   •   Served ${served}`,vec2(mainCanvasSize.x/2,22),16,WHITE,2,BLACK);
 drawTextScreen('MAKE IT  →  CUP IT  →  SERVE IT',vec2(mainCanvasSize.x/2,mainCanvasSize.y-14),13,WHITE,2,BLACK);
}
engineInit(gameInit,gameUpdate,gameUpdatePost,gameRender,gameRenderPost);
