// AI can use this class to make sound effects
class SoundGenerator extends Sound
{
    constructor(params = {})
    {
        const {
            volume = 1,        // Volume scale (percent)
            randomness = .05,  // How much to randomize frequency (percent Hz)
            frequency = 220,   // Frequency of sound (Hz)
            attack = 0,        // Attack time, how fast sound starts (seconds)
            release = .1,      // Release time, how fast sound fades out (seconds)
            shapeCurve = 1,    // Squarenes of wave (0=square, 1=normal, 2=pointy)
            slide = 0,         // How much to slide frequency (kHz/s)
            pitchJump = 0,     // Frequency of pitch jump (Hz)
            pitchJumpTime = 0, // Time of pitch jump (seconds)
            repeatTime = 0,    // Resets some parameters periodically (seconds)
            noise = 0,         // How much random noise to add (percent)
            bitCrush = 0,      // Resamples at a lower frequency in (samples*100)
            delay = 0,         // Overlap sound with itself for reverb and flanger effects (seconds)
        } = params;

        super([volume, randomness, frequency, attack, 0, release, 0, shapeCurve, slide, 0, pitchJump, pitchJumpTime, repeatTime, noise, 0, bitCrush, delay, 1, 0, 0, 0]);
    }
}

///////////////////////////////////////////////////////////////////////////////
// SPRITE ATLAS (do not remove) - bakes 16 white shape icons into one texture so
// the AI can draw recolorable sprites with zero external assets. Call
// initDefaultAtlas() once in gameInit to get a name->TileInfo map, then draw any
// icon with drawTile(pos, size, icons.NAME, color). Each icon is pure white, so
// the color argument tints it to any hue. Icon names (tiles 0-15):
//   circle glow ring roundSquare triangle diamond pentagon hexagon
//   spark star burst plus heart droplet bolt arrow

const ATLAS_SIZE = 2048; // texture size in pixels
const DRAW_SIZE = 500;   // fixed logical space every icon is painted in
let TILE_COLS, TILE_PADDING, TILE_STRIDE, TILE_SIZE, TILE_COUNT;
let atlasCanvas, atlasCtx, atlasDirty, flushScheduled;

function initDrawToTexture(cols = 4)
{
    ASSERT(cols === 4 || cols === 8, 'cols must be 4 or 8');

    TILE_COLS    = cols;
    TILE_STRIDE  = ATLAS_SIZE / TILE_COLS;          // 512 or 256
    TILE_PADDING = TILE_COLS === 4 ? 12 : 6;        // transparent moat to stop mip bleed
    TILE_SIZE    = TILE_STRIDE - TILE_PADDING * 2;  // 488 or 244
    TILE_COUNT   = TILE_COLS * TILE_COLS;

    atlasCanvas = document.createElement('canvas');
    atlasCanvas.width = atlasCanvas.height = ATLAS_SIZE;
    atlasCtx = atlasCanvas.getContext('2d');

    textureInfos[0] && textureInfos[0].destroyWebGLTexture();
    textureInfos[0] = new TextureInfo(atlasCanvas);

    setTileDefaultSize(vec2(TILE_SIZE));
    setTileDefaultPadding(TILE_PADDING);
    atlasDirty = flushScheduled = false;
}

function drawToTexture(tileIndex, drawFn)
{
    ASSERT(tileIndex >= 0 && tileIndex < TILE_COUNT, 'tileIndex out of range');

    const cellX = (tileIndex % TILE_COLS) * TILE_STRIDE;
    const cellY = (tileIndex / TILE_COLS | 0) * TILE_STRIDE;
    const drawX = cellX + TILE_PADDING;
    const drawY = cellY + TILE_PADDING;

    atlasCtx.clearRect(cellX, cellY, TILE_STRIDE, TILE_STRIDE);
    atlasCtx.save();
    atlasCtx.translate(drawX, drawY);
    atlasCtx.beginPath();
    atlasCtx.rect(0, 0, TILE_SIZE, TILE_SIZE);
    atlasCtx.clip();
    // paint in a fixed DRAW_SIZE space scaled to fill the tile
    atlasCtx.scale(TILE_SIZE / DRAW_SIZE, TILE_SIZE / DRAW_SIZE);
    drawFn(atlasCtx, tileIndex);
    atlasCtx.restore();

    atlasDirty = true;
    if (!flushScheduled)
    {
        flushScheduled = true;
        queueMicrotask(flushAtlas);
    }
    return new TileInfo(vec2(drawX, drawY), vec2(TILE_SIZE), textureInfos[0], TILE_PADDING);
}

function flushAtlas()
{
    flushScheduled = false;
    if (!atlasDirty) return;
    atlasDirty = false;
    textureInfos[0].createWebGLTexture();
}

// Force every texel RGB to white (keeping alpha) so bilinear/mipmap filtering
// can't darken the white icon edges into a halo. Call after painting white tiles.
function whitenAtlasAlpha()
{
    flushAtlas();
    if (!glContext || !textureInfos[0].glTexture) return; // canvas2D: no GL halo

    const image = atlasCtx.getImageData(0, 0, ATLAS_SIZE, ATLAS_SIZE);
    const d = image.data;
    for (let i = 0; i < d.length; i += 4)
        d[i] = d[i+1] = d[i+2] = 255; // white RGB, leave alpha alone

    glContext.bindTexture(glContext.TEXTURE_2D, textureInfos[0].glTexture);
    glContext.texImage2D(glContext.TEXTURE_2D, 0, glContext.RGBA,
        glContext.RGBA, glContext.UNSIGNED_BYTE, image);
    if (!tilesPixelated && isPowerOfTwo(ATLAS_SIZE))
        glContext.generateMipmap(glContext.TEXTURE_2D);
    glContext.bindTexture(glContext.TEXTURE_2D, glActiveTexture); // restore engine binding
}

// 16 built-in white-on-transparent icons, drawn centred at (x,y) with radius r.
const DEFAULT_ICON_NAMES = [
    'circle', 'glow', 'ring', 'roundSquare',
    'triangle', 'diamond', 'pentagon', 'hexagon',
    'spark', 'star', 'burst', 'plus',
    'heart', 'droplet', 'bolt', 'arrow',
];

const _defaultIconDrawers = (() =>
{
    function poly(ctx, x, y, r, sides, rot = 0)
    {
        ctx.beginPath();
        for (let k = sides; k--;)
        {
            const a = rot + k * (2*PI / sides);
            ctx.lineTo(x + Math.sin(a) * r, y - Math.cos(a) * r);
        }
        ctx.closePath();
    }
    function starPath(ctx, x, y, ro, ri, points, rot = -PI/2)
    {
        ctx.beginPath();
        for (let k = points * 2; k--;)
        {
            const rr = k & 1 ? ri : ro;
            const a = rot + k * (PI / points);
            ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.closePath();
    }
    function roundRectPath(ctx, x, y, w, h, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    function circle(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function droplet(ctx, x, y, r)
    {
        const by = y + .3 * r, br = .6 * r;
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.bezierCurveTo(x + .3 * r, y - .5 * r, x + br, y - .1 * r, x + br, by);
        ctx.arc(x, by, br, 0, PI);
        ctx.bezierCurveTo(x - br, y - .1 * r, x - .3 * r, y - .5 * r, x, y - r);
        ctx.closePath();
        ctx.fill();
    }
    function roundSquare(ctx, x, y, r)
    {
        roundRectPath(ctx, x - r, y - r, r*2, r*2, r*.4);
        ctx.fill();
    }
    function triangle(ctx, x, y, r) { poly(ctx, x, y, r, 3);        ctx.fill(); }
    function diamond(ctx, x, y, r)  { poly(ctx, x, y, r, 4);        ctx.fill(); }
    function pentagon(ctx, x, y, r) { poly(ctx, x, y, r, 5);        ctx.fill(); }
    function hexagon(ctx, x, y, r)  { poly(ctx, x, y, r, 6, PI/2);  ctx.fill(); }
    function ring(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.arc(x, y, r*.7, 9, 0, true);
        ctx.fill();
    }
    function glow(ctx, x, y, r)
    {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function burst(ctx, x, y, r) { starPath(ctx, x, y, r, r*.7, 10); ctx.fill(); }
    function spark(ctx, x, y, r) { starPath(ctx, x, y, r, r/4, 4);   ctx.fill(); }
    function star(ctx, x, y, r)  { starPath(ctx, x, y, r, r*.4, 5);  ctx.fill(); }
    function heart(ctx, x, y, r)
    {
        const width = 1, topCtrl = .92, dip = .40, shoulder = .46, tip = .9;
        const p = (nx, ny) => [x + nx * r, y + ny * r];
        ctx.beginPath();
        ctx.moveTo(...p(0, -dip));
        ctx.bezierCurveTo(...p(0, -topCtrl), ...p(-width, -topCtrl), ...p(-width, -shoulder));
        ctx.bezierCurveTo(...p(-width, 0), ...p(0, tip * .9), ...p(0, tip));
        ctx.bezierCurveTo(...p(0, tip * .9), ...p(width, 0), ...p(width, -shoulder));
        ctx.bezierCurveTo(...p(width, -topCtrl), ...p(0, -topCtrl), ...p(0, -dip));
        ctx.closePath();
        ctx.fill();
    }
    function plus(ctx, x, y, r)
    {
        const a = r * .3, b = r;
        ctx.beginPath();
        ctx.moveTo(x - a, y - b); ctx.lineTo(x + a, y - b); ctx.lineTo(x + a, y - a);
        ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y + a); ctx.lineTo(x + a, y + a);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y + a);
        ctx.lineTo(x - b, y + a); ctx.lineTo(x - b, y - a); ctx.lineTo(x - a, y - a);
        ctx.closePath();
        ctx.fill();
    }
    function arrow(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + .8 * r, y - .1 * r); ctx.lineTo(x + .3 * r, y - .1 * r);
        ctx.lineTo(x + .3 * r, y + r);      ctx.lineTo(x - .3 * r, y + r);
        ctx.lineTo(x - .3 * r, y - .1 * r); ctx.lineTo(x - .8 * r, y - .1 * r);
        ctx.closePath();
        ctx.fill();
    }
    function bolt(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + .25 * r, y - r);   ctx.lineTo(x - .5 * r, y + .15 * r);
        ctx.lineTo(x - .1 * r, y + .15 * r); ctx.lineTo(x - .25 * r, y + r);
        ctx.lineTo(x + .5 * r, y - .2 * r);  ctx.lineTo(x + .1 * r, y - .2 * r);
        ctx.closePath();
        ctx.fill();
    }
    return {
        circle, glow, ring, roundSquare, triangle, diamond, pentagon, hexagon,
        spark, star, burst, plus, heart, droplet, bolt, arrow,
    };
})();

// Paint one named white icon into a tile and return its TileInfo. scale tweaks
// icon size within the tile (1 = default).
function drawDefaultIcon(name, tileIndex, scale = 1)
{
    const fn = _defaultIconDrawers[name];
    ASSERT(fn, 'unknown default icon: ' + name);
    return drawToTexture(tileIndex, ctx =>
    {
        const c = DRAW_SIZE / 2, r = c * scale;
        ctx.fillStyle = ctx.strokeStyle = '#fff';
        ctx.lineJoin = ctx.lineCap = 'round';
        fn(ctx, c, c, r);
    });
}

// Build the 16 default icons into tiles 0-15 and return a name->TileInfo map.
function initDefaultAtlas(scale = 1)
{
    if (!atlasCtx) initDrawToTexture(4);
    const icons = {};
    for (let i = 0; i < DEFAULT_ICON_NAMES.length; ++i)
        icons[DEFAULT_ICON_NAMES[i]] = drawDefaultIcon(DEFAULT_ICON_NAMES[i], i, scale);
    whitenAtlasAlpha(); // white RGB everywhere -> no dark halo
    return icons;
}

function tcLoadProfiles()
{
    try
    {
        const raw = localStorage.getItem(tcProfileStorageKey);
        tcProfiles = raw ? JSON.parse(raw) : {};
    }
    catch (e)
    {
        tcProfiles = {};
    }

    tcProfileNames = Object.keys(tcProfiles);
    tcProfileIndex = clamp(tcProfileIndex, 0, max(0, tcProfileNames.length-1));
}

function tcSaveProfiles()
{
    try
    {
        localStorage.setItem(tcProfileStorageKey, JSON.stringify(tcProfiles));
    }
    catch (e)
    {
        // Local storage may be disabled; the game can still run for this session.
    }
}

function tcProfileSnapshot()
{
    return {
        level: tcLevel,
        unlockedHorseNames: [...tcUnlockedHorseNames],
        barnUnlocked: tcBarnUnlocked,
        selectedHorse: tcSelectedHorse,
        selectedOpponent: tcSelectedOpponent,
        foal: tcFoal ? {
            name: tcFoal.name,
            grownName: tcFoal.grownName,
            growth: tcFoal.growth,
            care: tcFoal.care,
            color: tcFoal.color,
            mane: tcFoal.mane,
            grown: tcFoal.grown,
        } : 0,
    };
}

function tcSaveActiveProfile()
{
    if (!tcActiveProfile) return;
    tcProfiles[tcActiveProfile] = tcProfileSnapshot();
    tcSaveProfiles();
    tcLoadProfiles();
}

function tcRestoreProfile(name)
{
    const data = tcProfiles[name];
    if (!data) return;

    tcActiveProfile = name;
    tcLevel = data.level || 1;
    tcUnlockedHorseNames = Array.isArray(data.unlockedHorseNames)
        ? [...data.unlockedHorseNames]
        : ['Chestnut'];

    tcBarnUnlocked = !!data.barnUnlocked;
    tcSelectedHorse = clamp(data.selectedHorse || 0, 0, tcHorseChoices.length-1);
    tcSelectedOpponent = clamp(data.selectedOpponent || 0, 0, tcHorseChoices.length-1);

    tcFoal = data.foal ? {
        name: data.foal.name,
        grownName: data.foal.grownName,
        growth: data.foal.growth || 0,
        care: data.foal.care || 0,
        color: data.foal.color,
        mane: data.foal.mane,
        grown: !!data.foal.grown,
    } : 0;

    // Re-add a grown foal to the playable roster after reload.
    if (tcFoal && tcFoal.grown &&
        !tcHorseChoices.some(h => h.name == tcFoal.grownName))
    {
        tcHorseChoices.push({
            name: tcFoal.grownName,
            color: tcFoal.color,
            mane: tcFoal.mane,
            raised:true,
        });
    }

    if (tcFoal && tcFoal.grown &&
        !tcUnlockedHorseNames.includes(tcFoal.grownName))
        tcUnlockedHorseNames.push(tcFoal.grownName);

    tcRefreshHorseUnlocks();
    tcProfileMode = false;
    tcResetLevel(false);
}

function tcCreateProfile(name)
{
    if (Object.keys(tcProfiles).length >= tcMaxProfiles)
    {
        tcProfileMessage = `You can have up to ${tcMaxProfiles} accounts.`;
        return;
    }

    const clean = name.trim().slice(0,16);
    if (!clean)
    {
        tcProfileMessage = 'Enter a profile name first.';
        return;
    }

    if (tcProfiles[clean])
    {
        tcProfileMessage = 'That profile already exists.';
        return;
    }

    // New profiles always begin from the true starting state.
    tcProfiles[clean] = {
        level:1,
        unlockedHorseNames:['Chestnut'],
        barnUnlocked:false,
        selectedHorse:0,
        selectedOpponent:0,
        foal:0,
    };

    tcSaveProfiles();
    tcLoadProfiles();
    tcRestoreProfile(clean);
}


function tcRenameProfile(oldName, newName)
{
    const clean = newName.trim().slice(0,16);

    if (!oldName || !tcProfiles[oldName])
    {
        tcProfileMessage = 'That account no longer exists.';
        return;
    }

    if (!clean)
    {
        tcProfileMessage = 'Enter a new account name.';
        return;
    }

    if (clean != oldName && tcProfiles[clean])
    {
        tcProfileMessage = 'That account name is already in use.';
        return;
    }

    if (clean != oldName)
    {
        tcProfiles[clean] = tcProfiles[oldName];
        delete tcProfiles[oldName];

        if (tcActiveProfile == oldName)
            tcActiveProfile = clean;
    }

    tcSaveProfiles();
    tcLoadProfiles();

    const index = tcProfileNames.indexOf(clean);
    if (index >= 0)
        tcProfileIndex = index;

    tcProfileMessage = `Account renamed to ${clean}.`;
}

function tcDeleteSelectedProfile()
{
    if (!tcProfileNames.length) return;
    const name = tcProfileNames[tcProfileIndex];
    delete tcProfiles[name];
    tcSaveProfiles();
    tcLoadProfiles();
    tcProfileMessage = `Deleted ${name}.`;
}

function tcReturnToProfiles()
{
    tcSaveActiveProfile();
    tcProfileMode = true;
    tcActiveProfile = '';
    tcStarted = false;
    tcFinished = false;
    tcInBarn = false;
    tcChoosingHorse = false;
    tcChoosingOpponent = false;
    tcLoadProfiles();
}

function tcCreateNewAccountFromGame()
{
    tcSaveActiveProfile();
    tcProfileMode = true;
    tcActiveProfile = '';
    tcStarted = false;
    tcFinished = false;
    tcInBarn = false;
    tcChoosingHorse = false;
    tcChoosingOpponent = false;
    tcLoadProfiles();

    tcCreatingProfile = true;
    tcEditingProfile = false;
    tcEditingOriginalName = '';
    tcNewProfileName = '';
    tcProfileMessage = 'Type a new account name, then press Enter.';
}


function tcIsHorseUnlocked(horse)
{
    return tcUnlockedHorseNames.includes(horse.name);
}

function tcRefreshHorseUnlocks()
{
    // Only restore horses that should already have been earned.
    // Race rewards are actually granted by tcAwardMilestoneHorse().
    for (const horse of tcHorseChoices)
    {
        if (horse.starter && !tcUnlockedHorseNames.includes(horse.name))
            tcUnlockedHorseNames.push(horse.name);
    }
}

function tcAwardMilestoneHorse(completedLevel)
{
    if (completedLevel % 5)
        return '';

    const horse = tcHorseChoices.find(h => h.rewardLevel == completedLevel);
    if (!horse || tcUnlockedHorseNames.includes(horse.name))
        return '';

    tcUnlockedHorseNames.push(horse.name);
    tcSaveActiveProfile();
    return horse.name;
}


function tcContrastingHorseColor(playerColor, seed=0)
{
    // Use a few strong, clearly different fallback coat colors.
    const fallbackColors = [
        hsl(.11,.58,.58), // palomino
        hsl(.62,.22,.20), // dark blue-black
        hsl(0,0,.86),     // white/gray
        hsl(.045,.66,.43),// copper
        hsl(.60,.10,.42), // gray
        hsl(.02,.50,.24), // dark bay
    ];

    return fallbackColors[seed % fallbackColors.length];
}

function tcHorseColorIsTooSimilar(a, b)
{
    // Colors are objects; comparing object identity is not reliable.
    // Compare RGB channels so the player and rival coats visibly differ.
    return abs(a.r-b.r) < .12 &&
           abs(a.g-b.g) < .12 &&
           abs(a.b-b.b) < .12;
}

function tcUnlockedHorseIndices()
{
    const indices = [];
    for (let i=0; i<tcHorseChoices.length; ++i)
        if (tcIsHorseUnlocked(tcHorseChoices[i]))
            indices.push(i);
    return indices;
}

function tcMoveHorseSelection(currentIndex, direction, avoidIndex=-1)
{
    const unlocked = tcUnlockedHorseIndices().filter(i => i != avoidIndex);
    if (!unlocked.length) return currentIndex;

    let pos = unlocked.indexOf(currentIndex);
    if (pos < 0) pos = 0;
    pos = mod(pos + direction, unlocked.length);
    return unlocked[pos];
}

function tcEnterBarn()
{
    if (!tcBarnUnlocked) return;
    tcInBarn = true;
    tcStarted = false;
    tcFinished = false;
    tcChoosingHorse = false;
    tcBarnFed = false;
    tcBarnWatered = false;
    tcBarnScooped = false;
    tcBarnVisitComplete = false;
    tcBarnMessage = 'Barn chores: feed, water, and muck the stall.';
    tcBarnMessageTimer = new Timer(2.5);
}

function tcLeaveBarn()
{
    tcInBarn = false;
    tcResetLevel(false);
}

function tcDoBarnChore(type)
{
    if (!tcInBarn) return;

    if (type == 'feed' && !tcBarnFed)
    {
        tcBarnFed = true;
        tcBarnMessage = 'You filled the hay manger.';
    }
    else if (type == 'water' && !tcBarnWatered)
    {
        tcBarnWatered = true;
        tcBarnMessage = 'You filled the water trough.';
    }
    else if (type == 'scoop' && !tcBarnScooped)
    {
        tcBarnScooped = true;
        tcBarnMessage = 'You mucked out the stall.';
    }

    tcBarnMessageTimer.set(1.6);

    if (tcBarnFed && tcBarnWatered && tcBarnScooped && !tcBarnVisitComplete)
    {
        tcBarnVisitComplete = true;

        // A surprise foal can appear after a completed barn-care visit.
        if (!tcFoal && randBool(.28))
        {
            const coat = randInt(4);
            const colors = [
                hsl(.08,.52,.44), hsl(.11,.46,.66),
                hsl(.61,.18,.34), hsl(.02,.24,.78)
            ];
            const manes = [
                hsl(.06,.42,.16), hsl(.10,.34,.28),
                hsl(.61,.16,.12), hsl(.02,.18,.34)
            ];

            tcFoal = {
                name:'Timothy Foal',
                grownName:'Willow',
                growth:0,
                care:0,
                color:colors[coat],
                mane:manes[coat],
                grown:false,
            };
            tcBarnMessage = 'Surprise! A foal was born in the barn!';
        }
        else if (tcFoal && !tcFoal.grown)
        {
            tcFoal.growth = min(100, tcFoal.growth + 18);
            tcFoal.care++;
            tcBarnMessage = `The foal is growing! ${tcFoal.growth}% grown.`;
            tcCheckFoalGrown();
        }
        else
            tcBarnMessage = 'Barn chores complete. Everything is clean and cared for.';

        tcBarnMessageTimer.set(3);
        tcSaveActiveProfile();
    }
}

function tcNurtureFoal()
{
    if (!tcInBarn || !tcFoal || tcFoal.grown) return;

    tcFoal.growth = min(100, tcFoal.growth + 10);
    tcFoal.care++;
    tcBarnMessage = `You groomed and nurtured the foal. ${tcFoal.growth}% grown.`;
    tcBarnMessageTimer.set(2);
    tcCheckFoalGrown();
    tcSaveActiveProfile();
}

function tcCheckFoalGrown()
{
    if (!tcFoal || tcFoal.grown || tcFoal.growth < 100) return;

    tcFoal.grown = true;
    tcFoal.name = tcFoal.grownName;

    tcHorseChoices.push({
        name:tcFoal.grownName,
        color:tcFoal.color,
        mane:tcFoal.mane,
        raised:true,
    });

    if (!tcUnlockedHorseNames.includes(tcFoal.grownName))
        tcUnlockedHorseNames.push(tcFoal.grownName);

    tcBarnMessage = `${tcFoal.grownName} is fully grown and unlocked for racing!`;
    tcSaveActiveProfile();
    tcBarnMessageTimer.set(4);
}

function tcDrawBarnHorse(pos, color, scale=1)
{
    const dark = hsl(.07,.48,.17);
    drawTile(pos.add(vec2(0,.25*scale)), vec2(2.7*scale,1.2*scale), icons.circle, color);
    drawRect(pos.add(vec2(.9*scale,.7*scale)), vec2(.48*scale,1.0*scale), color, -.3);
    drawTile(pos.add(vec2(1.35*scale,1.0*scale)), vec2(1.0*scale,.65*scale), icons.circle, color);
    drawLine(pos.add(vec2(-.7*scale,-.1*scale)), pos.add(vec2(-.75*scale,-1.0*scale)), .16*scale, dark);
    drawLine(pos.add(vec2(.65*scale,-.1*scale)), pos.add(vec2(.7*scale,-1.0*scale)), .16*scale, dark);
}

class TCHorse extends EngineObject
{
    constructor(pos, bodyColor, isPlayer, rivalIndex=0)
    {
        super(pos, vec2(3,1.7));
        this.bodyColor = bodyColor;
        this.isPlayer = isPlayer;
        this.rivalIndex = rivalIndex;
        this.renderOrder = 100 - pos.y * 12;
        this.gravityScale = 0;
        this.distance = 0;
        this.speed = .07;
        this.jumpVelocity = 0;
        this.onGround = true;
        this.finished = false;
        this.targetY = pos.y;
        this.slowTimer = new Timer();
        this.maneColor = isPlayer ? tcHorseChoices[tcSelectedHorse].mane : hsl(.06,.45,.12);
    }

    tryJump()
    {
        if (!this.onGround || this.finished || tcFinished) return;
        this.jumpVelocity = .42;
        this.onGround = false;
        if (this.isPlayer)
            if (randBool(.35)) tcNeighSound.play(this.pos, .22);
    }

    update()
    {
        // Depth-sort horses every frame.
        // Horses lower on the road are closer to the viewer and draw on top.
        this.renderOrder = 100 - this.pos.y * 12;

        if (!tcStarted || tcFinished || this.finished)
            return;

        const level = tcLevels[tcLevel-1];

        if (this.isPlayer)
        {
            // Move freely around the track.
            const move = keyDirection();
            this.targetY = clamp(this.targetY + move.y*.12, tcHorseMinY, tcHorseMaxY);
            this.pos.y = lerp(this.pos.y, this.targetY, .18);

            // Gallop input.
            if (keyWasPressed('Space') || mouseWasPressed(0) || gamepadWasPressed(0))
            {
                tcPlayerSpeed = min(level.speedMax, tcPlayerSpeed + .023);
                if (randBool(.16)) tcNickerSound.play(this.pos, .18);
            }

            // Player jump is manual only. Obstacles never trigger tryJump().
            if (keyWasPressed('ArrowUp') || keyWasPressed('KeyW') ||
                keyWasPressed('ShiftLeft') || keyWasPressed('KeyJ') ||
                gamepadWasPressed(1))
                this.tryJump();

            if (!this.onGround)
            {
                this.jumpVelocity -= .016;
                this.pos.y += this.jumpVelocity;

                // Ground relative to current lane position.
                if (this.jumpVelocity < 0 && this.pos.y <= this.targetY)
                {
                    this.pos.y = this.targetY;
                    this.jumpVelocity = 0;
                    this.onGround = true;
                }
            }

            if (this.slowTimer.active())
            {
                // Temporary stumble/slowdown after hitting an obstacle.
                tcPlayerSpeed = min(tcPlayerSpeed, .075);
                tcPlayerSpeed = max(.035, tcPlayerSpeed * .997);
            }
            else
            {
                // Recover toward normal running pace once the slowdown ends.
                tcPlayerSpeed = max(.05, tcPlayerSpeed * .994);
            }

            this.distance += tcPlayerSpeed;
            tcPlayerDistance = this.distance;
            this.pos.x = -5.2;
        }
        else
        {
            // Rivals get faster and more assertive each level.
            this.speed = clamp(this.speed + rand(-.0025,.0025), level.rivalMin, level.rivalMax);
            this.distance += this.speed;

            // Shift lanes occasionally so rivals don't sit in one place.
            if (randBool(.006 + tcLevel*.0012))
            {
                let bestY = this.targetY;
                let bestSpace = -1;

                for (let attempt=0; attempt<8; ++attempt)
                {
                    const candidate = rand(tcHorseMinY, tcHorseMaxY);
                    let nearest = 99;

                    for (const other of [tcPlayer, ...tcRivals])
                    {
                        if (!other || other === this) continue;
                        nearest = min(nearest, abs(other.targetY - candidate));
                    }

                    if (nearest > bestSpace)
                    {
                        bestSpace = nearest;
                        bestY = candidate;
                    }
                }

                this.targetY = bestY;
            }

            this.pos.y = lerp(this.pos.y, this.targetY, .07);

            // Jump when an obstacle is directly ahead and in the same lane.
            for (const obstacle of tcObstacles)
            {
                const ahead = obstacle.pos.x - this.pos.x;
                const sameLane = abs(obstacle.pos.y - this.targetY) < 1.15;
                if (ahead > .8 && ahead < 3.4 && sameLane && this.onGround)
                {
                    // Better jump timing on later levels.
                    const chance = .78 + tcLevel*.025;
                    if (randBool(min(.96,chance)))
                        this.tryJump();
                }
            }

            if (!this.onGround)
            {
                this.jumpVelocity -= .016;
                this.pos.y += this.jumpVelocity;
                if (this.jumpVelocity < 0 && this.pos.y <= this.targetY)
                {
                    this.pos.y = this.targetY;
                    this.jumpVelocity = 0;
                    this.onGround = true;
                }
            }

            // Position rival based on distance difference from player.
            this.pos.x = -5.0 + clamp((this.distance - tcPlayerDistance)*.26, -2.6, 4.2);
        }

        if (this.distance >= level.distance && !this.finished)
        {
            this.finished = true;
            this.jumpVelocity = 0;
            this.onGround = true;
            this.pos.y = this.targetY;

            if (this.isPlayer)
            {
                tcPlayerCrossed = true;
                tcFinishDelay.set(1);
                tcNeighSound.play(tcPlayer.pos, .34);
            }
            else if (!tcPlayerCrossed)
            {
                tcFinishDelay.set(1);
            }
        }
    }

    render()
    {
        if (tcInBarn) return;

        const dark = hsl(.07,.55,.18);
        const mane = this.maneColor;
        const runSpeed = this.isPlayer ? tcPlayerSpeed : this.speed;
        const legSwing = (this.finished || tcFinished) ? 0 : sin(time*(10+runSpeed*95))* .44;

        drawTile(this.pos.add(vec2(0,.35)), vec2(2.7,1.25), icons.circle, this.bodyColor);
        drawRect(this.pos.add(vec2(1.0,.88)), vec2(.52,1.15), this.bodyColor, -.32);
        drawTile(this.pos.add(vec2(1.5,1.2)), vec2(1.15,.72), icons.circle, this.bodyColor);
        drawTile(this.pos.add(vec2(1.9,1.09)), vec2(.65,.42), icons.circle, hsl(.09,.45,.62));
        drawLine(this.pos.add(vec2(.75,1.35)), this.pos.add(vec2(1.15,1.6)), .16, mane);
        drawTile(this.pos.add(vec2(1.38,1.62)), vec2(.25,.38), icons.triangle, dark, .15);
        drawTile(this.pos.add(vec2(1.73,1.36)), vec2(.12), icons.circle, BLACK);
        drawLine(this.pos.add(vec2(-1.1,.55)), this.pos.add(vec2(-1.9,.35)), .18, mane);

        const drawLeg = (x, swing) =>
        {
            const hip = this.pos.add(vec2(x,-.1));
            const hoof = hip.add(vec2(swing,-1.12));
            drawLine(hip, hoof, .2, dark);
            drawRect(hoof.add(vec2(.08,-.02)), vec2(.35,.12), BLACK);
        };

        drawLeg(-.75, legSwing);
        drawLeg(.65, -legSwing);

        // More realistic tack on the player's horse.
        if (this.isPlayer)
        {
            const leather = hsl(.07,.50,.14);
            const leatherDark = hsl(.07,.42,.10);
            const metal = hsl(0,0,.72);

            // Bridle crown piece and cheek strap.
            drawLine(
                this.pos.add(vec2(1.37,1.53)),
                this.pos.add(vec2(1.62,1.33)),
                .055,
                leatherDark
            );
            drawLine(
                this.pos.add(vec2(1.60,1.34)),
                this.pos.add(vec2(1.77,1.15)),
                .05,
                leather
            );

            // Noseband wrapping around the muzzle.
            drawLine(
                this.pos.add(vec2(1.57,1.25)),
                this.pos.add(vec2(1.93,1.15)),
                .055,
                leatherDark
            );
            drawLine(
                this.pos.add(vec2(1.73,1.22)),
                this.pos.add(vec2(1.76,1.06)),
                .045,
                leatherDark
            );

            // Bit ring.
            drawTile(
                this.pos.add(vec2(1.74,1.10)),
                vec2(.16),
                icons.ring,
                metal
            );

            // Reins with a natural sag instead of rigid straight lines.
            const reinBounce = (this.finished || tcFinished)
                ? 0
                : sin(time*(8+runSpeed*70))*.035;

            const handTop = this.pos.add(vec2(.18,1.02+reinBounce));
            const handBottom = this.pos.add(vec2(.12,.94+reinBounce));
            const bitTop = this.pos.add(vec2(1.70,1.14));
            const bitBottom = this.pos.add(vec2(1.72,1.07));

            const topMid1 = this.pos.add(vec2(.62,.93-reinBounce*.4));
            const topMid2 = this.pos.add(vec2(1.18,.98-reinBounce*.2));
            const botMid1 = this.pos.add(vec2(.58,.82-reinBounce*.3));
            const botMid2 = this.pos.add(vec2(1.14,.88-reinBounce*.15));

            drawLine(handTop, topMid1, .045, leather);
            drawLine(topMid1, topMid2, .045, leather);
            drawLine(topMid2, bitTop, .045, leather);

            drawLine(handBottom, botMid1, .04, leatherDark);
            drawLine(botMid1, botMid2, .04, leatherDark);
            drawLine(botMid2, bitBottom, .04, leatherDark);
        }
    }
}

class TCObstacle extends EngineObject
{
    constructor(kind, laneY)
    {
        super(vec2(13,laneY), vec2(1.5,1.2));
        this.kind = kind;
        this.renderOrder = 2;
        this.gravityScale = 0;
        this.hitPlayer = false;

        if (kind == 0) this.size = vec2(2.0,.85);
        if (kind == 1) this.size = vec2(1.6,1.25);
        if (kind == 2) this.size = vec2(1.8,1.55);
        if (kind == 3) this.size = vec2(1.7,1.3);
        if (kind == 4) this.size = vec2(2.2,1.05);
        if (kind == 5) this.size = vec2(2.6,.5);
        if (kind == 6) this.size = vec2(3.0,1.05); // fallen tree
        if (kind == 7) this.size = vec2(2.4,1.75); // double rail

        tcObstacles.push(this);
    }

    update()
    {
        if (!tcStarted || tcFinished || tcPlayerCrossed)
        {
            if (tcPlayerCrossed || tcFinished)
            {
                this.destroy();
                tcObstacles = tcObstacles.filter(o=>o !== this);
            }
            return;
        }

        const level = tcLevels[tcLevel-1];
        this.pos.x -= .17 + tcPlayerSpeed*.85 + tcLevel*.006;

        if (this.pos.x < -12)
        {
            this.destroy();
            tcObstacles = tcObstacles.filter(o=>o !== this);
            return;
        }

        // Player collision.
        if (!this.hitPlayer)
        {
            const horseHitPos = tcPlayer.pos.add(vec2(.1,.15));
            const horseHitSize = vec2(1.85,1.30);
            const hitSize = vec2(this.size.x*.75, this.size.y*.78);

            if (isOverlapping(horseHitPos, horseHitSize, this.pos, hitSize))
            {
                this.hitPlayer = true;

                // Hitting an obstacle slows the horse for about one second,
                // then normal running speed resumes automatically.
                tcPlayer.slowTimer.set(1.0);
                tcPlayerSpeed = max(.035, tcPlayerSpeed * .5);

                tcRaceMessage = 'Hit! Slowed for a second — keep running!';
                tcMessageTimer.set(1.1);
                tcNeighSound.play(this.pos, .24);
            }
        }

        // Rival collisions if they fail to jump.
        for (const rival of tcRivals)
        {
            if (rival.finished) continue;
            const hitSize = vec2(this.size.x*.7, this.size.y*.75);
            if (isOverlapping(rival.pos, vec2(1.8,1.4), this.pos, hitSize) && rival.onGround)
            {
                rival.speed *= .65;
                rival.distance = max(0, rival.distance - 1.4);
            }
        }
    }

    render()
    {
        if (tcInBarn) return;

        if (this.kind == 0)
        {
            drawRect(this.pos, this.size, hsl(.07,.55,.30), .05);
            drawTile(this.pos.add(vec2(-.8,0)), vec2(.75), icons.circle, hsl(.08,.42,.48));
            drawTile(this.pos.add(vec2(.8,0)), vec2(.75), icons.circle, hsl(.08,.42,.48));
        }
        else if (this.kind == 1)
        {
            drawRect(this.pos, this.size, hsl(.13,.72,.62), .06);
            drawLine(this.pos.add(vec2(-.55,0)), this.pos.add(vec2(.55,0)), .08, hsl(.09,.55,.35));
        }
        else if (this.kind == 2)
        {
            const wood = hsl(.08,.52,.36);
            drawRect(this.pos.add(vec2(-.6,0)), vec2(.18,this.size.y), wood);
            drawRect(this.pos.add(vec2(.6,0)), vec2(.18,this.size.y), wood);
            drawRect(this.pos.add(vec2(0,.35)), vec2(1.55,.16), hsl(.09,.5,.5), .04);
            drawRect(this.pos.add(vec2(0,-.25)), vec2(1.55,.16), hsl(.09,.5,.5), -.04);
        }
        else if (this.kind == 3)
        {
            const barrel = hsl(.07,.58,.36);
            for (let i=-1;i<=1;++i)
                drawTile(this.pos.add(vec2(i*.55,0)), vec2(.72,1.05), icons.roundSquare, barrel);
        }
        else if (this.kind == 4)
            drawRect(this.pos, this.size, hsl(.08,.12,.55));
        else if (this.kind == 5)
        {
            drawRect(this.pos, vec2(this.size.x,.28), hsl(.55,.72,.52));
            drawTile(this.pos, vec2(1.5,.55), icons.glow, hsl(.55,.6,.8,.3), 0, false, new Color(1,1,1,0));
        }
        else if (this.kind == 6)
        {
            // Fallen tree with branch stubs.
            drawRect(this.pos, this.size, hsl(.07,.52,.28), .05);
            drawLine(this.pos.add(vec2(-.7,.2)), this.pos.add(vec2(-1.15,.75)), .18, hsl(.07,.48,.24));
            drawLine(this.pos.add(vec2(.45,.2)), this.pos.add(vec2(.95,.72)), .18, hsl(.07,.48,.24));
            drawTile(this.pos.add(vec2(-1.35,0)), vec2(.9), icons.circle, hsl(.08,.36,.44));
            drawTile(this.pos.add(vec2(1.35,0)), vec2(.9), icons.circle, hsl(.08,.36,.44));
        }
        else
        {
            // Tall double rail fence.
            const wood = hsl(.08,.48,.38);
            drawRect(this.pos.add(vec2(-.85,0)), vec2(.18,this.size.y), wood);
            drawRect(this.pos.add(vec2(.85,0)), vec2(.18,this.size.y), wood);
            drawRect(this.pos.add(vec2(0,.48)), vec2(2.0,.18), hsl(.09,.46,.52), .025);
            drawRect(this.pos.add(vec2(0,-.15)), vec2(2.0,.18), hsl(.09,.46,.52), -.025);
        }
    }
}

function tcSpawnObstacle()
{
    const level = tcLevels[tcLevel-1];
    if (tcPlayerCrossed || tcPlayerDistance >= level.distance - 16) return;

    // Difficulty rises in pattern complexity as levels increase.
    let count = 1;

    if (tcLevel >= 3 && randBool(.48))
        count = 2;

    if (tcLevel >= 6 && randBool(.34))
        count = 3;

    if (tcLevel >= 9 && randBool(.22))
        count = 4;

    const used = [];

    for (let i=0; i<count; ++i)
    {
        let roadY = rand(tcHorseMinY, tcHorseMaxY);
        let guard = 0;

        // Keep just enough space for a skilled pass, but not too much.
        const minGap = tcLevel >= 8 ? .95 : 1.15;

        while (used.some(y => abs(y-roadY) < minGap) && guard++ < 30)
            roadY = rand(tcHorseMinY, tcHorseMaxY);

        used.push(roadY);

        // Later levels use the tougher obstacle types more often.
        let kind;
        if (tcLevel >= 8 && randBool(.42))
            kind = randBool(.5) ? 6 : 7;
        else if (tcLevel >= 5 && randBool(.25))
            kind = randInt(8);
        else
            kind = randInt(6);

        new TCObstacle(kind, roadY);
    }

    // Surprise staggered follow-up obstacle on harder levels.
    if (tcLevel >= 7 && randBool(.28))
    {
        const offsetY = rand(tcHorseMinY, tcHorseMaxY);
        const delayed = new TCObstacle(randBool(.5) ? 6 : 2, offsetY);
        delayed.pos.x += rand(2.2,3.6);
    }

    tcObstacleTimer.set(rand(level.obstacleMin, level.obstacleMax));
}

function tcResetLevel(resetLevel=false)
{
    tcObstacles.forEach(o=>o.destroy());
    tcObstacles = [];
    tcRivals.forEach(o=>o.destroy());
    tcRivals = [];

    if (tcPlayer && !tcPlayer.destroyed) tcPlayer.destroy();
    if (resetLevel) tcLevel = 1;

    tcRefreshHorseUnlocks();

    tcStarted = false;
    tcFinished = false;
    tcChoosingHorse = true;
    tcChoosingOpponent = false;
    tcWinner = '';
    tcRaceMessage = '';
    tcPlayerCrossed = false;
    tcRaceLeader = '';
    tcPlayerDistance = 0;
    tcPlayerSpeed = .05;

    tcObstacleTimer = new Timer(3);
    tcMessageTimer = new Timer();
    tcFinishDelay = new Timer();

    tcPlayer = new TCHorse(vec2(-5.2,0), tcHorseChoices[tcSelectedHorse].color, true);
    tcPlayer.targetY = 0;

    const level = tcLevels[tcLevel-1];
    const unlocked = tcUnlockedHorseIndices();

    for (let i=0; i<level.rivals; ++i)
    {
        const y = lerp(tcHorseMinY, tcHorseMaxY, (i+1)/(level.rivals+1));

        let horseIndex;
        if (i == 0)
            horseIndex = tcSelectedOpponent;
        else
        {
            const pool = unlocked.filter(index => index != tcSelectedHorse);
            horseIndex = pool.length ? pool[i % pool.length] : tcSelectedOpponent;
        }

        const horseDef = tcHorseChoices[horseIndex];
        const playerColor = tcHorseChoices[tcSelectedHorse].color;
        const rivalColor = tcHorseColorIsTooSimilar(horseDef.color, playerColor)
            ? tcContrastingHorseColor(playerColor, i+tcLevel)
            : horseDef.color;

        const rival = new TCHorse(vec2(-5.0-i*.35,y), rivalColor, false, i);
        rival.maneColor = horseDef.mane;
        rival.displayName = horseDef.name;
        rival.targetY = y;
        rival.speed = rand(level.rivalMin, level.rivalMax);
        tcRivals.push(rival);
    }
}

function tcStartRace()
{
    tcChoosingHorse = false;
    tcChoosingOpponent = false;
    tcStarted = true;
}

function tcEndLevel()
{
    if (tcFinished) return;

    tcFinished = true;

    tcPlayer.jumpVelocity = 0;
    tcPlayer.onGround = true;
    tcPlayer.pos.y = clamp(tcPlayer.targetY, tcHorseMinY, tcHorseMaxY);
    tcPlayerSpeed = 0;

    for (const rival of tcRivals)
    {
        rival.jumpVelocity = 0;
        rival.onGround = true;
        rival.pos.y = clamp(rival.targetY, tcHorseMinY, tcHorseMaxY);
        rival.speed = 0;
    }

    const allHorses = [tcPlayer, ...tcRivals].sort((a,b)=>b.distance-a.distance);

    if (allHorses[0] === tcPlayer)
    {
        const rewardHorse = tcAwardMilestoneHorse(tcLevel);

        tcWinner = tcLevel == tcLevels.length
            ? 'TIMOTHY CENTER CHAMPION!'
            : 'LEVEL COMPLETE!';

        if (rewardHorse)
            tcWinner = `LEVEL COMPLETE!  ${rewardHorse.toUpperCase()} UNLOCKED!`;

        if (tcLevel >= 10 && !tcBarnUnlocked)
        {
            tcBarnUnlocked = true;
            tcSaveActiveProfile();

            if (!rewardHorse)
                tcWinner = 'LEVEL COMPLETE!  BARN UNLOCKED!';
            else
                tcWinner = `LEVEL COMPLETE!  ${rewardHorse.toUpperCase()} + BARN UNLOCKED!`;
        }
    }
    else
        tcWinner = 'TRY THIS LEVEL AGAIN!';
}

function tcAdvanceOrRestart()
{
    if (!tcFinished) return;

    const allHorses = [tcPlayer, ...tcRivals].sort((a,b)=>b.distance-a.distance);
    const playerWon = allHorses[0] === tcPlayer;

    if (playerWon)
    {
        if (tcLevel < tcLevels.length)
            tcLevel++;

        // Winning advances one level (or replays the final level after the championship).
        tcSaveActiveProfile();
        tcResetLevel(false);
    }
    else
    {
        // Losing never sends the player back. Retry this exact level.
        tcSaveActiveProfile();
        tcResetLevel(false);
    }
}

function tcDrawPassingScenery()
{
    const scroll = tcPlayerDistance*.78;
    const farScroll = tcPlayerDistance*.34;

    // Deep forest backdrop.
    drawRect(vec2(0,4.0), vec2(30,4.4), hsl(.31,.42,.20));

    // Far tree wall.
    for (let i=0;i<16;++i)
    {
        const x = mod(i*2.9-farScroll+20,40)-20;
        const h = 2.4+(i%3)*.45;

        drawRect(vec2(x,3.1), vec2(.24,h), hsl(.08,.48,.22));
        drawTile(vec2(x,4.3), vec2(1.35,2.2), icons.triangle, hsl(.31,.48,.22));
        drawTile(vec2(x-.45,3.85), vec2(1.0,1.6), icons.triangle, hsl(.29,.50,.25));
        drawTile(vec2(x+.45,3.75), vec2(.95,1.5), icons.triangle, hsl(.33,.44,.20));
    }

    // Near trees and bushes.
    for (let i=0;i<12;++i)
    {
        const x = mod(i*3.8-scroll+18,38)-19;

        drawRect(vec2(x,3.0), vec2(.34,2.2), hsl(.075,.52,.24));
        drawTile(vec2(x,4.2), vec2(1.65,2.4), icons.triangle, hsl(.30,.56,.24));
        drawTile(vec2(x-.65,3.25), vec2(1.1,1.1), icons.circle, hsl(.32,.52,.28));
        drawTile(vec2(x+.7,3.15), vec2(.95,.95), icons.circle, hsl(.34,.46,.25));
    }

    for (let i=0;i<18;++i)
    {
        const x = mod(i*2.4-tcPlayerDistance*1.02+18,36)-18;
        drawTile(vec2(x,2.62), vec2(.9,.65), icons.circle, hsl(.31,.58,.25));
    }
}

async function gameInit()
{
    icons = initDefaultAtlas();
    canvasClearColor = hsl(.20,.24,.12);
    cameraPos = vec2(0,0);
    cameraScale = 43;
    gravity = vec2(0,0);

    tcBarnMessageTimer = new Timer();
    tcAccountSwitchTimer = new Timer();

}

///////////////////////////////////////////////////////////////////////////////
function gameUpdate()
{
    if (tcProfileMode)
    {
        if (keyWasPressed('ArrowUp') || keyWasPressed('KeyW'))
            tcProfileIndex = max(0, tcProfileIndex-1);

        if (keyWasPressed('ArrowDown') || keyWasPressed('KeyS'))
            tcProfileIndex = min(max(0,tcProfileNames.length-1), tcProfileIndex+1);

        if ((keyWasPressed('Enter') || keyWasPressed('Space')) && tcProfileNames.length)
            tcRestoreProfile(tcProfileNames[tcProfileIndex]);

        if (tcCreatingProfile || tcEditingProfile)
        {
            // Type a profile name directly in the game.
            for (let code=65; code<=90; ++code)
            {
                const key = 'Key' + String.fromCharCode(code);
                if (keyWasPressed(key) && tcNewProfileName.length < 16)
                    tcNewProfileName += String.fromCharCode(code);
            }

            for (let d=0; d<=9; ++d)
            {
                if (keyWasPressed('Digit' + d) && tcNewProfileName.length < 16)
                    tcNewProfileName += d;
            }

            if (keyWasPressed('Space') && tcNewProfileName.length < 16)
                tcNewProfileName += ' ';

            if (keyWasPressed('Backspace') && tcNewProfileName.length)
                tcNewProfileName = tcNewProfileName.slice(0,-1);

            if (keyWasPressed('Escape'))
            {
                tcCreatingProfile = false;
                tcEditingProfile = false;
                tcEditingOriginalName = '';
                tcNewProfileName = '';
                tcProfileMessage = '';
            }

            if (keyWasPressed('Enter'))
            {
                const newName = tcNewProfileName.trim();

                if (tcEditingProfile)
                    tcRenameProfile(tcEditingOriginalName, newName);
                else
                    tcCreateProfile(newName);

                tcCreatingProfile = false;
                tcEditingProfile = false;
                tcEditingOriginalName = '';
                tcNewProfileName = '';
            }

            return;
        }

        if (keyWasPressed('KeyE') && tcProfileNames.length)
        {
            tcEditingProfile = true;
            tcEditingOriginalName = tcProfileNames[tcProfileIndex];
            tcNewProfileName = tcEditingOriginalName;
            tcProfileMessage = 'Edit the account name, then press Enter.';
            return;
        }

        if (keyWasPressed('KeyN') || keyWasPressed('KeyC'))
        {
            tcCreatingProfile = true;
            tcEditingProfile = false;
            tcEditingOriginalName = '';
            tcNewProfileName = '';
            tcProfileMessage = 'Type a name, then press Enter.';
            return;
        }

        if (keyWasPressed('Delete'))
            tcDeleteSelectedProfile();

        return;
    }

    // Account changes happen between rounds, not during an active race.
    if (keyWasPressed('KeyP') || keyWasPressed('Tab') || keyWasPressed('KeyS'))
    {
        if (!tcStarted || tcFinished || tcInBarn)
        {
            tcReturnToProfiles();
            return;
        }

        tcAccountSwitchMessage = 'Finish this round, then switch accounts.';
        tcAccountSwitchTimer.set(2.2);
    }

    // New accounts can also be created between rounds.
    if (keyWasPressed('KeyC'))
    {
        if (!tcStarted || tcFinished || tcInBarn)
        {
            tcCreateNewAccountFromGame();
            return;
        }

        tcAccountSwitchMessage = 'Create a new account after this round.';
        tcAccountSwitchTimer.set(2.2);
    }

    if (tcInBarn)
    {
        if (keyWasPressed('Digit1') || keyWasPressed('KeyF'))
            tcDoBarnChore('feed');

        if (keyWasPressed('Digit2') || keyWasPressed('KeyW'))
            tcDoBarnChore('water');

        if (keyWasPressed('Digit3') || keyWasPressed('KeyS'))
            tcDoBarnChore('scoop');

        if (keyWasPressed('Digit4') || keyWasPressed('KeyN'))
            tcNurtureFoal();

        if (keyWasPressed('Escape') || keyWasPressed('KeyR'))
            tcLeaveBarn();

        return;
    }

    if (tcBarnUnlocked && !tcStarted && keyWasPressed('KeyB'))
    {
        tcEnterBarn();
        return;
    }

    // Choose your horse.
    if (tcChoosingHorse && !tcStarted)
    {
        if (tcUnlockedHorseIndices().length > 1 &&
            (keyWasPressed('ArrowLeft') || keyWasPressed('KeyA')))
        {
            tcSelectedHorse = tcMoveHorseSelection(tcSelectedHorse, -1);
            tcPlayer.bodyColor = tcHorseChoices[tcSelectedHorse].color;
            tcPlayer.maneColor = tcHorseChoices[tcSelectedHorse].mane;
        }

        if (tcUnlockedHorseIndices().length > 1 &&
            (keyWasPressed('ArrowRight') || keyWasPressed('KeyD')))
        {
            tcSelectedHorse = tcMoveHorseSelection(tcSelectedHorse, 1);
            tcPlayer.bodyColor = tcHorseChoices[tcSelectedHorse].color;
            tcPlayer.maneColor = tcHorseChoices[tcSelectedHorse].mane;
        }

        if (keyWasPressed('Space') || keyWasPressed('Enter') ||
            mouseWasPressed(0) || gamepadWasPressed(0))
        {
            tcChoosingHorse = false;
            tcChoosingOpponent = true;

            if (!tcIsHorseUnlocked(tcHorseChoices[tcSelectedOpponent]) ||
                tcSelectedOpponent == tcSelectedHorse)
            {
                tcSelectedOpponent = tcMoveHorseSelection(
                    tcSelectedHorse, 1, tcSelectedHorse);
            }
        }
        return;
    }

    // Choose main opponent.
    if (tcChoosingOpponent && !tcStarted)
    {
        if (keyWasPressed('ArrowLeft') || keyWasPressed('KeyA'))
            tcSelectedOpponent = tcMoveHorseSelection(
                tcSelectedOpponent, -1, tcSelectedHorse);

        if (keyWasPressed('ArrowRight') || keyWasPressed('KeyD'))
            tcSelectedOpponent = tcMoveHorseSelection(
                tcSelectedOpponent, 1, tcSelectedHorse);

        if (keyWasPressed('Escape') || keyWasPressed('Backspace'))
        {
            tcChoosingOpponent = false;
            tcChoosingHorse = true;
            return;
        }

        if (keyWasPressed('Space') || keyWasPressed('Enter') ||
            mouseWasPressed(0) || gamepadWasPressed(0))
        {
            // Rebuild rivals using the chosen opponent, then start.
            if (tcSelectedOpponent == tcSelectedHorse)
                tcSelectedOpponent = tcMoveHorseSelection(
                    tcSelectedHorse, 1, tcSelectedHorse);

            const chosenHorse = tcSelectedHorse;
            const chosenOpponent = tcSelectedOpponent;
            tcResetLevel(false);
            tcSelectedHorse = chosenHorse;
            tcSelectedOpponent = chosenOpponent;

            tcPlayer.bodyColor = tcHorseChoices[tcSelectedHorse].color;
            tcPlayer.maneColor = tcHorseChoices[tcSelectedHorse].mane;

            // Rebuild rivals one more time so opponent choice is guaranteed.
            tcRivals.forEach(o=>o.destroy());
            tcRivals = [];

            const level = tcLevels[tcLevel-1];
            const unlocked = tcUnlockedHorseIndices();

            for (let i=0; i<level.rivals; ++i)
            {
                const y = lerp(tcHorseMinY,tcHorseMaxY,(i+1)/(level.rivals+1));
                let horseIndex;

                if (i == 0)
                    horseIndex = tcSelectedOpponent;
                else
                {
                    const pool = unlocked.filter(index => index != tcSelectedHorse);
                    horseIndex = pool.length ? pool[i%pool.length] : tcSelectedOpponent;
                }

                const horseDef = tcHorseChoices[horseIndex];
                const playerColor = tcHorseChoices[tcSelectedHorse].color;
                const rivalColor = tcHorseColorIsTooSimilar(horseDef.color, playerColor)
                    ? tcContrastingHorseColor(playerColor, i+tcLevel)
                    : horseDef.color;

                const rival = new TCHorse(vec2(-5.0-i*.35,y),rivalColor,false,i);
                rival.maneColor = horseDef.mane;
                rival.displayName = horseDef.name;
                rival.targetY = y;
                rival.speed = rand(level.rivalMin,level.rivalMax);
                tcRivals.push(rival);
            }

            tcSaveActiveProfile();
            tcStartRace();
        }
        return;
    }

    const level = tcLevels[tcLevel-1];
    const nearFinish = tcPlayerDistance >= level.distance-16;

    if (tcStarted && !tcFinished && !tcPlayerCrossed &&
        !nearFinish && tcObstacleTimer.elapsed())
        tcSpawnObstacle();

    const firstCrossed =
        (tcPlayer && tcPlayer.finished) ||
        tcRivals.some(r => r && r.finished);

    if (!tcFinished && firstCrossed && tcFinishDelay && tcFinishDelay.elapsed())
        tcEndLevel();

    if (tcFinished &&
        (keyWasPressed('Enter') || keyWasPressed('KeyR') || mouseWasPressed(0)))
        tcAdvanceOrRestart();

    if (tcFinished && tcBarnUnlocked && keyWasPressed('KeyB'))
        tcEnterBarn();
}

///////////////////////////////////////////////////////////////////////////////
function gameUpdatePost()
{
    cameraPos = vec2(0,0);

    // Prevent exact sprite stacking while still allowing passing.
    const horses = [tcPlayer,...tcRivals].filter(h=>h && !h.destroyed);
    const bodyDX = 2.35;
    const bodyDY = .62;

    for (let pass=0; pass<5; ++pass)
    {
        for (let i=0; i<horses.length; ++i)
        for (let j=i+1; j<horses.length; ++j)
        {
            const a = horses[i], b = horses[j];
            const dx = b.pos.x-a.pos.x;
            const dy = b.pos.y-a.pos.y;

            if (abs(dx)<bodyDX && abs(dy)<bodyDY)
            {
                const dirY = abs(dy)>.05 ? sign(dy) : (i&1 ? 1 : -1);
                const push = (bodyDY-abs(dy))*.38;

                a.targetY = clamp(a.targetY-dirY*push,tcHorseMinY,tcHorseMaxY);
                b.targetY = clamp(b.targetY+dirY*push,tcHorseMinY,tcHorseMaxY);

                if (a.onGround) a.pos.y = lerp(a.pos.y,a.targetY,.55);
                if (b.onGround) b.pos.y = lerp(b.pos.y,b.targetY,.55);
            }
        }
    }

    for (const horse of horses)
    {
        horse.targetY = clamp(horse.targetY,tcHorseMinY,tcHorseMaxY);
        if (horse.onGround || horse.finished || tcFinished)
            horse.pos.y = clamp(horse.pos.y,tcHorseMinY,tcHorseMaxY);
    }
}

function gameRender()
{
    if (tcProfileMode)
    {
        drawRectGradient(cameraPos, getCameraSize(), hsl(.31,.34,.20), hsl(.08,.34,.13));

        // Forest lodge / sign background.
        for (let i=-6;i<=6;++i)
        {
            const x = i*3.0;
            drawRect(vec2(x,1.3), vec2(.25,5.2), hsl(.08,.45,.22));
            drawTile(vec2(x,3.6), vec2(2.1,3.0), icons.triangle, hsl(.31,.48,.24));
        }

        drawRect(vec2(0,-2.6), vec2(30,3.4), hsl(.095,.38,.42));
        return;
    }

    if (tcInBarn)
    {
        drawRectGradient(cameraPos,getCameraSize(),hsl(.08,.38,.22),hsl(.07,.45,.10));
        drawRect(vec2(0,-2.7),vec2(30,3.0),hsl(.08,.35,.35));

        for (let x=-14; x<=14; x+=2)
            drawRect(vec2(x,2.0),vec2(1.8,6.3),hsl(.075,.42,.28));

        drawRect(vec2(-5.5,0),vec2(.28,6.0),hsl(.08,.30,.18));
        drawRect(vec2(5.5,0),vec2(.28,6.0),hsl(.08,.30,.18));
        drawRect(vec2(0,-.6),vec2(11,.22),hsl(.08,.30,.18));
        drawRect(vec2(-8,-2.0),vec2(2.3,1.2),hsl(.13,.68,.56));
        drawRect(vec2(8,-2.1),vec2(2.5,.7),hsl(.55,.55,.42));

        tcDrawBarnHorse(vec2(0,.15),tcHorseChoices[tcSelectedHorse].color,1.2);

        if (tcFoal)
            tcDrawBarnHorse(vec2(4.0,-.7),tcFoal.color,tcFoal.grown?.9:.6);

        return;
    }

    drawRectGradient(cameraPos,getCameraSize(),hsl(.55,.34,.68),hsl(.31,.36,.28));
    tcDrawPassingScenery();

    // One large dirt forest road.
    drawRect(vec2(0,-.15),vec2(30,7.25),hsl(.095,.40,.50));
    drawRect(vec2(0,3.5),vec2(30,.25),hsl(.28,.55,.28));
    drawRect(vec2(0,-3.8),vec2(30,.25),hsl(.28,.55,.28));

    const dirtScroll = tcPlayerDistance*1.1;
    for (let i=0;i<20;++i)
    {
        const x = mod(i*2.3-dirtScroll+20,40)-20;
        const y = -3+(i%7)*.85;
        drawRect(vec2(x,y),vec2(.45,.06),hsl(.09,.28,.42));
    }

    // Horse shadows.
    if (tcPlayer)
        drawTile(vec2(tcPlayer.pos.x,tcPlayer.targetY-.95),vec2(2.8,.35),icons.glow,
            hsl(0,0,.05,.22),0,false,new Color(0,0,0,0));

    for (const rival of tcRivals)
        drawTile(vec2(rival.pos.x,rival.targetY-.95),vec2(2.8,.35),icons.glow,
            hsl(0,0,.05,.18),0,false,new Color(0,0,0,0));

    const level = tcLevels[tcLevel-1];
    const finishScreenX = (tcPlayer ? tcPlayer.pos.x : -5.2) +
        (level.distance-tcPlayerDistance)*.72;

    if (finishScreenX<13 && finishScreenX>-12)
    {
        drawRect(vec2(finishScreenX,-.15),vec2(.22,7.2),WHITE);
        drawRect(vec2(finishScreenX,3.65),vec2(3.4,.65),WHITE);

        for (let i=-3;i<=3;++i)
            if (i%2)
                drawRect(vec2(finishScreenX+i*.5,3.65),vec2(.5,.65),BLACK);

        drawText('FINISH',vec2(finishScreenX,4.45),.68,WHITE,.08,BLACK);
    }
}

                    vec2(cx,mainCanvasSize.y-145),28,YELLOW,4,BLACK);
                drawTextScreen(`←  ${horse.name}  →`,
                    vec2(cx,mainCanvasSize.y-106),27,WHITE,4,BLACK);
                drawRect(vec2(cx,mainCanvasSize.y-72),vec2(86,26),horse.color,0,true);

                const barnHint = tcBarnUnlocked ? '   B = BARN' : '   BARN UNLOCKS AFTER LEVEL 10';
                const nextReward = tcHorseChoices.find(h =>
                    h.rewardLevel && h.rewardLevel >= tcLevel &&
                    !tcUnlockedHorseNames.includes(h.name));
                const rewardHint = nextReward ? `   NEXT HORSE: BEAT LEVEL ${nextReward.rewardLevel}` : '';
                drawTextScreen(
                    `UNLOCKED ${unlockedCount}/${tcHorseChoices.length}   ${lockedCount} LOCKED${rewardHint}${barnHint}`,
                    vec2(cx,mainCanvasSize.y-37),16,WHITE,3,BLACK);
            }
        }
    }
    else if (!tcFinished)
    {
        drawTextScreen('MOVE: ARROWS / WASD   GALLOP: SPACE / TAP   JUMP: ↑ / W / SHIFT / J',
            vec2(cx,mainCanvasSize.y-38),20,WHITE,3,BLACK);

        if (tcMessageTimer.active() && tcRaceMessage)
            drawTextScreen(tcRaceMessage,vec2(cx,140),24,YELLOW,4,BLACK);

        if (tcAccountSwitchTimer && tcAccountSwitchTimer.active() && tcAccountSwitchMessage)
            drawTextScreen(tcAccountSwitchMessage,vec2(cx,175),21,YELLOW,3,BLACK);
    }
    else
    {
        drawTextScreen(tcWinner,vec2(cx,mainCanvasSize.y/2-18),50,YELLOW,6,BLACK);

        const allHorses = [tcPlayer,...tcRivals].sort((a,b)=>b.distance-a.distance);
        const place = allHorses.indexOf(tcPlayer)+1;

        drawTextScreen(`You finished ${place}${place==1?'st':place==2?'nd':place==3?'rd':'th'}`,
            vec2(cx,mainCanvasSize.y/2+22),24,WHITE,3,BLACK);

        const prompt = place==1
            ? (tcLevel<tcLevels.length ? 'ENTER / TAP FOR NEXT LEVEL' : 'ENTER / TAP TO RACE AGAIN')
            : 'ENTER / TAP TO RETRY THIS LEVEL';

        drawTextScreen(prompt,vec2(cx,mainCanvasSize.y/2+60),22,WHITE,3,BLACK);

        if (tcBarnUnlocked)
            drawTextScreen('B = VISIT THE BARN',
                vec2(cx,mainCanvasSize.y/2+92),20,YELLOW,3,BLACK);

        drawTextScreen('S / P / TAB = SWITCH ACCOUNT',
            vec2(cx,mainCanvasSize.y/2+124),19,WHITE,3,BLACK);
    }
}

///////////////////////////////////////////////////////////////////////////////
// Startup LittleJS Engine
engineInit(gameInit, gameUpdate, gameUpdatePost, gameRender, gameRenderPost);

</script></body>
