'use strict';

// AI can use this class to make sound effects
class SoundGenerator extends Sound
{
    constructor(params = {})
    {
        const {
            volume = 1,        // Volume scale (percent)
            randomness = .05,  // How much to randomize frequency (percent Hz)
            frequency = 220,   // Frequency of sound (Hz)
            attack = 0,        // Attack time, how fast sound starts (seconds)
            release = .1,      // Release time, how fast sound fades out (seconds)
            shapeCurve = 1,    // Squarenes of wave (0=square, 1=normal, 2=pointy)
            slide = 0,         // How much to slide frequency (kHz/s)
            pitchJump = 0,     // Frequency of pitch jump (Hz)
            pitchJumpTime = 0, // Time of pitch jump (seconds)
            repeatTime = 0,    // Resets some parameters periodically (seconds)
            noise = 0,         // How much random noise to add (percent)
            bitCrush = 0,      // Resamples at a lower frequency in (samples*100)
            delay = 0,         // Overlap sound with itself for reverb and flanger effects (seconds)
        } = params;

        super([volume, randomness, frequency, attack, 0, release, 0, shapeCurve, slide, 0, pitchJump, pitchJumpTime, repeatTime, noise, 0, bitCrush, delay, 1, 0, 0, 0]);
    }
}

///////////////////////////////////////////////////////////////////////////////
// SPRITE ATLAS (do not remove) - bakes 16 white shape icons into one texture so
// the AI can draw recolorable sprites with zero external assets. Call
// initDefaultAtlas() once in gameInit to get a name->TileInfo map, then draw any
// icon with drawTile(pos, size, icons.NAME, color). Each icon is pure white, so
// the color argument tints it to any hue. Icon names (tiles 0-15):
//   circle glow ring roundSquare triangle diamond pentagon hexagon
//   spark star burst plus heart droplet bolt arrow

const ATLAS_SIZE = 2048; // texture size in pixels
const DRAW_SIZE = 500;   // fixed logical space every icon is painted in
let TILE_COLS, TILE_PADDING, TILE_STRIDE, TILE_SIZE, TILE_COUNT;
let atlasCanvas, atlasCtx, atlasDirty, flushScheduled;

function initDrawToTexture(cols = 4)
{
    ASSERT(cols === 4 || cols === 8, 'cols must be 4 or 8');

    TILE_COLS    = cols;
    TILE_STRIDE  = ATLAS_SIZE / TILE_COLS;          // 512 or 256
    TILE_PADDING = TILE_COLS === 4 ? 12 : 6;        // transparent moat to stop mip bleed
    TILE_SIZE    = TILE_STRIDE - TILE_PADDING * 2;  // 488 or 244
    TILE_COUNT   = TILE_COLS * TILE_COLS;

    atlasCanvas = document.createElement('canvas');
    atlasCanvas.width = atlasCanvas.height = ATLAS_SIZE;
    atlasCtx = atlasCanvas.getContext('2d');

    textureInfos[0] && textureInfos[0].destroyWebGLTexture();
    textureInfos[0] = new TextureInfo(atlasCanvas);

    setTileDefaultSize(vec2(TILE_SIZE));
    setTileDefaultPadding(TILE_PADDING);
    atlasDirty = flushScheduled = false;
}

function drawToTexture(tileIndex, drawFn)
{
    ASSERT(tileIndex >= 0 && tileIndex < TILE_COUNT, 'tileIndex out of range');

    const cellX = (tileIndex % TILE_COLS) * TILE_STRIDE;
    const cellY = (tileIndex / TILE_COLS | 0) * TILE_STRIDE;
    const drawX = cellX + TILE_PADDING;
    const drawY = cellY + TILE_PADDING;

    atlasCtx.clearRect(cellX, cellY, TILE_STRIDE, TILE_STRIDE);
    atlasCtx.save();
    atlasCtx.translate(drawX, drawY);
    atlasCtx.beginPath();
    atlasCtx.rect(0, 0, TILE_SIZE, TILE_SIZE);
    atlasCtx.clip();
    // paint in a fixed DRAW_SIZE space scaled to fill the tile
    atlasCtx.scale(TILE_SIZE / DRAW_SIZE, TILE_SIZE / DRAW_SIZE);
    drawFn(atlasCtx, tileIndex);
    atlasCtx.restore();

    atlasDirty = true;
    if (!flushScheduled)
    {
        flushScheduled = true;
        queueMicrotask(flushAtlas);
    }
    return new TileInfo(vec2(drawX, drawY), vec2(TILE_SIZE), textureInfos[0], TILE_PADDING);
}

function flushAtlas()
{
    flushScheduled = false;
    if (!atlasDirty) return;
    atlasDirty = false;
    textureInfos[0].createWebGLTexture();
}

// Force every texel RGB to white (keeping alpha) so bilinear/mipmap filtering
// can't darken the white icon edges into a halo. Call after painting white tiles.
function whitenAtlasAlpha()
{
    flushAtlas();
    if (!glContext || !textureInfos[0].glTexture) return; // canvas2D: no GL halo

    const image = atlasCtx.getImageData(0, 0, ATLAS_SIZE, ATLAS_SIZE);
    const d = image.data;
    for (let i = 0; i < d.length; i += 4)
        d[i] = d[i+1] = d[i+2] = 255; // white RGB, leave alpha alone

    glContext.bindTexture(glContext.TEXTURE_2D, textureInfos[0].glTexture);
    glContext.texImage2D(glContext.TEXTURE_2D, 0, glContext.RGBA,
        glContext.RGBA, glContext.UNSIGNED_BYTE, image);
    if (!tilesPixelated && isPowerOfTwo(ATLAS_SIZE))
        glContext.generateMipmap(glContext.TEXTURE_2D);
    glContext.bindTexture(glContext.TEXTURE_2D, glActiveTexture); // restore engine binding
}

// 16 built-in white-on-transparent icons, drawn centred at (x,y) with radius r.
const DEFAULT_ICON_NAMES = [
    'circle', 'glow', 'ring', 'roundSquare',
    'triangle', 'diamond', 'pentagon', 'hexagon',
    'spark', 'star', 'burst', 'plus',
    'heart', 'droplet', 'bolt', 'arrow',
];

const _defaultIconDrawers = (() =>
{
    function poly(ctx, x, y, r, sides, rot = 0)
    {
        ctx.beginPath();
        for (let k = sides; k--;)
        {
            const a = rot + k * (2*PI / sides);
            ctx.lineTo(x + Math.sin(a) * r, y - Math.cos(a) * r);
        }
        ctx.closePath();
    }
    function starPath(ctx, x, y, ro, ri, points, rot = -PI/2)
    {
        ctx.beginPath();
        for (let k = points * 2; k--;)
        {
            const rr = k & 1 ? ri : ro;
            const a = rot + k * (PI / points);
            ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.closePath();
    }
    function roundRectPath(ctx, x, y, w, h, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    function circle(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function droplet(ctx, x, y, r)
    {
        const by = y + .3 * r, br = .6 * r;
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.bezierCurveTo(x + .3 * r, y - .5 * r, x + br, y - .1 * r, x + br, by);
        ctx.arc(x, by, br, 0, PI);
        ctx.bezierCurveTo(x - br, y - .1 * r, x - .3 * r, y - .5 * r, x, y - r);
        ctx.closePath();
        ctx.fill();
    }
    function roundSquare(ctx, x, y, r)
    {
        roundRectPath(ctx, x - r, y - r, r*2, r*2, r*.4);
        ctx.fill();
    }
    function triangle(ctx, x, y, r) { poly(ctx, x, y, r, 3);        ctx.fill(); }
    function diamond(ctx, x, y, r)  { poly(ctx, x, y, r, 4);        ctx.fill(); }
    function pentagon(ctx, x, y, r) { poly(ctx, x, y, r, 5);        ctx.fill(); }
    function hexagon(ctx, x, y, r)  { poly(ctx, x, y, r, 6, PI/2);  ctx.fill(); }
    function ring(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.arc(x, y, r*.7, 9, 0, true);
        ctx.fill();
    }
    function glow(ctx, x, y, r)
    {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 9);
        ctx.fill();
    }
    function burst(ctx, x, y, r) { starPath(ctx, x, y, r, r*.7, 10); ctx.fill(); }
    function spark(ctx, x, y, r) { starPath(ctx, x, y, r, r/4, 4);   ctx.fill(); }
    function star(ctx, x, y, r)  { starPath(ctx, x, y, r, r*.4, 5);  ctx.fill(); }
    function heart(ctx, x, y, r)
    {
        const width = 1, topCtrl = .92, dip = .40, shoulder = .46, tip = .9;
        const p = (nx, ny) => [x + nx * r, y + ny * r];
        ctx.beginPath();
        ctx.moveTo(...p(0, -dip));
        ctx.bezierCurveTo(...p(0, -topCtrl), ...p(-width, -topCtrl), ...p(-width, -shoulder));
        ctx.bezierCurveTo(...p(-width, 0), ...p(0, tip * .9), ...p(0, tip));
        ctx.bezierCurveTo(...p(0, tip * .9), ...p(width, 0), ...p(width, -shoulder));
        ctx.bezierCurveTo(...p(width, -topCtrl), ...p(0, -topCtrl), ...p(0, -dip));
        ctx.closePath();
        ctx.fill();
    }
    function plus(ctx, x, y, r)
    {
        const a = r * .3, b = r;
        ctx.beginPath();
        ctx.moveTo(x - a, y - b); ctx.lineTo(x + a, y - b); ctx.lineTo(x + a, y - a);
        ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y + a); ctx.lineTo(x + a, y + a);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y + a);
        ctx.lineTo(x - b, y + a); ctx.lineTo(x - b, y - a); ctx.lineTo(x - a, y - a);
        ctx.closePath();
        ctx.fill();
    }
    function arrow(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.lineTo(x + .8 * r, y - .1 * r); ctx.lineTo(x + .3 * r, y - .1 * r);
        ctx.lineTo(x + .3 * r, y + r);      ctx.lineTo(x - .3 * r, y + r);
        ctx.lineTo(x - .3 * r, y - .1 * r); ctx.lineTo(x - .8 * r, y - .1 * r);
        ctx.closePath();
        ctx.fill();
    }
    function bolt(ctx, x, y, r)
    {
        ctx.beginPath();
        ctx.moveTo(x + .25 * r, y - r);   ctx.lineTo(x - .5 * r, y + .15 * r);
        ctx.lineTo(x - .1 * r, y + .15 * r); ctx.lineTo(x - .25 * r, y + r);
        ctx.lineTo(x + .5 * r, y - .2 * r);  ctx.lineTo(x + .1 * r, y - .2 * r);
        ctx.closePath();
        ctx.fill();
    }
    return {
        circle, glow, ring, roundSquare, triangle, diamond, pentagon, hexagon,
        spark, star, burst, plus, heart, droplet, bolt, arrow,
    };
})();

// Paint one named white icon into a tile and return its TileInfo. scale tweaks
// icon size within the tile (1 = default).
function drawDefaultIcon(name, tileIndex, scale = 1)
{
    const fn = _defaultIconDrawers[name];
    ASSERT(fn, 'unknown default icon: ' + name);
    return drawToTexture(tileIndex, ctx =>
    {
        const c = DRAW_SIZE / 2, r = c * scale;
        ctx.fillStyle = ctx.strokeStyle = '#fff';
        ctx.lineJulesin = ctx.lineCap = 'round';
        fn(ctx, c, c, r);
    });
}

// Build the 16 default icons into tiles 0-15 and return a name->TileInfo map.
function initDefaultAtlas(scale = 1)
{
    if (!atlasCtx) initDrawToTexture(4);
    const icons = {};
    for (let i = 0; i < DEFAULT_ICON_NAMES.length; ++i)
        icons[DEFAULT_ICON_NAMES[i]] = drawDefaultIcon(DEFAULT_ICON_NAMES[i], i, scale);
    whitenAtlasAlpha(); // white RGB everywhere -> no dark halo
    return icons;
}

///////////////////////////////////////////////////////////////////////////////
// the default sprite atlas, a name->TileInfo map filled in by gameInit
let icons, art={};

///////////////////////////////////////////////////////////////////////////////
let score=0, served=0, level=1, stars=0, order, tray=[], prepared=false, message='', waitingForNext=false,
scoopFlavor='', scoopLoaded=false, holdingScoop=false, holdingMilk=false, holdingCup=false, cupFilled=false,
blenderRunning=false, blenderTimer=new Timer(), happyTimer=new Timer(),
guestPhase='active', guestTimer=new Timer(), guestSlide=0, guestSlideTarget=0, guestName='Customer', guestStyle=0,
needsReset=false, progressTimer=new Timer(), progressText='',
heldVisualPos=vec2(), heldVisualReady=false, pickupBounce=new Timer();
let voiceMode=0;
const VOICES=['Friendly','Higher','Lower'];
const CUSTOMERS=['Maya','Nina','Casey','Leo'];


function recipeHas(name){ return !!order && order.need.includes(name); }
function alreadyAdded(name){ return tray.includes(name); }

function markAdded(name,pos){
 progressText=`✓ ${shortName(name)} ADDED!`;
 progressTimer.set(.8);
 new ParticleEmitter(pos,0,0,.08,28,PI,icons.spark,
  hsl(.34,.7,.55),WHITE,rgb(0,.9,.3,0),rgb(1,1,1,0),
  .45,.08,.32,.08,0,1,1,0,PI,.08,.12,false,true);
}


function guestStyleFromName(name){
 if(name=='Maya')return 0;
 if(name=='Nina')return 1;
 if(name=='Casey')return 2;
 if(name=='Leo')return 3;
 return 0;
}

function missingIngredient(){
 if(!order)return '';
 return order.need.find(name=>!tray.includes(name) && name!=scoopFlavor && name!=holdingMilk) || '';
}
function shortName(name){
 return name.replace(' Ice Cream','').replace('Chocolate Syrup','Choc. Syrup').replace('Strawberry Syrup','Berry Syrup');
}
function kidStep(){
 if(needsReset)return 'TAP START OVER';
 if(waitingForNext){
  if(guestPhase=='thanks')return 'THE CUSTOMER SAYS THANK YOU!';
  if(guestPhase=='leaving')return 'BYE! NEXT CUSTOMER...';
  if(guestPhase=='arriving')return 'A NEW CUSTOMER IS COMING!';
  return 'GREAT JOB!';
 }
 if(blenderRunning)return 'WAIT... IT IS BLENDING!';
 if(cupFilled)return 'TAKE THE CUP TO THE CUSTOMER';
 if(prepared && !holdingCup)return 'PICK UP A CUP';
 if(prepared && holdingCup)return order.kind=='BLEND'?'TAP THE BLENDER TO FILL THE CUP':'TAP MIX TO FILL THE CUP';

 const station=order && order.kind=='MIX'?'MIX':'BLENDER';
 if(scoopLoaded)return `TAP ${station} TO ADD THE SCOOP`;
 if(holdingMilk)return `TAP ${station} TO POUR ${shortName(holdingMilk).toUpperCase()}`;

 const miss=missingIngredient();
 if(miss){
  const item=PANTRY.find(x=>x.name==miss);
  if(item && isScoopFlavor(item)){
   if(!holdingScoop)return 'PICK UP THE SCOOPER';
   return `TAP ${shortName(miss).toUpperCase()}`;
  }
  if(holdingScoop)return 'SET THE SCOOPER DOWN';
  return `PICK UP ${shortName(miss).toUpperCase()}`;
 }
 return order && order.kind=='MIX'?'TAP MIX TO MAKE THE DRINK':'PRESS THE BLENDER BUTTON';
}
function kidTarget(){
 if(needsReset)return vec2(0,-5.18);
 if(waitingForNext)return 0;
 if(cupFilled)return partyCustomerPos(partyIndex);
 if(prepared&&!holdingCup)return vec2(6.5,-4.82);
 if(prepared&&holdingCup)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
 if(scoopLoaded||holdingMilk)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);

 const miss=missingIngredient();
 if(miss){
  const item=PANTRY.find(x=>x.name==miss);
  if(item&&isScoopFlavor(item)&&!holdingScoop)return vec2(-6.5,-4.82);
  if(item&&isScoopFlavor(item))return item.pos;
  if(holdingScoop)return vec2(-6.5,-4.82);
  if(item)return item.pos;
 }
 return order&&order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
}

{name:'Vanilla Ice Cream',pos:vec2(-7.25,-2.55),color:hsl(.12,.22,.94),icon:'circle'},

function drawFancyCup(pos,filled=false){

function drawIceCreamScoop(pos,color,label='')

function newOrder(arriving=false){
 order=RECIPES[randInt(min(RECIPES.length,5+level*2))];
 order.customer=CUSTOMERS[randInt(CUSTOMERS.length)];
 guestName=order.customer;
 guestStyle=guestStyleFromName(guestName);
 tray=[];prepared=false;scoopLoaded=false;scoopFlavor='';holdingCup=false;cupFilled=false;holdingScoop=false;holdingMilk=false;
 blenderRunning=false;needsReset=false;
 if(arriving){
  waitingForNext=true;guestPhase='arriving';guestSlide=3.1;guestSlideTarget=0;
  message=`${guestName} is coming to the counter!`;messageTimer.set(1.5);
 }else{
  waitingForNext=false;guestPhase='active';guestSlide=0;
  message=`New order: ${order.name}`;messageTimer.set(2);
 }
}
function hit(pos,size=vec2(2.5,1.7)){return isOverlapping(mousePos,vec2(.1),pos,size);}
function isScoopFlavor(item){
 return item.name.includes('Ice Cream') || item.name=='Raspberry Ripple';
}
function addIngredient(item){
 if(waitingForNext||needsReset)return;

 // Wrong choices are stopped immediately so young players never poison the recipe.
 if(!recipeHas(item.name)){
  roundMistakes++;
  message=`${shortName(item.name)} is not in this order.`;
  messageTimer.set(1.7);playSfx(sndBad);return;
 }
 if(alreadyAdded(item.name)){
  message=`${shortName(item.name)} is already added.`;
  messageTimer.set(1.4);playSfx(sndBad);return;
 }

 if(isScoopFlavor(item)){
  if(holdingMilk){
   message=`Put ${shortName(holdingMilk)} in the machine first.`;
   messageTimer.set(1.7);playSfx(sndBad);return;
  }
  if(!holdingScoop){
   message='Pick up the scooper first.';
   messageTimer.set(1.6);playSfx(sndBad);return;
  }
  if(scoopLoaded){
   message='Put the scoop in the machine first.';
   messageTimer.set(1.6);playSfx(sndBad);return;
  }
  scoopFlavor=item.name;scoopLoaded=true;
  message=`Scoop of ${shortName(item.name)} ready!`;
  messageTimer.set(1.5);playSfx(sndPick);return;
 }

 // Pourables are picked up by hand, never with the scooper.
 if(holdingScoop){
  message='Set the scooper down first.';
  messageTimer.set(1.5);playSfx(sndBad);return;
 }
 if(holdingMilk){
  message=`Put ${shortName(holdingMilk)} in the machine first.`;
  messageTimer.set(1.5);playSfx(sndBad);return;
 }
 holdingMilk=item.name;pickupBounce.set(.35);heldVisualReady=false;
 message=`Picked up ${shortName(item.name)}.`;
 messageTimer.set(1.3);playSfx(sndPick);
}
function serve(){
 if(waitingForNext)return;
 if(!holdingCup||!cupFilled){message='Pick up a cup and fill it from the blender first.';messageTimer.set(2);playSfx(sndBad);return;}
 if(!prepared){message=`Use the ${order.kind==='BLEND'?'blender':'mix station'} first.`;messageTimer.set(2);playSfx(sndBad);return;}
 const a=[...tray].sort().join('|'),b=[...order.need].sort().join('|');
 if(a===b){
  score+=100;served++;stars++;level=1+Math.floor(stars/3);
  holdingCup=false;cupFilled=false;waitingForNext=true;
  happyTimer.set(1.5);guestPhase='thanks';guestTimer.set(1.5);
  message=`${guestName}: Thank you!`;messageTimer.set(1.5);playSfx(sndGood);
  new ParticleEmitter(vec2(7.5,2.6),0,0,.1,70,PI,icons.spark,YELLOW,WHITE,rgb(1,1,0,0),rgb(1,1,1,0),.6,.15,.7,.12,0,1,1,0,PI,.1,.2,false,true);
 }else{needsReset=true;message='Oops! Tap START OVER and try again.';messageTimer.set(2);playSfx(sndBad);}
}

 icons=initDefaultAtlas();initIllustratedAtlas();canvasClearColor=hsl(.08,.18,.12);cameraPos=vec2(0,0);cameraScale=47;newOrder();
}
function gameUpdate(){
 // Finish timed blending.
 if(blenderRunning&&blenderTimer.elapsed()){
  blenderRunning=false;prepared=true;
  message='Ready! Pick up a cup.';
  messageTimer.set(2);playSfx(sndGood);
 }
 if(waitingForNext){
  if(guestPhase=='thanks'&&guestTimer.elapsed()){
   guestPhase='leaving';guestTimer.set(.9);message=`Bye, ${guestName}!`;messageTimer.set(.9);
  }
  else if(guestPhase=='leaving'){
   guestSlideTarget=3.2;
   guestSlide=lerp(guestSlide,guestSlideTarget,.12);
   if(guestTimer.elapsed())newOrder(true);
  }
  else if(guestPhase=='arriving'){
   guestSlideTarget=0;
   guestSlide=lerp(guestSlide,guestSlideTarget,.1);
   if(guestSlide<.05){
    guestSlide=0;guestPhase='active';waitingForNext=false;
    message=`${guestName}: I'd like a ${order.name}, please!`;messageTimer.set(2);
   }
  }
 }
 if(waitingForNext)return;
 if(!mouseWasPressed(0))return;

 // Scooper dock.
 if(hit(vec2(-6.5,-4.82),vec2(3.1,1.5))){
  if(holdingScoop){
   holdingScoop=false;scoopLoaded=false;scoopFlavor='';
   message='Scooper set down.';
  }else{
   if(holdingMilk){message=`Put ${holdingMilk} in the machine first.`;messageTimer.set(2);playSfx(sndBad);return;}
   holdingScoop=true;pickupBounce.set(.35);heldVisualReady=false;message='Scooper picked up!';
  }
  messageTimer.set(1.5);playSfx(sndPick);return;
 }

 // Cup dock.
 if(hit(vec2(6.5,-4.82),vec2(3.1,1.5))){
  if(prepared){
   holdingCup=!holdingCup;
   if(!holdingCup)cupFilled=false;
   if(holdingCup){pickupBounce.set(.35);heldVisualReady=false;} message=holdingCup?'Cup picked up!':'Cup set down.';
   messageTimer.set(1.5);playSfx(sndPick);
  }else{
   message='Make the drink first.';messageTimer.set(1.5);playSfx(sndBad);
  }
  return;
 }

 // Clear button.
 if(hit(vec2(0,-5.18),vec2(1.9,.65))){
  tray=[];scoopLoaded=false;scoopFlavor='';holdingScoop=false;holdingMilk=false;
  holdingCup=false;cupFilled=false;blenderRunning=false;prepared=false;needsReset=false;
  message='Fresh start!';messageTimer.set(1.2);return;
 }

 // Ingredients.
 for(const item of PANTRY){
  if(hit(item.pos,vec2(2.0,1.7))){addIngredient(item);return;}
 }

 // Blender station.
 if(hit(vec2(-3.8,1.15),vec2(2.8,2.7))){
  if(order.kind!='BLEND'){message='This drink uses MIX.';messageTimer.set(1.5);playSfx(sndBad);return;}
  if(holdingMilk){
   const poured=holdingMilk;holdingMilk=false;tray.push(poured);prepared=false;
   message=`Added ${shortName(poured)}!`;messageTimer.set(1.2);markAdded(poured,vec2(-3.8,1.5));playSfx(sndPick);return;
  }
  if(scoopLoaded){
   const added=scoopFlavor;tray.push(added);scoopLoaded=false;prepared=false;
   message='Scoop added!';messageTimer.set(1.2);markAdded(added,vec2(-3.8,1.5));playSfx(sndPick);return;
  }
  if(prepared&&holdingCup){
   cupFilled=true;message='Cup filled! Take it to the customer.';messageTimer.set(2);playSfx(sndPick);return;
  }
  if(missingIngredient()){
   message=`Still need ${missingIngredient()}.`;messageTimer.set(1.8);playSfx(sndBad);return;
  }
  if(!prepared&&!blenderRunning){
   blenderRunning=true;blenderTimer.set(1.4);message='Blending!';messageTimer.set(1.4);playSfx(sndPrep);return;
  }
  return;
 }

 // Mix station.
 if(hit(vec2(0,1.15),vec2(2.8,2.7))){
  if(order.kind!='MIX'){message='This drink uses the BLENDER.';messageTimer.set(1.5);playSfx(sndBad);return;}
  if(holdingMilk){
   const poured=holdingMilk;holdingMilk=false;tray.push(poured);prepared=false;
   message=`Added ${shortName(poured)}!`;messageTimer.set(1.2);markAdded(poured,vec2(0,1.5));playSfx(sndPick);return;
  }
  if(scoopLoaded){
   const added=scoopFlavor;tray.push(added);scoopLoaded=false;prepared=false;
   message='Scoop added!';messageTimer.set(1.2);markAdded(added,vec2(0,1.5));playSfx(sndPick);return;
  }
  if(prepared&&holdingCup){
   cupFilled=true;message='Cup filled! Take it to the customer.';messageTimer.set(2);playSfx(sndPick);return;
  }
  if(missingIngredient()){
   message=`Still need ${missingIngredient()}.`;messageTimer.set(1.8);playSfx(sndBad);return;
  }
  if(!prepared){
   prepared=true;message='Mixed! Pick up a cup.';messageTimer.set(1.7);playSfx(sndPrep);return;
  }
  return;
 }

 // Customer is the only place that serves.

function drawProfileScreen(){

 drawText("GORDON ICE CREAM TOWN",vec2(0,5.18),.46,hsl(.12,.52,.9),.06,hsl(.08,.62,.22));
 drawText('CHOOSE YOUR PLAYER',vec2(0,4.45),.34,WHITE);
 if(!profiles.length)drawText('Create a player to begin!',vec2(0,2.6),.32,hsl(.07,.45,.2));

 if(deleteTargetId){

  drawRect(vec2(0,.5),vec2(9,3.2),hsl(.12,.12,.98));

 }

  drawRect(r.pos,vec2(6.4,1.05),hsl(.12,.12,.97));
  drawText(r.p.name,r.pos.add(vec2(-1.6,.16)),.3,hsl(.07,.48,.2));
  drawText(`Level ${pr.level||1}  •  High ${pr.highestLevel||pr.level||1}  •  Best ${pr.bestScore||0}`,r.pos.add(vec2(-1.6,-.22)),.145,hsl(.07,.3,.3));

 }

}
function updateIntroScreen(){

 if(hit(vec2(0,-1.15),vec2(5.0,.9))){clearSession();beginRound(level);return;}
 if(hit(vec2(0,-2.4),vec2(5.0,.9))){changePlayer();return;}
}

function updateGameMenu(){
 if(!mouseWasPressed(0))return;
 if(hit(vec2(0,2.15),vec2(5.4,.85))){closeGameMenu();return;}
 if(hit(vec2(0,1.05),vec2(5.4,.85))){restartCurrentRound();return;}
 if(hit(vec2(0,-.05),vec2(5.4,.85))){changePlayer();return;}
 if(hit(vec2(0,-1.15),vec2(5.4,.85))){returnToGameLibrary();return;}
 if(hit(vec2(0,-2.55),vec2(5.4,.8))){gamesSettings.sound=!gamesSettings.sound;persistSettings();return;}
}
function drawGameMenuOverlay(){

}
function updateResultsScreen(){
 if(!mouseWasPressed(0))return;
 if(hit(vec2(0,-.65),vec2(5.0,.9))){beginRound(level);return;}
 if(hit(vec2(0,-1.8),vec2(5.0,.9))){
  level=resultsData?.level||max(1,level-1);
  score=roundStartScore;stars=roundStartStars;served=roundStartServed;
  beginRound(level);return;
 }
 if(hit(vec2(0,-2.95),vec2(5.0,.9))){changePlayer();return;}
 if(hit(vec2(0,-4.1),vec2(5.0,.9))){returnToGameLibrary();return;}
}

const LEVEL_RULES=[
 null,
 // Keep the first few levels calm enough for a young player to learn one idea at a time.
 {goal:3, partyMin:1,partyMax:1,time:0,   scoopOnly:true,  maxToppings:0,doubleScoop:false},

];

let customerPhotos={};
let party=[], partyOrders=[], partyServed=[], partyIndex=0, levelServed=0;
let holdingContainer='', containerFilled=false, addedToppings=[];
let partyDeadline=0, levelBannerTimer=new Timer();
let selectedContainerPos={BOWL:vec2(4.25,-4.8),CUP:vec2(6.05,-4.8),CONE:vec2(7.85,-4.8)};

function ruleForLevel(){
 if(level<LEVEL_RULES.length)return LEVEL_RULES[level];
 const extra=level-(LEVEL_RULES.length-1);
 return {
  goal:min(10,6+Math.floor(extra/3)),
  partyMin:min(3,2+Math.floor(extra/5)),
  partyMax:min(4,3+Math.floor(extra/4)),
  // Difficulty should rise, but never turn the game into a frantic tap race.
  time:max(58,90-extra*2),
  scoopOnly:false,
  maxToppings:min(3,2+Math.floor(extra/4)),
  doubleScoop:true,
  maxScoops:min(3,2+Math.floor(extra/6))
 };
}
function initCustomerPhotos(){
 customerPhotos={};
}
function ensureCustomerPhoto(name){
 if(customerPhotos[name])return customerPhotos[name];
 const src=CUSTOMER_PHOTO_DATA[name];
 if(!src)return null;
 const im=new Image();
 im.decoding='async';
 im.src=src;
 customerPhotos[name]=im;
 return im;
}

function drawCustomerPhoto(name,pos,height=3.0,alpha=1){
 const im=customerPhotos[name]||ensureCustomerPhoto(name);
 if(!im||!im.complete||!im.naturalWidth)return;
 const ctx=mainContext,p=worldToScreen(pos),sy=height*cameraScale,sx=sy*(im.naturalWidth/im.naturalHeight);
 ctx.save();
 ctx.globalAlpha=alpha;
 ctx.translate(p.x,p.y);
 ctx.drawImage(im,-sx/2,-sy/2,sx,sy);
 ctx.restore();
}

function drawGamesGuest(pos,name,pose='idle'){
 const bob=pose=='idle'?.035*sin(time*3):pose=='thanks'?.06*sin(time*7):0;
 drawCustomerPhoto(name,pos.add(vec2(0,bob)),3.6,1);
 drawText(name,pos.add(vec2(0,-1.62)),.18,hsl(.07,.45,.2),.025,WHITE);
}


function partyCustomerPos(i){
 const n=max(1,party.length);
 if(n==1)return vec2(7.7,2.55);
 if(n==2)return vec2(6.25+i*2.15,2.55);
 if(n==3)return vec2(5.35+i*1.72,2.55);
 return vec2(4.7+i*1.35,2.55);
}
function compactOrderName(o){
 if(!o)return '';
 let t=o.name;
 if((o.toppings||[]).length)t+=' + '+o.toppings.join(', ');
 return t.length>22?t.slice(0,21)+'…':t;
}
function drawPartyOrderCards(){
 if(party.length<2)return;
 for(let i=0;i<party.length;i++){
  if(partyServed[i])continue;
  const p=partyCustomerPos(i);
  const active=i==partyIndex;
  const cardPos=vec2(p.x,4.25);
  drawRect(cardPos,vec2(active?2.7:2.45,.86),active?hsl(.13,.32,.96):hsl(.12,.08,.94));
  drawText(party[i],cardPos.add(vec2(0,.2)),active?.18:.16,hsl(.07,.48,.2));
  drawText(compactOrderName(partyOrders[i]),cardPos.add(vec2(0,-.16)),active?.13:.115,BLACK);
  if(active){
   drawLine(cardPos.add(vec2(-1.05,-.38)),cardPos.add(vec2(1.05,-.38)),.05,hsl(.34,.65,.48));
  }
 }
}
function finishedOrderReady(){
 return !!holdingContainer && containerFilled && ingredientsComplete() && toppingsComplete();
}
function drawWaitingParty(){
 if(!party.length)return;
 for(let i=0;i<party.length;i++){
  if(i==partyIndex || partyServed[i])continue;
  const name=party[i],p=partyCustomerPos(i);
  drawCustomerPhoto(name,p,2.85,.96);
  drawText(name,p.add(vec2(0,-1.48)),.15,hsl(.07,.48,.22),.02,WHITE);
 }
}
function choosePartySize(){
 const r=ruleForLevel();
 const rolled=r.partyMin==r.partyMax?r.partyMin:r.partyMin+randInt(r.partyMax-r.partyMin+1);
 const remaining=max(1,r.goal-levelServed);
 return min(rolled,remaining);
}

function chooseParty(size){
 if(size<=1)return [CUSTOMER_POOL[randInt(CUSTOMER_POOL.length)]];
 const candidates=PARTY_GROUPS.filter(g=>g.length>=size);
 if(candidates.length){
  const g=[...candidates[randInt(candidates.length)]];
  // random contiguous-ish selection keeps actual families/friend groups together
  return g.slice(0,size);
 }
 const shuffled=[...CUSTOMER_POOL].sort(()=>Math.random()-.5);
 return shuffled.slice(0,size);
}

function randomFlavor(){
 const flavors=['Vanilla Ice Cream','Chocolate Ice Cream','Strawberry Ice Cream','Raspberry Ripple'];
 const max=level<=1?2:4;
 return flavors[randInt(max)];
}
function randomToppings(maxCount,container='CUP'){
 if(!maxCount)return [];
 let pool=TOPPINGS.map(t=>t.name);
 if(container!='BOWL')pool=pool.filter(n=>n!='Cone on Top');
 const count=min(maxCount,randInt(maxCount+1));
 pool=pool.sort(()=>Math.random()-.5);
 return pool.slice(0,count);
}
function plainOrder(){
 const r=ruleForLevel();
 const maxScoops=r.maxScoops|| (r.doubleScoop?2:1);
 const scoopCount=maxScoops>1 && randInt(3)==0 ? min(maxScoops,1+randInt(maxScoops)) : 1;
 const scoops=[];
 while(scoops.length<scoopCount){
  const f=randomFlavor();
  if(!scoops.includes(f))scoops.push(f);
 }
 const container=(level>=2 && randInt(2))?'CONE':'BOWL';
 const tops=randomToppings(r.maxToppings,container);
 if(container=='BOWL' && level>=3 && !tops.includes('Cone on Top') && randInt(5)==0 && tops.length<r.maxToppings)
  tops.push('Cone on Top');
 const flavors=scoops.map(shortName).join(' + ');
 return {
  name:`${flavors} ${container=='CONE'?'Cone':'Bowl'}`,
  need:scoops, kind:'SCOOP', container, toppings:tops
 };
}
function drinkOrder(){
 // Introduce only a couple recipes at a time. Level 2 is intentionally very small:
 // vanilla/chocolate shakes first, then sodas and mixed flavors in later levels.
 const recipeCount=
  level<=2?2:
  level==3?5:
  level==4?8:
  min(RECIPES.length,8+max(0,level-4)*2);
 const base=RECIPES[randInt(recipeCount)];
 const tops=base.kind=='BLEND'?randomToppings(ruleForLevel().maxToppings,'CUP'):[];
 return {name:base.name,need:[...base.need],kind:base.kind,container:'CUP',toppings:tops};
}
function buildOrder(){
 const r=ruleForLevel();
 if(r.scoopOnly)return plainOrder();
 // Later levels mix classic shakes/sodas and hand-dipped ice cream.
 return randInt(level>=3?3:2)==0?plainOrder():drinkOrder();
}

function setActivePartyMember(){
 partyIndex=min(partyIndex,party.length-1);
 guestName=party[partyIndex];
 order=partyOrders[partyIndex];
 guestStyle=0;
 resetCurrentOrderState();
 guestPhase='active';guestSlide=0;guestSlideTarget=0;waitingForNext=false;
 message=`${guestName}: I'd like a ${order.name}, please!`;
 messageTimer.set(2);
}

function resetCurrentOrderState(){
 tray=[];prepared=false;scoopLoaded=false;scoopFlavor='';
 holdingScoop=false;holdingMilk=false;holdingCup=false;cupFilled=false;
 holdingContainer='';containerFilled=false;addedToppings=[];
 blenderRunning=false;needsReset=false;heldVisualReady=false;
}

function startParty(arriving=false){
 const size=choosePartySize();
 party=chooseParty(size);
 partyOrders=party.map(()=>buildOrder());
 partyServed=party.map(()=>false);
 partyIndex=0;
 const partyTime=ruleForLevel().time;
 if(partyTime)partyDeadline=time+partyTime+max(0,size-1)*18;
 else partyDeadline=0;
 setActivePartyMember();
 if(arriving){
  guestPhase='arriving';guestSlide=3.1;guestSlideTarget=0;waitingForNext=true;
  message=party.length>1?`${party.length} customers are coming in!`:`${guestName} is coming in!`;
  messageTimer.set(1.5);
 }
}

function advanceAfterServe(){
 levelServed++;
 if(levelServed>=ruleForLevel().goal){
  const completedLevel=level;
  level++;
  levelServed=0;
  saveActiveProfile();
  finishRound(completedLevel);
  return;
 }
 const next=partyServed.findIndex(done=>!done);
 if(next>=0){
  partyIndex=next;
  setActivePartyMember();
  guestPhase='active';guestSlide=0;guestSlideTarget=0;waitingForNext=false;
  message=`Now make ${guestName}'s order!`;messageTimer.set(1.5);
 }else startParty(true);
}

 initMorganPhoto();

 canvasClearColor=hsl(.08,.18,.12);
 cameraPos=vec2(0,0);cameraScale=47;

}

function isScoopOrder(){return order&&order.kind=='SCOOP';}
function exactList(a,b){return [...a].sort().join('|')===[...b].sort().join('|');}
function toppingsComplete(){return exactList(addedToppings,order.toppings||[]);}
function ingredientsComplete(){return exactList(tray,order.need||[]);}

function missingIngredientV18(){
 if(!order)return '';
 return order.need.find(n=>!tray.includes(n) && n!=scoopFlavor && n!=holdingMilk)||'';
}
function missingToppingV18(){
 return (order.toppings||[]).find(t=>!addedToppings.includes(t))||'';
}

function kidStep(){
 if(levelBannerTimer.active())return `LEVEL ${level}!`;
 if(needsReset)return 'TAP RESET';
 if(waitingForNext){
  if(guestPhase=='thanks')return 'THE CUSTOMER SAYS THANK YOU!';
  if(guestPhase=='leaving')return 'NEXT CUSTOMER...';
  if(guestPhase=='arriving')return party.length>1?'THE GROUP IS COMING TO THE COUNTER!':'A NEW CUSTOMER IS COMING!';
 }
 if(!order)return 'WAITING FOR AN ORDER';

 if(isScoopOrder()){
  if(!holdingContainer)return `PICK UP A ${order.container}`;
  if(scoopLoaded)return 'TAP SERVE COUNTER TO PUT THE SCOOP IN';
  const miss=missingIngredientV18();
  if(miss){
   if(!holdingScoop)return 'PICK UP THE SCOOPER';
   return `SCOOP ${shortName(miss).toUpperCase()}`;
  }
  const mt=missingToppingV18();
  if(mt){
   if(holdingScoop)return 'SET THE SCOOPER DOWN';
   return `ADD ${mt.toUpperCase()}`;
  }
  if(holdingScoop)return 'SET THE SCOOPER DOWN';
  return 'TAKE IT TO THE CUSTOMER';
 }

 if(blenderRunning)return 'WAIT... IT IS BLENDING!';
 if(scoopLoaded)return `TAP ${order.kind=='MIX'?'MIX':'BLENDER'} TO ADD THE SCOOP`;
 if(holdingMilk)return `TAP ${order.kind=='MIX'?'MIX':'BLENDER'} TO POUR ${shortName(holdingMilk).toUpperCase()}`;
 const miss=missingIngredientV18();
 if(miss){
  const item=PANTRY.find(x=>x.name==miss);
  if(isScoopFlavor(item)){
   if(!holdingScoop)return 'PICK UP THE SCOOPER';
   return `SCOOP ${shortName(miss).toUpperCase()}`;
  }
  if(holdingScoop)return 'SET THE SCOOPER DOWN';
  return `PICK UP ${shortName(miss).toUpperCase()}`;
 }
 if(!prepared)return order.kind=='MIX'?'TAP MIX':'PRESS THE BLENDER BUTTON';
 if(!holdingContainer)return 'PICK UP A CUP';
 if(!containerFilled)return order.kind=='MIX'?'TAP MIX TO FILL THE CUP':'TAP BLENDER TO FILL THE CUP';
 const mt=missingToppingV18();
 if(mt)return `ADD ${mt.toUpperCase()}`;
 return 'TAKE IT TO THE CUSTOMER';
}

function kidTarget(){
 if(needsReset)return vec2(0,-5.12);
 if(waitingForNext||!order)return 0;
 if(isScoopOrder()){
  if(!holdingContainer)return selectedContainerPos[order.container];
  if(scoopLoaded)return vec2(3.8,1.2);
  const miss=missingIngredientV18();
  if(miss){
   const item=PANTRY.find(x=>x.name==miss);
   if(item&&isScoopFlavor(item)&&!holdingScoop)return vec2(-6.55,-4.77);
   if(item)return item.pos;
  }
  const mt=missingToppingV18();
  if(mt){
   const t=TOPPINGS.find(x=>x.name==mt);return t?t.pos:0;
  }
  return partyCustomerPos(partyIndex);
 }
 if(scoopLoaded||holdingMilk)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
 const miss=missingIngredientV18();
 if(miss){
  const item=PANTRY.find(x=>x.name==miss);
  if(item&&isScoopFlavor(item)&&!holdingScoop)return vec2(-6.55,-4.77);
  if(item&&isScoopFlavor(item))return item.pos;
  if(holdingScoop)return vec2(-6.55,-4.77);
  if(item)return item.pos;
 }
 if(!prepared)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
 if(!holdingContainer)return selectedContainerPos.CUP;
 if(!containerFilled)return order.kind=='MIX'?vec2(0,1.15):vec2(-3.8,1.15);
 const mt=missingToppingV18();
 if(mt){const t=TOPPINGS.find(x=>x.name==mt);return t?t.pos:0;}
 return partyCustomerPos(partyIndex);
}

function addIngredient(item){
 if(waitingForNext||needsReset)return;
 if(!order.need.includes(item.name)){
  roundMistakes++;
  message=`${shortName(item.name)} isn't in this order.`;messageTimer.set(1.5);playSfx(sndBad);return;
 }
 if(tray.includes(item.name)||scoopFlavor==item.name){
  message='That ingredient is already added.';messageTimer.set(1.3);return;
 }
 if(isScoopFlavor(item)){
  if(!holdingScoop){message='Pick up the scooper first.';messageTimer.set(1.4);return;}
  if(scoopLoaded){message='Use the scoop you already have first.';messageTimer.set(1.4);return;}
  scoopFlavor=item.name;scoopLoaded=true;playSfx(sndScoop);return;
 }
 if(holdingScoop){message='Set the scooper down first.';messageTimer.set(1.4);return;}
 if(holdingMilk){
  message=`Put ${shortName(holdingMilk)} in the ${order.kind=='MIX'?'mix station':'blender'} first.`;
  messageTimer.set(1.5);playSfx(sndBad);return;
 }
 holdingMilk=item.name;playSfx(sndPick);
}

function selectContainer(kind){
 if(!order)return;
 if(order.kind!='SCOOP'&&kind!='CUP'){
  // Wrong container taps teach the rule without costing a star.
  message='Shakes and sodas go in a cup.';messageTimer.set(1.4);playSfx(sndBad);return;
 }
 if(order.kind=='SCOOP' && kind=='CUP'){
  message='Plain ice cream goes in a bowl or cone.';messageTimer.set(1.4);playSfx(sndBad);return;
 }
 if(order.container!=kind){
  message=`This order needs a ${order.container}.`;messageTimer.set(1.4);playSfx(sndBad);return;
 }
 holdingContainer=kind;holdingCup=(kind=='CUP');pickupBounce.set(.3);heldVisualReady=false;message=`${kind.charAt(0)+kind.slice(1).toLowerCase()} picked up!`;messageTimer.set(1.2);playSfx(sndContainer);
}

function addTopping(t){
 if(!containerFilled){message='Finish the ice cream or drink first.';messageTimer.set(1.4);return;}
 if(!(order.toppings||[]).includes(t.name)){
  roundMistakes++;
  message=`No ${t.name} on this order.`;messageTimer.set(1.4);playSfx(sndBad);return;
 }
 if(addedToppings.includes(t.name)){message='That topping is already on it.';messageTimer.set(1.2);return;}
 addedToppings.push(t.name);playSfx(sndTopping);progressText=`✓ ${t.name}`;progressTimer.set(.7);
 if(containerFilled&&toppingsComplete()){
  message='Ready! Take it to the customer.';messageTimer.set(1.5);
 }
}

function serve(){
 if(waitingForNext)return;
 if(!holdingContainer||!containerFilled){
  message='Finish the order first.';messageTimer.set(1.5);playSfx(sndBad);return;
 }
 if(!ingredientsComplete()||holdingContainer!=order.container||!toppingsComplete()){
  roundMistakes++;needsReset=true;message='Almost! Tap RESET and try again.';messageTimer.set(1.8);playSfx(sndBad);return;
 }
 score+=100+level*10;served++;stars++;partyServed[partyIndex]=true;
 happyTimer.set(1.3);guestPhase='thanks';guestTimer.set(1.2);waitingForNext=true;
 saveActiveProfile();saveSession();showSavedToast();
 message=`${guestName}: Thank you!`;messageTimer.set(1.3);playSfx(sndServe);
 new ParticleEmitter(vec2(7.5,2.6),0,0,.1,65,PI,icons.spark,YELLOW,WHITE,rgb(1,1,0,0),rgb(1,1,1,0),.6,.14,.65,.1,0,1,1,0,PI,.08,.15,false,true);
}

function gameUpdate(){
 if(profileScreen){updateProfileScreen();return;}
 if(introScreen){updateIntroScreen();return;}
 if(resultsScreen){updateResultsScreen();return;}
 if(menuOpen){updateGameMenu();return;}

 if(Date.now()-lastAutoSaveAt>4000){lastAutoSaveAt=Date.now();saveSession();}

 // Audit: freeze the clock during non-interactive guest transitions so a
 // thank-you, exit, or arrival animation never steals playable order time.
 if(ruleForLevel().time && partyDeadline && waitingForNext &&
    (guestPhase=='thanks'||guestPhase=='leaving'||guestPhase=='arriving')){
  partyDeadline += timeDelta;
 }

 if(ruleForLevel().time && !waitingForNext && partyDeadline && time>partyDeadline){
  score=max(0,score-25);roundMistakes++;
  message='Time is up — a new group is coming!';messageTimer.set(2);
  startParty(true);
  return;
 }
 if(blenderRunning&&blenderTimer.elapsed()){
  blenderRunning=false;prepared=true;
  message='Ready! Pick up a cup.';
  messageTimer.set(1.6);
  playSfx(sndGood);
 }
 if(waitingForNext){
  if(guestPhase=='thanks'&&guestTimer.elapsed()){
   guestPhase='leaving';guestTimer.set(.8);
  }else if(guestPhase=='leaving'){
   guestSlide=lerp(guestSlide,3.2,.14);
   if(guestTimer.elapsed())advanceAfterServe();
  }else if(guestPhase=='arriving'){
   guestSlide=lerp(guestSlide,0,.12);
   if(guestSlide<.05){
    guestSlide=0;guestPhase='active';waitingForNext=false;
    message=`${guestName}: ${order.name}, please!`;messageTimer.set(1.5);
   }
  }
 }
 if(mouseWasPressed(0)&&hit(vec2(8.4,6.65),vec2(1.2,.72))){
  openGameMenu();return;
 }
 if(waitingForNext||!mouseWasPressed(0))return;

 // scoop tool
 if(hit(vec2(-6.55,-4.77),vec2(2.8,1.25))){
  if(holdingScoop&&scoopLoaded){
   message='Use the scoop you already have, or tap RESET.';
   messageTimer.set(1.6);playSfx(sndBad);return;
  }
  holdingScoop=!holdingScoop;
  playSfx(sndPick);return;
 }
 // reset
 if(hit(vec2(0,-5.12),vec2(2.0,1.0))){
  resetCurrentOrderState();message='Fresh start!';messageTimer.set(1.2);return;
 }
 // containers
 if(hit(selectedContainerPos.BOWL,vec2(1.35,1.2))){selectContainer('BOWL');return;}
 if(hit(selectedContainerPos.CUP,vec2(1.35,1.2))){selectContainer('CUP');return;}
 if(hit(selectedContainerPos.CONE,vec2(1.35,1.2))){selectContainer('CONE');return;}

 // toppings
 for(const t of TOPPINGS){
  if(hit(t.pos,vec2(1.7,1.05))){addTopping(t);return;}
 }

 // ingredients
 for(const item of PANTRY){
  if(hit(item.pos,vec2(2.0,1.7))){addIngredient(item);return;}
 }

 // Serve ledge doubles as scoop-into-container for plain ice cream.
 if(hit(vec2(3.8,1.2),vec2(2.5,1.8))){
  if(isScoopOrder()&&scoopLoaded&&holdingContainer){
   const placed=scoopFlavor;
   tray.push(placed);markAdded(placed,vec2(3.8,1.5));
   scoopLoaded=false;scoopFlavor='';
   holdingScoop=false; // scoop is now in the bowl/cone, not still on the scooper
   if(ingredientsComplete())containerFilled=true;
   message=`${shortName(placed)} placed in the ${holdingContainer.toLowerCase()}!`;
   messageTimer.set(1.4);playSfx(sndPlop);return;
  }
 }

 // Blender
 if(hit(vec2(-3.8,1.15),vec2(2.8,2.7))){
  if(order.kind!='BLEND'){message='This order uses MIX instead of the blender.';messageTimer.set(1.4);playSfx(sndBad);return;}
  if(holdingMilk){const x=holdingMilk;holdingMilk=false;tray.push(x);markAdded(x,vec2(-3.8,1.5));playSfx(sndPour);return;}
  if(scoopLoaded){const x=scoopFlavor;scoopLoaded=false;scoopFlavor='';tray.push(x);markAdded(x,vec2(-3.8,1.5));playSfx(sndPick);return;}
  if(!ingredientsComplete()){message=`Still need ${shortName(missingIngredientV18())}.`;messageTimer.set(1.4);return;}
  if(!prepared&&!blenderRunning){
   blenderRunning=true;blenderTimer.set(1.35);
   message='Blending...';messageTimer.set(1.35);playSfx(sndPrep);return;
  }
  if(prepared&&!holdingContainer){
   message='Pick up a cup first.';messageTimer.set(1.4);playSfx(sndBad);return;
  }
  if(prepared&&holdingContainer){
   containerFilled=true;playSfx(sndPour);
   if(order.kind!='SCOOP'){
    message=(order.toppings||[]).length
      ?'Add the topping, then take it to the customer!'
      :'Cup filled! Take it to the customer.';
    messageTimer.set(1.6);
   }
   return;
  }
 }
 // Mixer
 if(hit(vec2(0,1.15),vec2(2.8,2.7))){
  if(order.kind!='MIX'){message='This order uses the BLENDER instead of MIX.';messageTimer.set(1.4);playSfx(sndBad);return;}
  if(holdingMilk){const x=holdingMilk;holdingMilk=false;tray.push(x);markAdded(x,vec2(0,1.5));playSfx(sndPour);return;}
  if(scoopLoaded){const x=scoopFlavor;scoopLoaded=false;scoopFlavor='';tray.push(x);markAdded(x,vec2(0,1.5));playSfx(sndPick);return;}
  if(!ingredientsComplete()){message=`Still need ${shortName(missingIngredientV18())}.`;messageTimer.set(1.4);return;}
  if(!prepared){
   prepared=true;message='Mixed! Pick up a cup.';messageTimer.set(1.5);playSfx(sndMix);return;
  }
  if(prepared&&!holdingContainer){
   message='Pick up a cup first.';messageTimer.set(1.4);playSfx(sndBad);return;
  }
  if(prepared&&holdingContainer){
   containerFilled=true;playSfx(sndPour);
   if(order.kind!='SCOOP'){
    message=(order.toppings||[]).length
      ?'Add the topping, then take it to the customer!'
      :'Cup filled! Take it to the customer.';
    messageTimer.set(1.6);
   }
   return;
  }
 }

 // Every finished order is handed to the correct person.
 // This keeps bowls, cones, shakes, and sodas on the same simple loop.
 if(order){
  for(let i=0;i<party.length;i++){
   if(partyServed[i])continue;
   const p=partyCustomerPos(i);
   if(hit(p,vec2(1.45,3.1))){
    if(i!=partyIndex){
     if(finishedOrderReady())roundMistakes++;
     playSfx(sndWrongPerson);
     message=finishedOrderReady()
       ?`That's ${guestName}'s order — give it to ${guestName}!`
       :`You're making ${guestName}'s order first.`;
     messageTimer.set(1.8);
     return;
    }
    serve();return;
   }
  }
 }
}

function drawOpenIceTub(pos,color,ripple=false){
 // Clean, smooth hand-dipped ice cream — no scribble lines.
 drawSoftShadow(pos.add(vec2(0,-.14)),vec2(1.62,.36));
 drawRect(pos.add(vec2(0,-.2)),vec2(1.54,.8),hsl(.55,.08,.72));
 drawRect(pos.add(vec2(0,-.02)),vec2(1.42,.5),hsl(.55,.12,.91));
 // three soft overlapping mounds
 drawTile(pos.add(vec2(-.37,.16)),vec2(.68),icons.circle,color);
 drawTile(pos.add(vec2(.02,.22)),vec2(.78),icons.circle,color);
 drawTile(pos.add(vec2(.4,.14)),vec2(.62),icons.circle,color);
 drawTile(pos.add(vec2(-.15,.34)),vec2(.18),icons.glow,WHITE);
 if(ripple){
  drawLine(pos.add(vec2(-.5,.18)),pos.add(vec2(.45,.22)),.055,hsl(.96,.72,.5));
  drawLine(pos.add(vec2(-.2,.34)),pos.add(vec2(.32,.08)),.045,hsl(.96,.72,.5));
 }
 drawLine(pos.add(vec2(-.68,.31)),pos.add(vec2(.68,.31)),.05,WHITE);
}

function drawToppingBar(){
 drawText('TOPPINGS',vec2(0,-3.3),.22,hsl(.07,.48,.22));
 for(const t of TOPPINGS){
  const needed=order&&(order.toppings||[]).includes(t.name);
  drawRect(t.pos,vec2(1.45,.7),needed?hsl(.12,.2,.96):hsl(.1,.05,.88));
  if(t.name=='Rainbow Sprinkles'){
   for(let i=0;i<6;i++)drawLine(t.pos.add(vec2(-.45+i*.18,.05)),t.pos.add(vec2(-.38+i*.18,.18)),.045,[RED,YELLOW,hsl(.34,.7,.5),hsl(.55,.7,.55),hsl(.8,.6,.6),hsl(.03,.7,.55)][i]);
  }else if(t.name=='Chocolate Sprinkles'){
   for(let i=0;i<6;i++)drawLine(t.pos.add(vec2(-.45+i*.18,.05)),t.pos.add(vec2(-.38+i*.18,.18)),.045,hsl(.07,.5,.28));
  }else if(t.name=='Whipped Cream'){
   drawTile(t.pos.add(vec2(0,.08)),vec2(.5),icons.glow,WHITE);
  }else if(t.name=='Cone on Top'){
   drawTile(t.pos.add(vec2(0,.06)),vec2(.38),icons.triangle,hsl(.09,.55,.68),0);
  }else{
   drawTile(t.pos.add(vec2(0,.06)),vec2(.32),icons.circle,RED);
  }
  if(addedToppings.includes(t.name)){
   drawTile(t.pos.add(vec2(.52,.22)),vec2(.25),icons.circle,hsl(.34,.7,.5));
  }
  drawText(t.name.replace(' Sprinkles',''),t.pos.add(vec2(0,-.25)),.12,BLACK);
 }
}

 drawText('CONE',selectedContainerPos.CONE.add(vec2(0,-.46)),.14,BLACK);
}

function drawOrderExtras(){
 if(!order||guestPhase!='active')return;
 const y=2.52;
 drawText(order.container=='CONE'?'CONE':order.container=='BOWL'?'BOWL':'CUP',vec2(-1.35,y),.17,hsl(.07,.45,.2));
 const tops=(order.toppings||[]).length?(order.toppings||[]).join(' + '):'No toppings';
 drawText(tops,vec2(1.25,y),.14,hsl(.07,.38,.24));
}


function iceColorFor(name){
 return name.includes('Chocolate')?hsl(.07,.55,.25):
        name.includes('Strawberry')?hsl(.97,.7,.65):
        name.includes('Raspberry')?hsl(.96,.65,.82):
        hsl(.12,.22,.94);
}
function drawFinishedItemAt(pos,scale=1,container=holdingContainer,contents=tray,tops=addedToppings,kind=(order&&order.kind)||'SCOOP'){
 const colors=(contents||[]).filter(n=>n.includes('Ice Cream')||n=='Raspberry Ripple').map(iceColorFor);

 if(container=='CONE'){
  drawTile(pos.add(vec2(0,-.24*scale)),vec2(.72*scale,.82*scale),icons.triangle,hsl(.09,.55,.68),PI);
  drawLine(pos.add(vec2(-.19*scale,-.12*scale)),pos.add(vec2(.17*scale,-.48*scale)),.024*scale,hsl(.08,.35,.42));
  drawLine(pos.add(vec2(.19*scale,-.12*scale)),pos.add(vec2(-.17*scale,-.48*scale)),.024*scale,hsl(.08,.35,.42));
  colors.forEach((c,i)=>drawIceCreamScoop(pos.add(vec2((i-.5*(colors.length-1))*.3*scale,.22*scale+i*.05*scale)),c));
 }
 else if(container=='BOWL'){
  drawEmptyBowl(pos,.95*scale);
  colors.forEach((c,i)=>drawIceCreamScoop(pos.add(vec2((i-.5*(colors.length-1))*.31*scale,.3*scale)),c));
 }
 else if(container=='CUP'){
  if(kind=='BLEND'){
   // A shake keeps its shake presentation.
   drawClassicShake(pos,true,.82*scale);
  }else{
   // Soda/mixed drink stays a cup rather than becoming a shake.
   drawEmptyCup(pos,.92*scale,true);
  }
 }

 if((tops||[]).includes('Cone on Top') && container=='BOWL')
  drawTile(pos.add(vec2(.05*scale,.77*scale)),vec2(.5*scale,.58*scale),icons.triangle,hsl(.09,.55,.68),0);
 if((tops||[]).includes('Whipped Cream'))
  drawTile(pos.add(vec2(0,.64*scale)),vec2(.46*scale),icons.glow,WHITE);
 if((tops||[]).includes('Cherry'))
  drawTile(pos.add(vec2(.12*scale,.86*scale)),vec2(.16*scale),icons.circle,RED);
}
function drawCurrentHeldContainer(){
 if(!holdingContainer || waitingForNext)return;
 const pos=heldVisualReady?heldVisualPos:mousePos;

 if(!containerFilled){
  if(holdingContainer=='BOWL')drawEmptyBowl(pos,.92);
  else if(holdingContainer=='CONE'){
   drawTile(pos.add(vec2(0,-.22)),vec2(.7,.78),icons.triangle,hsl(.09,.55,.68),PI);
   drawLine(pos.add(vec2(-.18,-.12)),pos.add(vec2(.16,-.45)),.025,hsl(.08,.35,.42));
   drawLine(pos.add(vec2(.18,-.12)),pos.add(vec2(-.16,-.45)),.025,hsl(.08,.35,.42));
  }
  else drawEmptyCup(pos,.92,false);
  return;
 }
 drawFinishedItemAt(pos,1,holdingContainer,tray,addedToppings,order&&order.kind);
}
function gameRenderPost(){
 if(profileScreen||introScreen||resultsScreen)return;

 drawTextScreen(`Level ${level}   •   ${levelServed}/${ruleForLevel().goal} this level   •   SERVED ${served}   •   Score ${score}`,vec2(mainCanvasSize.x/2,20),15,WHITE,2,BLACK);
 if(ruleForLevel().time&&partyDeadline&&!waitingForNext){
  const left=max(0,ceil(partyDeadline-time));
  drawTextScreen(`TIME ${left}`,vec2(mainCanvasSize.x-70,20),15,left<15?YELLOW:WHITE,2,BLACK);
 }
 if(levelBannerTimer.active())
  drawTextScreen(`LEVEL ${level}!`,vec2(mainCanvasSize.x/2,70),30,YELLOW,4,BLACK);
 drawTextScreen(party.length>1?`PARTY OF ${party.length} • ${partyServed.filter(Boolean).length}/${party.length} SERVED`:'ONE CUSTOMER',vec2(120,20),13,WHITE,2,BLACK);
 drawCurrentHeldContainer();
 if(menuOpen)drawGameMenuOverlay();
 if(savedToastUntil>Date.now()){
  drawRect(vec2(7.55,-5.9),vec2(2.0,.58),hsl(.34,.35,.22,.92));
  drawText('SAVED',vec2(7.55,-5.9),.18,WHITE);
 }
}

engineInit(gameInit,gameUpdate,gameUpdatePost,gameRender,gameRenderPost);

</script></body>
