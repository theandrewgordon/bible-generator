name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py build_pdf.py build_games.py faithsparks tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run desktop and phone browser checks
        run: npm run test:browser --prefix frontend
      - name: Check Scroll Quest membership, gameplay, and account saves
        run: node tests/scroll_quest_browser.cjs
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
      - name: Check generated page assets are current
        run: git diff --exit-code -- static/dist
      - run: npm ci --prefix frontend/learning-labs
      - run: npm test --prefix frontend/learning-labs
      - run: npm run build --prefix frontend/learning-labs
      - run: node tests/math_fact_adventure_levels.cjs
      - run: node tests/latin_quest_core.cjs
      - run: node tests/latin_quest_voice.cjs
      - run: node tests/reading_quest_audio.cjs
      - run: node tests/same_brain_runtime.cjs
      - run: node tests/same_brain_narration.cjs
      - run: node tests/same_brain_sharing.cjs
      - run: node scripts/audit_same_brain.cjs
      - run: python -m pytest -q
