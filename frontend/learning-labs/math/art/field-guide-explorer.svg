   <g font-family="Georgia, serif" font-size="10.8" font-style="italic" stroke="none">
     <text x="36" y="128">3 · 5 · 8 · 13</text>
     <text x="103" y="128">34 / 55</text>
     <text x="43" y="224">6 sides · 120°</text>
     <text x="209" y="133">≈ reflection</text>
     <text x="270" y="137">1 → 2 → 4 → 8</text>
     <text x="207" y="224">r increases ↗</text>
   </g>
