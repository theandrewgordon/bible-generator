<radialGradient id="brass"><stop stop-color="#ffe1a0"/><stop offset=".67" stop-color="#c48b39"/><stop offset="1" stop-color="#8d5e26"/></radialGradient>
<filter id="wash"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="6" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
<filter id="shadow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
