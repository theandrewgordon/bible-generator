<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Watercolor explorer field journal with ink drawings of mathematical patterns in nature, a topographic map, cartographer dividers, ruler, protractor, binoculars, and compass">
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7dc"/><stop offset="1" stop-color="#e8ce92"/></linearGradient>
